// --- Blangko Daftar Nilai (blangko nilai kosong, jumlah kolom nilai dinamis) ---
// Helper bersama (dipakai oleh preview sidebar, PDF, dan Word) untuk membangun tabel
// Blangko Daftar Nilai dengan struktur kolom TP berdasarkan jumlah Sumatif Harian (SH),
// Sumatif Tengah Semester (STS), dan Sumatif Akhir Semester (SAS), plus Rekapan TP yang
// jumlah kolomnya mengikuti jumlah TP Sumatif Harian. Dibuat sebagai fungsi terpisah agar
// tidak menduplikasi markup tabel di 3 tempat (preview, cetakBlangkoNilai, downloadBlangkoNilaiWord).
// borderColor/borderColorLight membedakan gaya preview (abu-abu) vs cetak PDF/Word (hitam pekat).
window._buildBlangkoNilaiTableHTML = function(students, opts) {
    opts = opts || {};
    const bMain = opts.borderColor || '#999';   // border header & sel utama (No/Nama/NISN)
    const bCell = opts.borderColorLight || '#ccc'; // border sel isian kosong
    const fontSizeTh = opts.fontSizeTh || '10px';
    const fontSizeTable = opts.fontSizeTable || '11px';
    const cellHeight = opts.cellHeight || '28px';

    let jmlSH = Math.min(15, Math.max(0, parseInt(blangkoNilaiSH) || 0));
    let jmlSTS = Math.min(15, Math.max(0, parseInt(blangkoNilaiSTS) || 0));
    let jmlSAS = Math.min(15, Math.max(0, parseInt(blangkoNilaiSAS) || 0));
    let jmlRekap = jmlSH; // Rekapan TP mengikuti jumlah TP Sumatif Harian

    let totalDataCols = Math.max(1, jmlSH) + Math.max(1, jmlSTS) + Math.max(1, jmlSAS) + Math.max(1, jmlRekap);

    // PERBAIKAN: kolom TP dibuat SAMA BESAR (lebar %) memakai table-layout:fixed, bukan lagi
    // min-width:40px yang membuat lebar antar kolom TP bisa berbeda-beda tergantung isi.
    // Sisa lebar (di luar No/Nama Siswa/NISN/NR yang punya lebar tetap) dibagi rata ke semua
    // kolom TP.
    const wNo = 4, wNama = 20, wNR = 6;
    const wTPtotal = 100 - wNo - wNama - wNR;
    const wTP = (wTPtotal / totalDataCols).toFixed(3);

    const thTP = (n, extra) => `<th style="border:1px solid ${bMain}; padding:4px; width:${wTP}%; font-size:${fontSizeTh}; white-space:nowrap;">${extra || ('TP ' + n)}</th>`;

    // Header grup (Sumatif Harian / Sumatif Tengah Semester / Sumatif Akhir Semester) dibuat
    // wrap-text 2 baris (white-space:normal + word-wrap:break-word) supaya tulisan tidak
    // terpotong/terhalang saat kolom TP di bawahnya sempit karena jumlah TP banyak.
    const thGroupStyle = `border:1px solid ${bMain}; padding:4px; font-size:${fontSizeTh}; white-space:normal; word-wrap:break-word; line-height:1.25;`;
    let groupSH = `<th colspan="${Math.max(1, jmlSH)}" style="${thGroupStyle}">Sumatif Harian</th>`;
    let groupSTS = `<th colspan="${Math.max(1, jmlSTS)}" style="${thGroupStyle}">Sumatif Tengah Semester</th>`;
    let groupSAS = `<th colspan="${Math.max(1, jmlSAS)}" style="${thGroupStyle}">Sumatif Akhir Semester</th>`;
    let groupRekap = `<th colspan="${Math.max(1, jmlRekap)}" style="${thGroupStyle}">Rekapan TP</th>`;

    let subSH = jmlSH > 0 ? Array.from({length: jmlSH}, (_, i) => thTP(i + 1)).join('') : thTP(null, '-');
    let subSTS = jmlSTS > 0 ? Array.from({length: jmlSTS}, (_, i) => thTP(i + 1)).join('') : thTP(null, '-');
    let subSAS = jmlSAS > 0 ? Array.from({length: jmlSAS}, (_, i) => thTP(i + 1)).join('') : thTP(null, '-');
    let subRekap = jmlRekap > 0 ? Array.from({length: jmlRekap}, (_, i) => thTP(i + 1)).join('') : thTP(null, '-');

    let tbodyRows = '';
    if (students.length) {
        students.forEach((s, idx) => {
            let cells = '';
            for (let k = 0; k < totalDataCols; k++) { cells += `<td style="border:1px solid ${bCell}; height:${cellHeight};"></td>`; }
            tbodyRows += `<tr style="page-break-inside:avoid; mso-row-break-inside:avoid;"><td style="border:1px solid ${bMain}; padding:4px; text-align:center;">${idx + 1}</td><td style="border:1px solid ${bMain}; padding:4px; text-align:left; white-space:nowrap;">${s.nama}</td>${cells}<td style="border:1px solid ${bCell}; height:${cellHeight};"></td></tr>`;
        });
    } else {
        tbodyRows = `<tr><td colspan="${totalDataCols + 3}" style="border:1px solid ${bMain}; padding:8px; text-align:center; color:#999;">Belum ada data siswa</td></tr>`;
    }

    // PERBAIKAN: header "No", "Nama Siswa", "NISN", "NR" TIDAK lagi memakai rowspan="2".
    // rowspan pada <th> terbukti sering membuat judul terpotong/hilang & border tidak konsisten
    // saat ditangkap html2canvas (Download PDF) maupun saat dibuka di Word — persis masalah yang
    // sudah pernah diperbaiki pada Blangko Absen (lihat catatan di window._buildBlangkoAbsenCore).
    // Polanya disamakan: baris header 1 berisi judul (border-bottom:none), baris header 2 berisi
    // sel kosong dengan tinggi kecil (border-top:none) sehingga secara visual tetap terlihat
    // menyatu 2 baris, tapi tanpa rowspan sama sekali.
    return `
        <table style="width:100%; table-layout:fixed; border-collapse:collapse; border:1px solid ${bMain}; font-size:${fontSizeTable};">
            <thead>
                <tr style="background-color:#f2f2f2;">
                    <th style="border:1px solid ${bMain}; border-bottom:none; padding:4px; width:${wNo}%;">No</th>
                    <th style="border:1px solid ${bMain}; border-bottom:none; padding:4px; width:${wNama}%;">Nama Siswa</th>
                    ${groupSH}${groupSTS}${groupSAS}${groupRekap}
                    <th style="border:1px solid ${bMain}; border-bottom:none; padding:4px; width:${wNR}%;">NR</th>
                </tr>
                <tr style="background-color:#f2f2f2;">
                    <th style="border:1px solid ${bMain}; border-top:none; padding:0;"></th>
                    <th style="border:1px solid ${bMain}; border-top:none; padding:0;"></th>
                    ${subSH}${subSTS}${subSAS}${subRekap}
                    <th style="border:1px solid ${bMain}; border-top:none; padding:0;"></th>
                </tr>
            </thead>
            <tbody>${tbodyRows}</tbody>
        </table>
    `;
};

// Render HTML preview kontrol + cover — dipanggil dari renderGuruBlangko
window._buildBlangkoCoverHTML = function() {
    const s = getDB('mc_settings').find(function(x){ return x.username === currentUserUsername && (!x.schoolCode || x.schoolCode === currentSchoolCode); }) || {};

    // Nilai dari settings atau custom override
    const sekolah = blangkoCoverCustomSekolah || s.sekolah || 'NAMA SEKOLAH';
    const skpd    = blangkoCoverCustomSKPD    || (s.skpd   || 'PEMERINTAH / DINAS PENDIDIKAN').replace(/\n/g,' | ');
    const alamat  = blangkoCoverCustomAlamat  || s.alamat  || '';
    const npsn    = blangkoCoverCustomNPSN    || s.npsn    || '';

    // Logo tunggal di tengah
    function getLogoSrc(type) {
        if (type === 'pemda'   && s.logoKiri  && s.logoKiri.startsWith('data:'))  return s.logoKiri;
        if (type === 'sekolah' && s.logoKanan && s.logoKanan.startsWith('data:')) return s.logoKanan;
        if (type === 'keduanya') {
            if (s.logoKanan && s.logoKanan.startsWith('data:')) return s.logoKanan;
            if (s.logoKiri  && s.logoKiri.startsWith('data:'))  return s.logoKiri;
        }
        return '';
    }
    const logoSrc = getLogoSrc(blangkoCoverLogoType);

    // Border CSS untuk preview (bukan Word — Word pakai XML border di preHtml terpisah)
    function getBorderCSS(style) {
        const base = 'box-sizing:border-box; padding:20px 16px;';
        if (style === 'none')   return base;
        if (style === 'single') return base + 'border:2px solid #222;';
        if (style === 'double') return base + 'border:4px double #111; outline:2px solid #111; outline-offset:-8px;';
        if (style === 'thick')  return base + 'border:8px solid #111;';
        if (style === 'ornate') return base + 'border:4px solid #8B6914; box-shadow:inset 0 0 0 4px #f5e6a0,inset 0 0 0 8px #8B6914;';
        if (style === 'shadow') return base + 'border:3px solid #334155; box-shadow:6px 6px 0 #334155;';
        return base;
    }

    const isLandscape = blangkoCoverOrientasi === 'landscape';
    const pgW = isLandscape ? 297 : 210;
    const pgH = isLandscape ? 210 : 297;
    const previewMaxW = 620;
    const scale = previewMaxW / pgW;
    const previewW = Math.round(pgW * scale);
    const previewH = Math.round(pgH * scale);
    const bCss = getBorderCSS(blangkoCoverBorder);

    // Border pilihan untuk UI
    const borderOptions = [
        { val:'none',   icon:'⬜', label:'Polos' },
        { val:'single', icon:'▢',  label:'Tunggal' },
        { val:'double', icon:'⊡',  label:'Ganda' },
        { val:'thick',  icon:'■',  label:'Tebal' },
        { val:'ornate', icon:'✦',  label:'Emas' },
        { val:'shadow', icon:'◼',  label:'Shadow' },
    ];
    const borderBtns = borderOptions.map(b => {
        const act = blangkoCoverBorder === b.val;
        const cls = act ? 'border-2 border-purple-600 bg-purple-50 text-purple-700 font-bold' : 'border border-gray-200 hover:border-purple-300 text-gray-600';
        return `<button onclick="blangkoCoverBorder='${b.val}'; setSafe('mc_cover_border','${b.val}'); window.navTo('renderGuruBlangko')" class="flex flex-col items-center gap-0.5 px-2 py-2 rounded-lg text-xs transition ${cls}"><span style="font-size:17px;">${b.icon}</span>${b.label}</button>`;
    }).join('');

    // Logo type
    const logoTypes = [
        { val:'keduanya', label:'Auto' },
        { val:'pemda',    label:'Pemda' },
        { val:'sekolah',  label:'Sekolah' },
        { val:'none',     label:'Tanpa' },
    ];
    const logoBtns = logoTypes.map(lt => {
        const act = blangkoCoverLogoType === lt.val;
        const cls = act ? 'bg-purple-600 text-white font-bold' : 'bg-white text-purple-600 border border-purple-300 hover:bg-purple-50';

// Bangun blok-blok preview (skala kecil), dengan handle drag-drop untuk reorder
window._buildCoverPreviewHTML = function(o) {
    const { sekolah, skpd, alamat, npsn, logoSrc, scale, previewW, previewH } = o;
    const tahunCetak = (o.tahunCetak !== undefined && o.tahunCetak !== null) ? o.tahunCetak : blangkoCoverTahunCetak;
    const sp = function(n){ return Math.max(1, Math.round(n * scale)); };
    const fJudul       = Math.max(4, Math.round(blangkoCoverSzJudul     * scale * 0.8));
    const fSub         = Math.max(4, Math.round(blangkoCoverSzSubJudul  * scale * 0.8));
    const fTahun       = Math.max(4, Math.round(blangkoCoverSzThnAjaran * scale * 0.8));
    const fSekolah     = Math.max(4, Math.round(blangkoCoverSzSekolah   * scale * 0.8));
    const fAlamat      = Math.max(4, Math.round(blangkoCoverSzAlamat    * scale * 0.8));
    const fNpsn        = Math.max(4, Math.round(blangkoCoverSzAlamat    * scale * 0.8));
    const fSkpd        = Math.max(4, Math.round(blangkoCoverSzSKPD      * scale * 0.8));
    const fFooterTahun = Math.max(4, Math.round(blangkoCoverSzThnCetak  * scale * 0.8));
    const logoSz   = Math.max(30, Math.round(blangkoCoverLogoSize * scale));

    const blocks = {
        title: `<div id="coverBlock_title" class="cover-block" draggable="true" style="text-align:center; padding:${sp(4)}px ${sp(2)}px; line-height:1.5; font-family:'${blangkoCoverFontAbove}',serif;">
            <span class="cover-drag-handle" title="Drag untuk pindah">≡</span>
            <span style="font-size:${fJudul}px; font-weight:bold; text-transform:uppercase; letter-spacing:${sp(1)}px;">${blangkoCoverJudul||'COVER'}</span><br>
            ${blangkoCoverSubJudul ? `<span style="font-size:${fSub}px; font-weight:bold; text-transform:uppercase;">${blangkoCoverSubJudul}</span><br>` : ''}
            ${blangkoCoverTahunAjaran ? `<span style="font-size:${fTahun}px; font-weight:bold;">TAHUN PELAJARAN ${blangkoCoverTahunAjaran}</span>` : ''}
        </div>`,
        logo: `<div id="coverBlock_logo" class="cover-block" draggable="true" style="text-align:center; padding-top:${sp(blangkoCoverSpaceLogoT)}px; padding-bottom:${sp(blangkoCoverSpaceLogoB)}px; padding-left:0; padding-right:0; flex-shrink:0; position:relative;">
            <span class="cover-drag-handle" title="Drag untuk urut ulang">≡</span>
            <div style="display:inline-block; position:relative; vertical-align:middle;" id="coverLogoWrap">
                ${logoSrc && logoSrc.startsWith('data:')
                    ? `<img src="${logoSrc}" id="coverLogoImg" style="width:${logoSz}px; height:${logoSz}px; object-fit:contain; display:block;">`
                    : `<div id="coverLogoImg" style="width:${logoSz}px; height:${logoSz}px; border:${sp(1)}px dashed #bbb; display:flex; align-items:center; justify-content:center; font-size:${sp(8)}px; color:#bbb;">Logo</div>`}
                <div id="coverLogoResizeHandle" title="Drag untuk perbesar/perkecil logo"
                    style="position:absolute; bottom:-4px; right:-4px; width:${sp(12)}px; height:${sp(12)}px;

                        <line x1="5" y1="7" x2="7" y2="5" stroke="white" stroke-width="1.5"/>

        </div>`,
        school: `<div id="coverBlock_school" class="cover-block" draggable="true" style="text-align:center; padding:${sp(4)}px ${sp(2)}px; line-height:1.6; font-family:'${blangkoCoverFontBelow}',serif;">
            <span class="cover-drag-handle" title="Drag untuk pindah">≡</span>

    };

    const order = (Array.isArray(blangkoCoverBlockOrder) && blangkoCoverBlockOrder.length === 3)

    const footerHTML = (skpd || tahunCetak) ? `<div id="coverBlock_footer" style="text-align:center; padding:${sp(4)}px ${sp(2)}px; padding-top:${sp(blangkoCoverSpaceAlamatSKPD)}px; line-height:1.6; font-family:'${blangkoCoverFontSKPD}',serif;">
            ${skpd ? `<span style="font-size:${fSkpd}px; font-weight:bold; text-transform:uppercase; display:block;">${skpd}</span>` : ''}

        ? `display:flex; flex-direction:column; justify-content:space-between; height:100%;`

// Toggle buka/tutup panel Pengaturan Cover (accordion, ikon V <-> V terbalik)
window._toggleCoverPanel = function() {
    const panel = document.getElementById('coverControlsPanel');
    const chevron = document.getElementById('coverChevron');
    if (!panel) return;
    const willOpen = panel.classList.contains('hidden');
    if (willOpen) {
        panel.classList.remove('hidden');
        if (chevron) chevron.classList.add('rotate-180');
    } else {
        panel.classList.add('hidden');
        if (chevron) chevron.classList.remove('rotate-180');
    }
    blangkoCoverPanelOpen = willOpen;
    setSafe('mc_cover_panelopen', willOpen ? '1' : '0');
    setTimeout(function(){ if (window._fitCoverPreview) window._fitCoverPreview(); }, 50);
};

// Refresh preview saat input berubah (smooth, tanpa full re-render)
window._refreshCoverPreview = function() {
    const s = getDB('mc_settings').find(function(x){ return x.username === currentUserUsername && (!x.schoolCode || x.schoolCode === currentSchoolCode); }) || {};
    const sekolah = blangkoCoverCustomSekolah || s.sekolah || 'NAMA SEKOLAH';
    const skpd    = blangkoCoverCustomSKPD    || (s.skpd   || 'PEMERINTAH / DINAS PENDIDIKAN').replace(/\n/g,' | ');
    const alamat  = blangkoCoverCustomAlamat  || s.alamat  || '';
    const npsn    = blangkoCoverCustomNPSN    || s.npsn    || '';
    const isLandscape = blangkoCoverOrientasi === 'landscape';
    const pgW = isLandscape ? 297 : 210;
    const scale = 360 / pgW;
    const previewW = Math.round(pgW * scale);
    const previewH = Math.round((isLandscape ? 210 : 297) * scale);
    function getLogoSrc(type) {
        if (type === 'pemda'   && s.logoKiri  && s.logoKiri.startsWith('data:'))  return s.logoKiri;
        if (type === 'sekolah' && s.logoKanan && s.logoKanan.startsWith('data:')) return s.logoKanan;
        if (type === 'keduanya') {
            if (s.logoKanan && s.logoKanan.startsWith('data:')) return s.logoKanan;
            if (s.logoKiri  && s.logoKiri.startsWith('data:'))  return s.logoKiri;
        }
        return '';
    }
    const logoSrc = getLogoSrc(blangkoCoverLogoType);
    const wrap = document.getElementById('coverPreviewWrapper');
    if (!wrap) return;
    const container = document.getElementById('coverBlocksContainer');
    if (!container) return;
    container.innerHTML = '';
    const newHTML = window._buildCoverPreviewHTML({ sekolah, skpd, alamat, npsn, logoSrc, scale, previewW, previewH, tahunCetak: blangkoCoverTahunCetak });
    const tmp = document.createElement('div');
    tmp.innerHTML = newHTML;
    const newContainer = tmp.querySelector('#coverBlocksContainer');
    if (newContainer) {
        container.innerHTML = newContainer.innerHTML;
        container.style.cssText = newContainer.style.cssText;
    }
    window._initCoverDragDrop();
    window._fitCoverPreview();
};

// Skala proporsional preview agar SEMUA tulisan (termasuk blok footer Dinas+Tahun) selalu
// muat di dalam kotak preview, walau kombinasi teks/logo membuat konten lebih tinggi dari kotak.
// Tidak mengubah ukuran font asli — hanya melakukan transform:scale pada wrapper jika perlu (shrink-to-fit).
window._fitCoverPreview = function() {
    const outer = document.getElementById('coverPreviewWrapper');
    const inner = document.getElementById('coverScaleFit');
    if (!outer || !inner) return;
    // Reset dulu supaya pengukuran natural (tanpa transform sebelumnya)
    inner.style.transform = 'none';
    const cs = window.getComputedStyle(outer);
    const padTop = parseFloat(cs.paddingTop) || 0;
    const padBottom = parseFloat(cs.paddingBottom) || 0;
    const availH = outer.clientHeight - padTop - padBottom;
    const contentH = inner.scrollHeight;
    if (contentH > availH && availH > 0) {
        const ratio = Math.max(0.5, availH / contentH);
        inner.style.transform = 'scale(' + ratio + ')';
    } else {
        inner.style.transform = 'none';
    }
};

// Init drag-drop reorder pada blok preview
window._initCoverDragDrop = function() {
    const container = document.getElementById('coverBlocksContainer');
    if (!container) return;
    const blocks = container.querySelectorAll('.cover-block');
    let dragSrc = null;
    blocks.forEach(function(block) {
        block.addEventListener('dragstart', function(e) {
            dragSrc = block;
            block.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', block.id);
        });
        block.addEventListener('dragend', function() {
            block.classList.remove('dragging');
            container.querySelectorAll('.cover-block').forEach(function(b){ b.classList.remove('drag-over'); });
        });
        block.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (block !== dragSrc) { block.classList.add('drag-over'); }
        });
        block.addEventListener('dragleave', function() { block.classList.remove('drag-over'); });
        block.addEventListener('drop', function(e) {
            e.preventDefault();
            block.classList.remove('drag-over');
            if (!dragSrc || dragSrc === block) return;
            // Determine new order from DOM
            const allBlocks = Array.from(container.querySelectorAll('.cover-block'));
            const srcIdx = allBlocks.indexOf(dragSrc);
            const tgtIdx = allBlocks.indexOf(block);
            if (srcIdx < 0 || tgtIdx < 0) return;
            // Reorder in DOM
            if (srcIdx < tgtIdx) {
                block.parentNode.insertBefore(dragSrc, block.nextSibling);
            } else {
                block.parentNode.insertBefore(dragSrc, block);
            }
            // Save new order
            const newOrder = Array.from(container.querySelectorAll('.cover-block')).map(function(b){
                return b.id.replace('coverBlock_','');
            });
            blangkoCoverBlockOrder = newOrder;
            setSafe('mc_cover_order', newOrder.join(','));
        });
    });

    // Logo resize via drag pada handle pojok kanan bawah
    const resizeHandle = document.getElementById('coverLogoResizeHandle');
    const logoImg      = document.getElementById('coverLogoImg');
    if (resizeHandle && logoImg) {
        let _rDragging = false, _rStartX = 0, _rStartSz = 0;
        resizeHandle.addEventListener('mousedown', function(e) {
            e.stopPropagation(); // jangan trigger block drag-drop
            e.preventDefault();
            _rDragging = true;
            _rStartX   = e.clientX;
            _rStartSz  = blangkoCoverLogoSize || 120;
            document.addEventListener('mousemove', _onResizeMove);
            document.addEventListener('mouseup',   _onResizeUp);
        });
        // Touch support (mobile)
        resizeHandle.addEventListener('touchstart', function(e) {
            e.stopPropagation(); e.preventDefault();
            _rDragging = true;
            _rStartX   = e.touches[0].clientX;
            _rStartSz  = blangkoCoverLogoSize || 120;
            document.addEventListener('touchmove',  _onResizeMoveT, { passive: false });
            document.addEventListener('touchend',   _onResizeUp);
        }, { passive: false });
        function _onResizeMove(e) {
            if (!_rDragging) return;
            const dx = e.clientX - _rStartX;
            const newSz = Math.min(220, Math.max(40, Math.round(_rStartSz + dx)));
            blangkoCoverLogoSize = newSz;
            setSafe('mc_cover_logosize', String(newSz));
            // Live update logo size in preview
            const sz = Math.max(30, Math.round(newSz * _coverPreviewScale()));
            logoImg.style.width  = sz + 'px';
            logoImg.style.height = sz + 'px';
            // Update slider if visible
            const slider = document.querySelector('input[type="range"][oninput*="blangkoCoverLogoSize"]');
            if (slider) { slider.value = newSz; }
            const lbl = document.getElementById('logoSizeLbl');
            if (lbl) lbl.textContent = newSz;
            if (window._fitCoverPreview) window._fitCoverPreview();
        }
        function _onResizeMoveT(e) {
            e.preventDefault();
            const dx = e.touches[0].clientX - _rStartX;
            const newSz = Math.min(220, Math.max(40, Math.round(_rStartSz + dx)));
            blangkoCoverLogoSize = newSz;
            setSafe('mc_cover_logosize', String(newSz));
            const sz = Math.max(30, Math.round(newSz * _coverPreviewScale()));
            logoImg.style.width  = sz + 'px';
            logoImg.style.height = sz + 'px';
            const slider = document.querySelector('input[type="range"][oninput*="blangkoCoverLogoSize"]');
            if (slider) { slider.value = newSz; }
            const lbl = document.getElementById('logoSizeLbl');
            if (lbl) lbl.textContent = newSz;
            if (window._fitCoverPreview) window._fitCoverPreview();
        }
        function _onResizeUp() {
            _rDragging = false;
            document.removeEventListener('mousemove', _onResizeMove);
            document.removeEventListener('mouseup',   _onResizeUp);
            document.removeEventListener('touchmove', _onResizeMoveT);
            document.removeEventListener('touchend',  _onResizeUp);
        }
        function _coverPreviewScale() {
            const isL = blangkoCoverOrientasi === 'landscape';
            return 380 / (isL ? 297 : 210);
        }
    }
};

// Bangun blok HTML cetak ukuran penuh A4 (dipakai cetakBlangkoCover & downloadBlangkoCoverWord)
// forWord=true  → layout berbasis <table> (Word tidak support flex)
// forWord=false → layout flex (browser/PDF)
window._buildCoverBlocksFull = function(d, forWord) {
    const { sekolah, skpd, alamat, npsn, logoSrc, order } = d;
    const tahunCetak = (d.tahunCetak !== undefined && d.tahunCetak !== null) ? d.tahunCetak : blangkoCoverTahunCetak;
    const logoSz = blangkoCoverLogoSize || 120;

    const _fAbove = blangkoCoverFontAbove || 'Times New Roman';
    const _fBelow = blangkoCoverFontBelow || 'Times New Roman';
    const _fSKPD  = blangkoCoverFontSKPD  || 'Times New Roman';
    const _spLogoPtT  = Math.round((blangkoCoverSpaceLogoT || 8) * 0.75) + 'pt';
    const _spLogoPtB  = Math.round((blangkoCoverSpaceLogoB || 8) * 0.75) + 'pt';
    const _spSAPt     = Math.round((blangkoCoverSpaceSekolahAlamat || 4) * 0.75) + 'pt';
    const _spASKPDPt  = Math.round((blangkoCoverSpaceAlamatSKPD || 8) * 0.75) + 'pt';

    const titleHTML = `<div style="text-align:center; font-family:'${_fAbove}',serif; line-height:1.6; padding-bottom:8pt;">
        <div style="font-size:${blangkoCoverSzJudul}pt; font-weight:bold; text-transform:uppercase; letter-spacing:2pt;">${blangkoCoverJudul||'COVER'}</div>
        ${blangkoCoverSubJudul ? `<div style="font-size:${blangkoCoverSzSubJudul}pt; font-weight:bold; text-transform:uppercase; margin-top:6pt;">${blangkoCoverSubJudul}</div>` : ''}
        ${blangkoCoverTahunAjaran ? `<div style="font-size:${blangkoCoverSzThnAjaran}pt; font-weight:bold; margin-top:6pt;">TAHUN PELAJARAN ${blangkoCoverTahunAjaran}</div>` : ''}
    </div>`;

    const logoHTML = `<div style="text-align:center; padding-top:${_spLogoPtT}; padding-bottom:${_spLogoPtB}; padding-left:0; padding-right:0;">
        ${logoSrc && logoSrc.startsWith('data:')
            ? `<img src="${logoSrc}" data-cover-logo="1" style="width:${logoSz}px; height:${logoSz}px; object-fit:contain; display:inline-block;">`
            : `<div style="width:${logoSz}px; height:${logoSz}px; display:inline-block;"></div>`}
    </div>`;

    const schoolHTML = `<div style="text-align:center; font-family:'${_fBelow}',serif; line-height:1.8; padding-top:4pt;">
        <div style="font-size:${blangkoCoverSzSekolah}pt; font-weight:bold; text-transform:uppercase;">${sekolah}</div>
        ${alamat ? `<div style="font-size:${blangkoCoverSzAlamat}pt; margin-top:${_spSAPt};">${alamat}</div>` : ''}
        ${npsn   ? `<div style="font-size:${blangkoCoverSzAlamat}pt; font-weight:bold; margin-top:2pt;">NPSN : ${npsn}</div>` : ''}
    </div>`;

    // Blok footer paling bawah: SKPD/Dinas Pendidikan + Tahun — mengikuti sistematika Judul → Logo → Sekolah → (jarak) → Dinas+Tahun
    const footerHTML = (skpd || tahunCetak) ? `<div style="text-align:center; font-family:'${_fSKPD}',serif; line-height:1.6; padding-top:${_spASKPDPt};">
        ${skpd       ? `<div style="font-size:${blangkoCoverSzSKPD}pt; font-weight:bold; text-transform:uppercase;">${skpd}</div>` : ''}
        ${tahunCetak ? `<div style="font-size:${blangkoCoverSzThnCetak}pt; font-weight:bold; margin-top:4pt;">${tahunCetak}</div>` : ''}
    </div>` : '';

    const blocks = { title: titleHTML, logo: logoHTML, school: schoolHTML };

    if (forWord) {
        // Word tidak support flexbox → gunakan tabel baris (title/logo/school sesuai urutan + footer selalu di baris terakhir)
        const rows = order.map(function(k, i) {
            const isLogo = (k === 'logo');
            const vAlign = isLogo ? 'middle' : (i === 0 ? 'top' : 'bottom');
            const hStyle = isLogo ? 'height:90mm; ' : '';
            return `<tr><td style="${hStyle}border:none; text-align:center; vertical-align:${vAlign}; padding:0;">${blocks[k] || ''}</td></tr>`;
        }).join('') + (footerHTML ? `<tr><td style="border:none; text-align:center; vertical-align:bottom; padding:0;">${footerHTML}</td></tr>` : '');
        return `<table style="width:100%; height:100%; border-collapse:collapse; border:none;" cellpadding="0" cellspacing="0">${rows}</table>`;
    }
    // Browser/PDF: flex column space-between
    return order.map(function(k){ return blocks[k] || ''; }).join('') + footerHTML;
};

// Word border wrapper HTML (tabel bersarang, Word-compatible — BUKAN CSS box-shadow/outline)
// Dipakai oleh downloadBlangkoCoverWord untuk membungkus konten dengan border yang benar.
window._getCoverWordBorderWrapper = function(style, innerHTML, minH) {
    const mn = minH || '220mm';
    // PENTING: border diletakkan pada <td>, BUKAN pada <table>. MS Word seringkali TIDAK
    // merender border yang diset langsung pada tag <table> (khususnya saat dibuka dari file
    // .doc/MHTML hasil generate), sehingga border kiri/kanan/atas/bawah tampak hilang setelah
    // didownload meskipun terlihat benar di preview. Border pada <td> jauh lebih konsisten
    // dirender oleh Word karena itu adalah mekanisme utama border tabel di Word.
    function wt(tdBorderStyle, pad, inner) {
        return `<table style="width:100%; min-height:${mn}; border-collapse:collapse;" cellpadding="0" cellspacing="0"><tr><td style="${tdBorderStyle} padding:${pad}; vertical-align:top;">${inner}</td></tr></table>`;
    }
    if (style === 'none')   return wt('border:none;', '30pt 36pt', innerHTML);
    if (style === 'single') return wt('border:2px solid #222;', '28pt 34pt', innerHTML);
    if (style === 'double') return wt('border:4px solid #111;', '6pt',
        `<table style="width:100%; border-collapse:collapse;" cellpadding="0" cellspacing="0"><tr><td style="border:1px solid #111; padding:22pt 28pt; vertical-align:top;">${innerHTML}</td></tr></table>`);
    if (style === 'thick')  return wt('border:8px solid #111;', '22pt 28pt', innerHTML);
    if (style === 'ornate') return wt('border:5px solid #8B6914;', '5pt',
        `<table style="width:100%; border-collapse:collapse;" cellpadding="0" cellspacing="0"><tr><td style="border:5px solid #f5e6a0; padding:5pt; vertical-align:top;">` +
        `<table style="width:100%; border-collapse:collapse;" cellpadding="0" cellspacing="0"><tr><td style="border:4px solid #8B6914; padding:20pt 26pt; vertical-align:top;">${innerHTML}</td></tr></table>` +
        `</td></tr></table>`);
    if (style === 'shadow') return wt('border:4px solid #334155;', '28pt 34pt', innerHTML);
    return wt('border:none;', '30pt 36pt', innerHTML);
};

// Cetak / PDF cover (popup window)
window.cetakBlangkoCover = function() {
    const d = window._getCoverPrintData();
    const ps = getPrintSettings('cover');
    const orient = d.isLandscape ? '@page{size:A4 landscape;}' : '@page{size:A4 portrait;}';
    const mt = ps.marginTop || 15; const mr = ps.marginRight || 10;
    const mb = ps.marginBottom || 15; const ml = ps.marginLeft || 10;

    // Border CSS untuk cetak
    function getBorderPrintCSS(style) {
        const base = `position:absolute; top:${mt}mm; left:${ml}mm; right:${mr}mm; bottom:${mb}mm; pointer-events:none;`;
        if (style === 'none')   return '';
        if (style === 'single') return base + 'border:2px solid #111;';
        if (style === 'double') return base + 'border:4px double #111; outline:2px solid #111; outline-offset:-8px;';
        if (style === 'thick')  return base + 'border:8px solid #111;';
        if (style === 'ornate') return base + 'border:4px solid #8B6914; box-shadow:inset 0 0 0 4px #f5e6a0,inset 0 0 0 8px #8B6914;';
        if (style === 'shadow') return base + 'border:3px solid #334155; box-shadow:6px 6px 0 #334155;';
        return '';
    }
    const borderCss = getBorderPrintCSS(blangkoCoverBorder);
    const borderDiv = borderCss ? `<div style="${borderCss}"></div>` : '';

    const blocksHTML = window._buildCoverBlocksFull(d);
    const win = window.open('', '_blank');
    if (!win) { customAlert('Popup diblokir. Izinkan popup untuk mencetak.', 'error'); return; }
    win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Cover</title>
    <style>
        ${orient}
        * { box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
        html, body { width:100%; height:100%; background:white; }
        .cover-wrap { width:100%; min-height:100vh; padding:${mt}mm ${mr}mm ${mb}mm ${ml}mm; display:flex; flex-direction:column; justify-content:space-between; position:relative; }
        @media print { body { margin:0; } .no-print { display:none; } }
    </style></head><body>
    <div class="cover-wrap">${blocksHTML}${borderDiv}</div>
    <script>window.onload=function(){ window.print(); }<\/script>
    </body></html>`);
    win.document.close();
};

// Download Word — layout tabel (Word tidak support flex) + border tabel bersarang
window.downloadBlangkoCoverWord = function() {
    const d = window._getCoverPrintData();
    const ps = getPrintSettings('cover');
    const mt = ps.marginTop  || 15; const mr = ps.marginRight  || 10;
    const mb = ps.marginBottom|| 15; const ml = ps.marginLeft   || 10;
    const isLandscape = d.isLandscape;
    const pgW = isLandscape ? 297 : 210; const pgH = isLandscape ? 210 : 297;
    const minH = (isLandscape ? (pgH - mt - mb) : (pgH - mt - mb)) + 'mm';

    // Build blok HTML (Word = tabel 3 baris)
    const blocksHTML = window._buildCoverBlocksFull(d, true);

    // Bungkus dengan border tabel bersarang (Word-compatible)
    const wrapped = window._getCoverWordBorderWrapper(blangkoCoverBorder, blocksHTML, minH);

    // Handle logo: ganti base64 ke cid: MIME attachment
    const mimeParts = [];
    let cidCounter = 0;
    const tmpDiv = document.createElement('div');
    tmpDiv.innerHTML = wrapped;
    tmpDiv.querySelectorAll('img[data-cover-logo]').forEach(function(img) {
        // Ukuran proporsional
        const natW = img.naturalWidth  || blangkoCoverLogoSize || 120;
        const natH = img.naturalHeight || blangkoCoverLogoSize || 120;
        const maxSz = blangkoCoverLogoSize || 120;
        const scl = Math.min(maxSz / natW, maxSz / natH, 1);
        const tw = Math.round(natW * scl); const th = Math.round(natH * scl);
        img.setAttribute('width', tw); img.setAttribute('height', th);
        img.style.width  = tw + 'px'; img.style.height = th + 'px'; img.style.objectFit = '';
        // CID
        const src = img.getAttribute('src') || '';
        const mMatch = src.match(/^data:([^;,]+);base64,(.*)$/);
        if (mMatch) {
            cidCounter++;
            const cid = 'coverlogo' + cidCounter + '_' + Date.now();
            mimeParts.push({ cid, mimeType: mMatch[1], base64Data: mMatch[2].replace(/\s+/g,'') });
            img.setAttribute('src', 'cid:' + cid);
        }
    });
    const bodyContent = tmpDiv.innerHTML;

    const pageOrientation = `
        @page Section1 {
            size: ${pgW}mm ${pgH}mm;
            margin: ${mt}mm ${mr}mm ${mb}mm ${ml}mm;
            mso-page-orientation: ${isLandscape ? 'landscape' : 'portrait'};
        }
        div.Section1 { page: Section1; }`;

    const htmlBody = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head>
<meta charset='utf-8'>
<meta name="ProgId" content="Word.Document">
<meta name="Generator" content="Microsoft Word 15">
<meta name="Originator" content="Microsoft Word 15">
<!--[if gte mso 9]><xml>
<w:WordDocument>
    <w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml><![endif]-->
<style>
    ${pageOrientation}
    body { font-family:'Times New Roman',serif; margin:0; background:white; color:black; font-size:12pt; }
    table { border-collapse:collapse; }
    td, th { border:none; }
</style>
</head>
<body><div class="Section1">${bodyContent}</div></body></html>`;

    const judul = (blangkoCoverJudul || 'Cover').replace(/\s+/g, '_');
    let finalContent;
    if (mimeParts.length > 0) {
        const boundary = '----=MyCoverBoundary' + Date.now();
        let mhtml = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${boundary}"\r\n\r\n`;
        mhtml += `--${boundary}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: 8bit\r\n\r\n`;
        mhtml += htmlBody + '\r\n\r\n';
        mimeParts.forEach(function(p) {
            mhtml += `--${boundary}\r\nContent-Type: ${p.mimeType}\r\nContent-Transfer-Encoding: base64\r\nContent-ID: <${p.cid}>\r\n\r\n`;
            mhtml += p.base64Data + '\r\n\r\n';
        });
        mhtml += `--${boundary}--`;
        finalContent = mhtml;
    } else {
        finalContent = '\ufeff' + htmlBody;
    }
    const blob = new Blob([finalContent], { type: 'application/msword' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'Cover_' + judul + '.doc';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
};

window.generateLJBiasa = function() {
    let judul = document.getElementById('ljJudul').value || 'ULANGAN AKHIR SEMESTER GANJIL';
    let tahun = document.getElementById('ljTahun').value || '2024/2025';
    let jmlPG = parseInt(document.getElementById('ljJumlahPG').value) || 10;
    let opsiPG = parseInt(document.getElementById('ljOpsiPG').value) || 5;
    let tipeIsian = document.getElementById('ljTipeIsian').value;
    let jmlIsian = parseInt(document.getElementById('ljJumlahIsian').value) || 5;

    let opsiLabels = ['A', 'B', 'C', 'D', 'E'].slice(0, opsiPG);
    
    // Fungsi membuat tabel PG Kiri dan Kanan (Dengan Header Tabel)
    const buildTablePG = (start, end) => {
        let tbl = `<table style="width: 100%; border-collapse: collapse; font-size: 13px; text-align: center;">
            <thead>
                <tr>
                    <th style="border: 1px solid black; padding: 6px; width: 35px;">No</th>
                    <th colspan="${opsiPG}" style="border: 1px solid black; padding: 6px;">Pilihan Jawaban</th>
                </tr>
            </thead>
            <tbody>`;
        for(let i = start; i <= end; i++) {
            tbl += `<tr><td style="border: 1px solid black; padding: 6px; width: 35px;">${i}.</td>`;
            opsiLabels.forEach(opt => {
                tbl += `<td style="border: 1px solid black; padding: 6px; width: 30px; cursor: pointer;">${opt}</td>`;
            });
            tbl += '</tr>';
        }
        return tbl + '</tbody></table>';
    };

    let half = Math.ceil(jmlPG / 2);
    let table1 = buildTablePG(1, half);
    let table2 = buildTablePG(half + 1, jmlPG);

    // Menyusun Bagian Isian/Uraian
    let htmlUraian = '';
    if (tipeIsian !== 'Tidak Ada') {
        let barisJawaban = '';
        for(let i = 1; i <= jmlIsian; i++) {
            if(tipeIsian === 'Uraian') {
                barisJawaban += `
                    <tr>
                        <td style="width: 30px; vertical-align: top; padding: 5px 0;">${i}.</td>
                        <td style="border: 1px solid black; height: 60px;"></td>
                    </tr>
                    <tr><td colspan="2" style="height: 10px;"></td></tr>

                barisJawaban += `
                    <tr>
                        <td style="width: 30px; vertical-align: top; padding: 5px 0;">${i}.</td>
                        <td style="border-bottom: 1px dotted black; height: 25px;"></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td style="border-bottom: 1px dotted black; height: 25px;"></td>
                    </tr>
                    <tr><td colspan="2" style="height: 10px;"></td></tr>
                `;
            }
        }

        htmlUraian = `
            <div style="margin-top: 20px;">
                <p style="font-size: 13px; font-weight: bold; margin-bottom: 8px;">II. ${tipeIsian}</p>
                <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                    ${barisJawaban}
                </table>
            </div>
        `;
    }

    // Menggabungkan semua kerangka HTML untuk Pratinjau
    let htmlContent = `
        <div id="kontenMasterLJ" style="color: black;">
            ${window.getKopSurat()}
            
            <div style="text-align: center; margin-bottom: 25px; line-height: 1.6;">

                    <td style="width: 10%;">Kelas</td>
                    <td style="width: 35%;">: ........................................</td>
                </tr>
                <tr>
                    <td style="padding: 6px 0;">Mata Pelajaran</td>
                    <td>: ................................................................</td>
                    <td>No. Urut</td>

window.cetakPDFLJBiasa = async function(mode) {
    await window.ensureHtml2pdf();
    document.getElementById('loadingText').innerText = "Menyiapkan PDF..."; 
    document.getElementById('loadingOverlay').classList.remove('hidden');

    
        let masterContent = document.getElementById('kontenMasterLJ').outerHTML;
        let printDiv = document.createElement('div');
        printDiv.style.fontFamily = "'Times New Roman', serif";
        printDiv.style.color = "black";
        printDiv.style.backgroundColor = "white";

        let pdfOrientation = 'portrait';

        if (mode === 1) {
            // Mode 1 Lembar: Potrait A4 (Satu Halaman Penuh)
            printDiv.style.width = '210mm';
            printDiv.style.padding = '15mm';
            printDiv.innerHTML = masterContent;
            pdfOrientation = 'portrait';
        } else if (mode === 2) {
            // Mode 2 Lembar: Landscape A4 (Lebar 297mm x Tinggi 210mm)
            // Dibagi menjadi 2 kolom (Kiri dan Kanan)
            printDiv.style.width = '297mm';
            printDiv.style.padding = '10mm 8mm';
            printDiv.style.display = 'flex';
            printDiv.style.justifyContent = 'space-between';
            
            // Pengecilan font (0.85em) agar muat sempurna di format setengah kertas (ukuran A5)
            let halfContent = `<div style="width: 48%; box-sizing: border-box; font-size: 0.85em;">${masterContent}</div>`;
            
            printDiv.innerHTML = `
                ${halfContent}
                <div style="border-left: 2px dashed #000; height: auto; margin: 0 4mm;"></div>
                ${halfContent}
            `;
            pdfOrientation = 'landscape';
        }

        const opt = {
            margin: 0,
            filename: `Lembar_Jawaban_Biasa_${mode}_Rangkap.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: pdfOrientation }
        };

        html2pdf().set(opt).from(printDiv).save().then(() => {
            document.getElementById('loadingOverlay').classList.add('hidden');
        });
    
};

window.bukaModalPilihMapelStruktur = function() {
    let kelas = document.getElementById('strKelasSelect').value;
    if(!kelas) { customAlert("Pilih Kelas terlebih dahulu!", "warning"); return; }
    
    let dbStruktur = getDB('mc_struktur').filter(s => s.kelas === kelas);
    if(dbStruktur.length === 0) { customAlert("Tidak ada data untuk kelas ini.", "info"); return; }

    // Kategorikan setiap item secara berurutan (stateful)
    let _cat = 'wajib';
    let categorized = dbStruktur.map(item => {
        let m = String(item.mapel).toLowerCase();
        if (m.includes('muatan lokal') && !m.includes('total') && !m.includes('+')) _cat = 'lokal';
        else if (m.includes('pilihan') && !m.includes('total') && !m.includes('+')) _cat = 'pilihan';
        return { ...item, _cat };
    });

    let wajibItems   = categorized.filter(x => x._cat === 'wajib');
    let mulokItems   = categorized.filter(x => x._cat === 'lokal');
    let pilihanItems = categorized.filter(x => x._cat === 'pilihan');

    // Pisahkan baris keterangan (footnote) dari daftar pilihan user
    const isKeteranganMapel = (mapel) => {
        let m = String(mapel || '').toLowerCase();
        return m.includes('tabel 1') || m === 'keterangan' || m.startsWith('keterangan') || !!m.match(/^[a-z][\.\)]\s/);
    };
    wajibItems   = wajibItems.filter(x => !isKeteranganMapel(x.mapel));
    mulokItems   = mulokItems.filter(x => !isKeteranganMapel(x.mapel));
    pilihanItems = pilihanItems.filter(x => !isKeteranganMapel(x.mapel));

    // Simpan ID mulok & pilihan ke variabel global agar bisa dibaca setelah modal ditutup
    window._strMulokIds   = mulokItems.map(x => String(x.id));
    window._strPilihanIds = pilihanItems.map(x => String(x.id));

    let hasMulokData   = mulokItems.length  > 0;
    let hasPilihanData = pilihanItems.length > 0;

    // Hitung jumlah mapel (bukan baris header/total) untuk info
    let countMulok   = mulokItems.filter(x => {
        let m = String(x.mapel).toLowerCase();
        return !m.includes('total') && !m.includes('muatan lokal') && !m.startsWith('keterangan') && !m.match(/^[a-z][\.\)]\s/) && !m.includes('tabel 1');
    }).length;
    let countPilihan = pilihanItems.filter(x => {
        let m = String(x.mapel).toLowerCase();
        return !m.includes('total') && !m.includes('pilihan') && !m.startsWith('keterangan') && !m.match(/^[a-z][\.\)]\s/) && !m.includes('tabel 1');
    }).length;

    let html = `
    <div class="mb-4 bg-indigo-50 p-4 rounded-lg border border-indigo-200">
        <p class="font-bold text-indigo-800"><i class="fas fa-book mr-2"></i>Mata Pelajaran Wajib — Kelas: ${kelas}</p>
        <p class="text-xs text-indigo-500 mt-1">Centang mata pelajaran yang akan ditampilkan pada tabel</p>
    </div>
    <div class="space-y-1 max-h-56 overflow-y-auto p-2 border rounded-lg custom-scrollbar mb-5">
        <label class="flex items-center space-x-2 border-b pb-2 cursor-pointer sticky top-0 bg-white z-10 py-1">
            <input type="checkbox" onchange="window.toggleAllCb(this, 'cb-str-mapel')" checked class="form-checkbox text-indigo-600 rounded"> 
            <span class="font-bold text-indigo-700 text-sm">Pilih Semua Mapel Wajib</span>
        </label>`;
    
    wajibItems.forEach((item) => {
        let m = String(item.mapel);
        let isHeader = m.toLowerCase().includes('wajib') && !m.toLowerCase().includes('total');
        let fontWeight = isHeader ? 'font-bold text-indigo-700' : 'font-semibold text-gray-700';
        html += `<label class="flex items-center space-x-2 cursor-pointer p-1 hover:bg-gray-50 rounded">
            <input type="checkbox" class="cb-str-mapel form-checkbox text-indigo-600 rounded" value="${item.id}" checked> 
            <span class="text-sm ${fontWeight}">${m}</span>
        </label>`;
    });
    html += `</div>`;

    // ── Section Komponen Tambahan ──────────────────────────────────────────
    if (hasMulokData || hasPilihanData) {
        html += `
        <div class="border-t border-gray-200 pt-4">
            <p class="font-bold text-sm text-gray-700 mb-3 flex items-center gap-2">
                <i class="fas fa-plus-circle text-emerald-600"></i> Komponen Tambahan <span class="font-normal text-gray-400">(opsional)</span>
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;

        if (hasMulokData) {
            html += `
            <label class="flex items-start gap-3 cursor-pointer p-3 bg-emerald-50 hover:bg-emerald-100 rounded-xl border-2 border-emerald-200 transition select-none">
                <input type="checkbox" id="cbMuatanLokal" class="form-checkbox text-emerald-600 h-5 w-5 rounded mt-0.5 flex-shrink-0">
                <div>

window.simpanMapelStruktur = function() {
    let kelas = document.getElementById('tmKelas').value;
    let kategori = document.querySelector('input[name="tmKategori"]:checked')?.value || 'lokal';
    let namaMapel = document.getElementById('tmNamaMapel').value.trim();
    let intraTahun = parseInt(document.getElementById('tmIntraTahun').value) || 0;
    let kokuTahun = parseInt(document.getElementById('tmKokuTahun').value) || 0;
    let intraMinggu = parseInt(document.getElementById('tmIntraMinggu').value) || 0;
    let kokuMinggu = parseInt(document.getElementById('tmKokuMinggu').value) || 0;

    if (!kelas) { customAlert("Pilih Kelas terlebih dahulu!", "warning"); return; }
    if (!namaMapel) { customAlert("Nama Mata Pelajaran wajib diisi!", "warning"); return; }

    let db = getDB('mc_struktur');
    let headerKeyword = kategori === 'lokal' ? 'muatan lokal' : 'pilihan';
    let idxHeader = -1;
    for (let i = 0; i < db.length; i++) {
        if (db[i].kelas !== kelas) continue;
        let m = String(db[i].mapel).toLowerCase();
        if (m.includes(headerKeyword) && !m.includes('total') && !m.includes('+')) { idxHeader = i; break; }
    }

    if (idxHeader === -1) {
        let labelKategori = kategori === 'lokal' ? 'Muatan Lokal' : 'Mata Pelajaran Pilihan';
        customAlert(`Kelompok "${labelKategori}" untuk Kelas ${kelas} belum tersedia. Tambahkan dahulu melalui sheet Struktur lalu Sinkronisasi Data, atau hubungi admin.`, "warning");
        return;
    }

    // Cari posisi sisipan: tepat sebelum baris berikutnya milik kategori/kelas lain atau baris total
    let idxInsert = db.length;
    for (let j = idxHeader + 1; j < db.length; j++) {
        if (db[j].kelas !== kelas) continue;
        let m = String(db[j].mapel).toLowerCase();
        if (m.includes('total') || m.includes('wajib') ||
            (kategori === 'lokal' && m.includes('pilihan')) ||
            (kategori === 'pilihan' && m.includes('muatan lokal'))) {
            idxInsert = j; break;
        }
    }

    let newItem = {
        id: Date.now(),
        kelas: kelas,
        mapel: namaMapel,
        intraTahun: intraTahun, kokuTahun: kokuTahun, totalTahun: intraTahun + kokuTahun,
        intraMinggu: intraMinggu, kokuMinggu: kokuMinggu, totalMinggu: intraMinggu + kokuMinggu
    };

    db.splice(idxInsert, 0, newItem);
    saveDB('mc_struktur', db);
    syncToSheet('tambah_struktur', newItem);

    document.getElementById('modalInputKurikulum').classList.add('hidden');
    customAlert("Mata pelajaran berhasil ditambahkan ke struktur kurikulum.", "success");
    window.renderGuruStruktur();
};

window.generateTabelStruktur = function(kelas) {
    document.getElementById('loadingText').innerText = "Menyusun Tabel..."; 
    document.getElementById('loadingOverlay').classList.remove('hidden');

    
        let selectedIds = Array.from(document.querySelectorAll('.cb-str-mapel:checked')).map(cb => cb.value);

        // Baca flag toggle Muatan Lokal & Pilihan (tersimpan dari modal sebelum ditutup)
        let includeMulok   = window._strIncludeMulok   || false;
        let includePilihan = window._strIncludePilihan || false;

        // Gabungkan ID mulok/pilihan jika toggle diaktifkan
        if (includeMulok   && window._strMulokIds)   selectedIds = [...selectedIds, ...window._strMulokIds];
        if (includePilihan && window._strPilihanIds)  selectedIds = [...selectedIds, ...window._strPilihanIds];

        if(selectedIds.length === 0) {
            document.getElementById('loadingOverlay').classList.add('hidden');
            customAlert("Tidak ada mapel yang dipilih!", "warning"); return;
        }

        // Helper deteksi baris keterangan (footnote di bawah tabel)
        const isKeteranganMapel = (mapel) => {
            let m = String(mapel || '').toLowerCase();
            return m.includes('tabel 1') || m === 'keterangan' || m.startsWith('keterangan') || !!m.match(/^[a-z][\.\)]\s/);
        };

        // Ambil item utama (sesuai kelas & dipilih user)
        let dbStrukturMain = getDB('mc_struktur').filter(s => s.kelas === kelas && selectedIds.includes(String(s.id)));

        // Kumpulkan huruf rujukan keterangan (a, b, c, d, ...) yang benar-benar dipakai
        // oleh mapel yang tampil di tabel (misal "Muatan Lokal c)" hanya relevan jika Muatan Lokal dicentang).
        let usedFootnoteLetters = new Set();
        dbStrukturMain.forEach(s => {
            let mapelStr = String(s.mapel || '');
            let matches = mapelStr.matchAll(/(?:^|\s)([a-z])\)/gi);
            for (const match of matches) usedFootnoteLetters.add(match[1].toLowerCase());
        });

        // Ambil baris keterangan secara terpisah:
        //   - Bisa punya kelas sama TAPI tidak ada di selectedIds (karena disembunyikan dari modal)
        //   - Bisa punya kelas kosong/null (berlaku global untuk semua kelas)
        //   - Hindari duplikat
        //   - Hanya tampilkan huruf keterangan yang rujukannya benar-benar ada di tabel
        const mainIds = new Set(dbStrukturMain.map(s => String(s.id)));
        let keteranganExtra = getDB('mc_struktur').filter(s => {
            if (mainIds.has(String(s.id))) return false; // sudah ada
            if (!isKeteranganMapel(s.mapel)) return false; // bukan keterangan
            // Jika baris keterangan ini berupa "x. ..." (huruf rujukan), pastikan hurufnya dipakai di tabel
            let letterMatch = String(s.mapel || '').toLowerCase().match(/^([a-z])[\.\)]\s/);
            if (letterMatch && !usedFootnoteLetters.has(letterMatch[1])) return false;
            // Masukkan jika kelas cocok ATAU kelas kosong (berlaku umum)
            return s.kelas === kelas || !s.kelas || s.kelas === '' || s.kelas == null;
        });

        let dbStruktur = [...dbStrukturMain, ...keteranganExtra];
        
        // Kalkulasi Dinamis JP (Perbaikan Akurat untuk Muatan Lokal & Pilihan)
        let sums = { wajib: {it:0, kt:0, tt:0, im:0, km:0, tm:0}, total: {it:0, kt:0, tt:0, im:0, km:0, tm:0} };
        let currentCat = 'wajib';
        let hasPilihan = false;
        let hasMulok = false;
        let lastMapelKeySum = null; // untuk mendeteksi mapel duplikat berurutan saat menghitung total

        dbStruktur.forEach(item => {
            let m = String(item.mapel).toLowerCase();
            // Abaikan baris yang mengandung kata 'total', 'keterangan', atau 'tabel' agar tidak dihitung ganda
            if(m.includes('total') || m.includes('keterangan') || m.includes('tabel 1')) { lastMapelKeySum = null; return; }

            // Deteksi Kategori: Pilihan atau Muatan Lokal
            let isHeaderRowSum = (m.includes('wajib')) || (m.includes('muatan lokal')) || (m.includes('pilihan'));
            if(m.includes('pilihan')) { currentCat = 'pilihan'; hasPilihan = true; }
            else if(m.includes('muatan lokal')) { currentCat = 'lokal'; hasMulok = true; }

            // Lewati mapel duplikat berurutan (nama sama dengan baris mapel sebelumnya) agar tidak dihitung dobel
            if (!isHeaderRowSum) {
                if (m === lastMapelKeySum) return;
                lastMapelKeySum = m;
            } else {
                lastMapelKeySum = null;
                return; // baris header kategori tidak punya nilai JP sendiri, jangan ditambahkan ke total
            }

            let it = parseInt(item.intraTahun)||0; let kt = parseInt(item.kokuTahun)||0; let tt = parseInt(item.totalTahun)||0;
            let im = parseInt(item.intraMinggu)||0; let km = parseInt(item.kokuMinggu)||0; let tm = parseInt(item.totalMinggu)||0;

            // Masuk ke Total Keseluruhan (Grand Total)
            sums.total.it += it; sums.total.kt += kt; sums.total.tt += tt;
            sums.total.im += im; sums.total.km += km; sums.total.tm += tm;

            // Masuk ke Total Wajib hanya jika kategori masih 'wajib'
            if (currentCat === 'wajib') {
                sums.wajib.it += it; sums.wajib.kt += kt; sums.wajib.tt += tt;
                sums.wajib.im += im; sums.wajib.km += km; sums.wajib.tm += tm;
            }
        });
        
        let hasPilihanOrLokal = hasPilihan || hasMulok;
        let trHtml = '';
        let keteranganHtml = '';
        let no = 1;
        let prevWasSectionHeader = false; // true jika baris sebelumnya adalah header Muatan Lokal/Pilihan
        let lastMapelKey = null; // untuk mendeteksi mapel duplikat berurutan

        // Loop kedua: Susun baris HTML ke Tabel
        dbStruktur.forEach(item => {
            let m = String(item.mapel).toLowerCase();
            
            // LOGIKA: PISAHKAN KETERANGAN DARI TABEL
            let isKeteranganRow = isKeteranganMapel(item.mapel);
            if (isKeteranganRow) {
                let marginStyle = 'margin-bottom: 4px;';
                if (m.includes('tabel 1')) marginStyle = 'margin-bottom: 15px;';
                if (m === 'keterangan' || m.startsWith('keterangan')) marginStyle = 'margin-bottom: 6px; font-weight: bold;';
                
                if (m.match(/^[a-z][\.\)]\s/)) {
                    keteranganHtml += `<div style="font-size: 11px; margin-bottom: 4px; padding-left: 20px; text-indent: -20px;">${item.mapel}</div>`;
                } else {
                    keteranganHtml += `<div style="font-size: 11px; ${marginStyle}">${item.mapel}</div>`;
                }
                return; // Langsung skip baris ini (tidak digambar ke dalam tabel)
            }

            let isWajibHeader = m.includes('wajib') && !m.includes('total');
            let isMulokHeader = m.includes('muatan lokal') && !m.includes('total') && !m.includes('+');
            let isPilihanHeader = m.includes('pilihan') && !m.includes('total') && !m.includes('+');
            let isHeader = isWajibHeader || isMulokHeader || isPilihanHeader;
            let isSectionHeaderRow = isMulokHeader || isPilihanHeader; // khusus header Mulok/Pilihan
            
            // Logika Baris Total (Wajib vs Gabungan)
            let isTotalWajib = m.includes('total jp mata pelajaran wajib') && !m.includes('+') && !m.includes('umum');
            let isGrandTotal = m.includes('total') && (m.includes('+') || m.includes('umum') || m.includes('pilihan') || m.includes('muatan lokal'));

            // Jangan tampilkan baris Grand Total jika tidak ada Muatan Lokal/Pilihan
            if (isGrandTotal && !hasPilihanOrLokal) return;

            // LEWATI BARIS MAPEL DUPLIKAT (nama sama persis dengan baris mapel sebelumnya berurutan)
            // agar tidak muncul nomor & baris baru untuk mapel yang sama.
            if (!isHeader && !isTotalWajib && !isGrandTotal) {
                if (m === lastMapelKey) return;
                lastMapelKey = m;
            } else {
                lastMapelKey = null; // reset batas saat masuk header/baris total baru
            }

            let bgStyle = '';
            if (isHeader) bgStyle = 'background: linear-gradient(to right, #dcfce7, #bbf7d0); font-weight: bold;';
            else if (isTotalWajib || isGrandTotal) bgStyle = 'background-color: #f3f4f6; font-weight: bold;';

            let noText = (isHeader || isTotalWajib || isGrandTotal) ? '' : no++;
            
            let it = item.intraTahun, kt = item.kokuTahun, tt = item.totalTahun;
            let im = item.intraMinggu, km = item.kokuMinggu, tm = item.totalMinggu;

            // Baris header kategori (Mapel Wajib / Muatan Lokal / Pilihan) tidak menampilkan angka JP sendiri,
            // karena angka JP-nya sudah dirinci pada baris-baris mapel di bawahnya.
            if (isHeader) {
                it = kt = tt = im = km = tm = '-';
            }

            // Memasukkan Angka Rumus Kalkulasi untuk Baris Total
            if (isTotalWajib) {
                it = sums.wajib.it; kt = sums.wajib.kt; tt = sums.wajib.tt;
                im = sums.wajib.im; km = sums.wajib.km; tm = sums.wajib.tm;
                noText = '';
            } else if (isGrandTotal) {
                it = sums.total.it; kt = sums.total.kt; tt = sums.total.tt;
                im = sums.total.im; km = sums.total.km; tm = sums.total.tm;
                noText = '';
                
                // Penamaan Label Total Dinamis
                let label = "Total JP Mata Pelajaran Wajib";
                if(hasMulok)    label += " + Muatan Lokal";
                if(hasPilihan)  label += " + Pilihan";
                item.mapel = label;
            }

            let fmt = (val) => (val == 0 || val == '-' || !val) ? '-' : val;

            // Hilangkan garis pemisah antara header Mulok/Pilihan dengan mapel pertama di bawahnya,
            // agar terlihat menyatu sebagai satu blok (bukan baris terpisah).
            let topBorderOverride = prevWasSectionHeader ? 'border-top: none;' : '';
            let bottomBorderOverride = isSectionHeaderRow ? 'border-bottom: none;' : '';
            let mergeStyle = `${topBorderOverride} ${bottomBorderOverride}`.trim();
            prevWasSectionHeader = isSectionHeaderRow;

            trHtml += `
                <tr style="${bgStyle}">
                    <td style="border: 1px solid black; padding: 6px; text-align: center; ${mergeStyle}">${noText}</td>
                    <td style="border: 1px solid black; padding: 6px; ${mergeStyle}">${item.mapel}</td>
                    <td style="border: 1px solid black; padding: 6px; text-align: center; ${mergeStyle}">${fmt(it)}</td>
                    <td style="border: 1px solid black; padding: 6px; text-align: center; ${mergeStyle}">${fmt(kt)}</td>
                    <td style="border: 1px solid black; padding: 6px; text-align: center; font-weight:bold; ${mergeStyle}">${fmt(tt)}</td>
                    <td style="border: 1px solid black; padding: 6px; text-align: center; ${mergeStyle}">${fmt(im)}</td>
                    <td style="border: 1px solid black; padding: 6px; text-align: center; ${mergeStyle}">${fmt(km)}</td>
                    <td style="border: 1px solid black; padding: 6px; text-align: center; font-weight:bold; ${mergeStyle}">${fmt(tm)}</td>
                </tr>
            `;
        });

        let finalHtml = `
            ${window.getKopSurat()}
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="font-size: 16px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase;">STRUKTUR KURIKULUM ${kelas.toUpperCase()}</h2>
            </div>
            <table id="tabelStrukturExport" style="width: 100%; border-collapse: collapse; border: 1px solid black; font-size: 13px; margin-bottom: 20px; color: black;">
                <thead>
                    <tr style="background-color: #f3f4f6; text-align: center; font-weight: bold;">
                        <td rowspan="2" style="border: 1px solid black; padding: 6px; width: 5%;">No</td>
                        <td rowspan="2" style="border: 1px solid black; padding: 6px; width: 35%;">Mata Pelajaran</td>
                        <td colspan="3" style="border: 1px solid black; padding: 6px;">Alokasi Per Tahun</td>
                        <td colspan="3" style="border: 1px solid black; padding: 6px;">Alokasi Per Minggu</td>
                    </tr>
                    <tr style="background-color: #f3f4f6; text-align: center; font-weight: bold;">
                        <td style="border: 1px solid black; padding: 6px; width: 10%;">Intrakurikuler</td>
                        <td style="border: 1px solid black; padding: 6px; width: 10%;">Kokurikuler</td>
                        <td style="border: 1px solid black; padding: 6px; width: 10%;">Total JP</td>
                        <td style="border: 1px solid black; padding: 6px; width: 10%;">Intrakurikuler</td>
                        <td style="border: 1px solid black; padding: 6px; width: 10%;">Kokurikuler</td>
                        <td style="border: 1px solid black; padding: 6px; width: 10%;">Total JP</td>
                    </tr>
                </thead>
                <tbody>${trHtml}</tbody>
            </table>
            
            <div class="mc-footnote-block" style="margin-bottom: 25px; text-align: justify; color: black; line-height: 1.4;">
                ${keteranganHtml}
            </div>

            ${window.getTandaTangan()}
        `;

        document.getElementById('strukturOutputArea').innerHTML = `
            <div class="mb-4 flex flex-wrap gap-2 justify-end no-print">
                ${btnPengaturanCetak('struktur', 'Struktur Kurikulum')}
                <button onclick="window.exportTableToExcel('tabelStrukturExport', 'Struktur_Kurikulum_${kelas}', 'struktur')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold text-sm shadow"><i class="fas fa-file-excel mr-2"></i> Download Excel</button>
                <button onclick="window.exportToWord('printStrukturArea', 'Struktur_Kurikulum_${kelas}', null, 'struktur')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold text-sm shadow"><i class="fas fa-file-word mr-2"></i> Download Word</button>
                <button onclick="downloadPDF('printStrukturArea', 'Struktur_Kurikulum_${kelas}.pdf', null, 'struktur')" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg font-bold text-sm shadow"><i class="fas fa-file-pdf mr-2"></i> Cetak PDF</button>
            </div>
            <div id="printStrukturArea" class="p-4 bg-white" style="font-family: 'Times New Roman', serif; color: black; line-height: 1.5; min-width: 1000px;">

// Cascading: Kategori Model LKPD → tampilkan sub-pilihan yang sesuai
window.lkUpdateModelPilihan = function() {
    const kategori = document.getElementById('lkModelKategori')?.value;
    const wrap = document.getElementById('lkModelPilihanWrap');
    const sel = document.getElementById('lkModelPilihan');
    if (!wrap || !sel) return;

    const OPSI_MODEL = {
        model: [
            'LKPD PBL (Problem Based Learning)',
            'LKPD PjBL (Project Based Learning) / Proyek',
            'LKPD Discovery / Inquiry Learning',
            'LKPD Pembelajaran Kooperatif (Cooperative Learning)',
            'LKPD Pendekatan STEAM / STEM',
            'LKPD Contextual Teaching and Learning (CTL)',
            'LKPD Flipped Classroom',
            'LKPD Role Playing (Bermain Peran) / Simulasi'
        ],
        asesmen: [
            'LKPD Diagnostik',
            'LKPD Remedial',
            'LKPD Pengayaan',
            'LKPD Refleksi'
        ]
    };

    if (!kategori) {
        wrap.classList.add('hidden');
        sel.innerHTML = '<option value="">- Pilih Model -</option>';
        return;
    }

    const opsi = OPSI_MODEL[kategori] || [];
    sel.innerHTML = '<option value="">- Pilih Model -</option>' +
        opsi.map(o => `<option value="${o}">${o}</option>`).join('');
    wrap.classList.remove('hidden');
};

// Helper: mengembalikan deskripsi Seksi A, B, C yang sesuai dengan Model & Bentuk LKPD yang dipilih
function getLKPDSeksiDeskripsi(modelStr, bentukStr) {
    const m = (modelStr || '').toLowerCase();
    const b = (bentukStr || '').toLowerCase();

    // === NILAI DEFAULT (jika tidak ada model/bentuk yang cocok) ===
    let seksiA = 'Aktivitas pemahaman konsep: kenalkan materi inti melalui gambar, teks pendek, atau pertanyaan pemantik\n                 (header berwarna + nomor lingkaran + ilustrasi pendukung)';
    let seksiB = 'Aktivitas latihan variatif yang berbeda dari Seksi A\n                 (contoh: menjodohkan, melengkapi kalimat, mengurutkan gambar)';
    let seksiC = 'Soal cerita / penerapan dalam kehidupan sehari-hari\n                 (tiap soal disertai gambar pendukung + kolom jawaban)';

    // === SEKSI BERDASARKAN MODEL PEMBELAJARAN ===
    if (m.includes('problem based') || m.includes('pbl')) {
        seksiA = 'Sajikan skenario/masalah nyata kontekstual yang relevan dengan materi\n                 Siswa mengidentifikasi masalah dan merumuskan pertanyaan investigasi\n                 (teks skenario bergambar + kolom "Masalah yang Saya Temukan")';
        seksiB = 'Analisis penyebab masalah + eksplorasi solusi alternatif\n                 (tabel sebab-akibat, diagram sederhana, atau gambar berurutan\n                 + kolom "Solusi yang Saya Usulkan")';
        seksiC = 'Penerapan solusi terbaik dalam kehidupan sehari-hari\n                 (soal cerita kontekstual berdasarkan masalah yang sudah diidentifikasi\n                 + kolom jawaban + gambar pendukung)';
    } else if (m.includes('project') || m.includes('pjbl') || m.includes('proyek')) {
        seksiA = 'Pengantar proyek: latar belakang, tujuan proyek, dan rencana kerja siswa\n                 (tabel langkah-langkah proyek yang diisi siswa + ilustrasi hasil akhir proyek)';
        seksiB = 'Pelaksanaan proyek: pengumpulan data / dokumentasi proses dan hasil karya\n                 (tabel observasi / lembar catatan hasil proyek + kolom sketsa/gambar produk)';
        seksiC = 'Pelaporan & evaluasi: narasi hasil proyek + penilaian diri + rencana perbaikan\n                 (kolom laporan singkat, tabel penilaian diri, ilustrasi produk akhir)';
    } else if (m.includes('discovery') || m.includes('inquiry')) {
        seksiA = 'Pertanyaan pemantik untuk membangun rasa ingin tahu siswa\n                 + kolom hipotesis/dugaan awal yang dituliskan siswa sendiri\n                 (gambar fenomena/objek + kotak "Apa dugaanmu?")';
        seksiB = 'Kegiatan eksplorasi/pengamatan untuk membuktikan hipotesis\n                 (panduan langkah eksplorasi, tabel hasil pengamatan, gambar proses)';
        seksiC = 'Kesimpulan penemuan siswa + soal penerapan konsep yang ditemukan\n                 (kolom narasi kesimpulan + soal terbuka kontekstual + gambar pendukung)';
    } else if (m.includes('kooperatif') || m.includes('cooperative')) {
        seksiA = 'Pembagian peran anggota kelompok + identifikasi tugas masing-masing\n                 (tabel pembagian peran, rubrik partisipasi, ilustrasi kerja tim)';
        seksiB = 'Aktivitas kolaboratif kelompok: diskusi, eksplorasi bersama, atau pembuatan karya\n                 (lembar kerja kolaborasi, tabel hasil diskusi, gambar skenario kelompok)';
        seksiC = 'Presentasi hasil kelompok + refleksi kerja tim\n                 (kolom laporan kelompok, tabel evaluasi kerja tim, ilustrasi presentasi)';
    } else if (m.includes('steam') || m.includes('stem')) {
        seksiA = 'Eksplorasi sains/teknologi: amati fenomena atau benda nyata terkait materi\n                 (pertanyaan eksplorasi, gambar objek sains, kolom hasil pengamatan)';
        seksiB = 'Rancangan solusi berbasis STEAM: desain, buat, atau uji coba sederhana\n                 (lembar desain/sketsa, tabel bahan & alat, panduan langkah kegiatan)';
        seksiC = 'Evaluasi hasil & refleksi: uji coba rancangan + kaitkan dengan kehidupan nyata\n                 (kolom hasil uji, soal analisis kontekstual, ilustrasi aplikasi nyata)';
    } else if (m.includes('ctl') || m.includes('contextual')) {
        seksiA = 'Menghubungkan materi dengan pengalaman nyata/lingkungan siswa\n                 (pertanyaan kontekstual, gambar situasi nyata sehari-hari, kolom pengalaman pribadi)';
        seksiB = 'Aktivitas kontekstual: pengamatan lingkungan sekitar atau wawancara sederhana\n                 (panduan pengamatan/wawancara, tabel pencatatan hasil, ilustrasi situasi)';
        seksiC = 'Refleksi & penerapan: hubungkan temuan dengan materi dan kehidupan sehari-hari\n                 (kolom narasi, soal penerapan kontekstual, gambar pendukung)';
    } else if (m.includes('flipped')) {
        seksiA = 'Review materi yang sudah dipelajari mandiri di rumah (video/bacaan)\n                 (kuis singkat cek pemahaman, kolom ringkasan siswa, pertanyaan klarifikasi)';
        seksiB = 'Diskusi & klarifikasi di kelas: bahas pertanyaan dan kesulitan yang ditemukan\n                 (tabel pertanyaan & jawaban kelompok, kolom catatan diskusi, ilustrasi diskusi)';
        seksiC = 'Proyek/latihan penerapan di kelas: terapkan konsep secara aktif dan kreatif\n                 (soal tantangan, aktivitas kreatif/proyek mini, kolom hasil kerja)';
    } else if (m.includes('role playing') || m.includes('bermain peran') || m.includes('simulasi')) {
        seksiA = 'Deskripsi skenario bermain peran + pembagian peran anggota\n                 (kartu peran bergambar, panduan skrip/dialog, ilustrasi skenario)';
        seksiB = 'Pelaksanaan bermain peran: panduan dialog + lembar observasi penonton\n                 (lembar panduan dialog, tabel pengamatan untuk siswa penonton)';
        seksiC = 'Evaluasi peran + refleksi pembelajaran dari simulasi\n                 (kolom penilaian diri, soal refleksi bermakna, ilustrasi adegan kunci)';
    } else if (m.includes('diagnostik')) {
        seksiA = 'Pemetaan kemampuan awal: soal pengetahuan dasar & pengalaman belajar sebelumnya\n                 (pertanyaan terbuka, gambar pemantik, kolom jawaban bebas siswa)';
        seksiB = 'Soal diagnostik terstruktur untuk mengidentifikasi kesenjangan pemahaman\n                 (pilihan berganda sederhana, menjodohkan, atau mengisi tabel)';
        seksiC = 'Identifikasi kebutuhan belajar: refleksi tentang apa yang sudah/belum dipahami\n                 (kolom isian refleksi, gambar situasi belajar, pertanyaan metakognitif)';
    } else if (m.includes('remedial')) {
        seksiA = 'Review konsep dasar yang perlu diperkuat dengan penjelasan ulang + contoh konkret\n                 (gambar ilustrasi konsep, kotak penjelasan berwarna, contoh soal terselesaikan)';
        seksiB = 'Latihan bertahap dari mudah ke sulit dengan scaffolding yang memadai\n                 (soal langkah-demi-langkah terpandu, gambar pemandu, kolom jawaban bertahap)';
        seksiC = 'Soal mandiri untuk mengukur pemahaman ulang setelah remedial\n                 (soal setara materi asli dengan konteks berbeda, kolom jawaban, gambar pendukung)';
    } else if (m.includes('pengayaan')) {
        seksiA = 'Eksplorasi mendalam: sajikan fakta/konsep lanjutan yang menantang dan memperluas wawasan\n                 (teks informasi pengayaan, gambar konsep lanjut, pertanyaan analitis)';
        seksiB = 'Proyek/tugas menantang: buat, rancang, atau selesaikan tantangan kreatif terkait materi\n                 (lembar tugas kreatif, tabel perencanaan, ilustrasi produk/karya)';
        seksiC = 'Soal HOTS / pemecahan masalah: uji kemampuan berpikir tingkat tinggi\n                 (soal analisis-sintesis-evaluasi, studi kasus mini, kolom argumentasi)';
    } else if (m.includes('refleksi')) {
        seksiA = 'Rangkuman materi oleh siswa sendiri dengan kata-kata mereka sendiri\n                 (peta konsep sederhana, kolom isian rangkuman kunci, ilustrasi konsep)';
        seksiB = 'Jurnal belajar: ceritakan proses belajar, kesulitan, dan cara mengatasinya\n                 (kolom narasi jurnal, tabel pengalaman belajar, emotikon mood belajar)';
        seksiC = 'Rencana perbaikan ke depan: tentukan target dan strategi belajar selanjutnya\n                 (kolom rencana aksi, gambar inspirasi/motivasi, soal penguatan)';
    }

    // === OVERRIDE PENUH BERDASARKAN BENTUK LKPD (lebih spesifik dari model) ===
    if (b.includes('eksperimen') || b.includes('praktikum')) {
        seksiA = 'Rumusan masalah & hipotesis: apa yang ingin dibuktikan dalam eksperimen ini?\n                 (kolom rumusan masalah, hipotesis awal siswa, ilustrasi alat & bahan)';
        seksiB = 'Prosedur eksperimen & tabel pengamatan: catat langkah dan hasil secara sistematis\n                 (panduan langkah prosedur bernomor, tabel data hasil eksperimen, gambar alat/bahan)';
        seksiC = 'Analisis data & kesimpulan: apa yang ditemukan? Apakah hipotesis terbukti?\n                 (kolom analisis, pertanyaan interpretatif, kolom kesimpulan + gambar pendukung)';
    } else if (b.includes('observasi') || b.includes('pengamatan')) {
        seksiA = 'Panduan observasi: apa yang diamati, di mana, dan cara mencatat yang benar\n                 (lembar panduan, tabel aspek pengamatan, ilustrasi objek yang diamati)';
        seksiB = 'Lembar pencatatan hasil observasi secara terstruktur dan sistematis\n                 (tabel data pengamatan, kolom gambar/sketsa objek, catatan deskripsi)';
        seksiC = 'Analisis & kesimpulan: apa yang dapat disimpulkan dari hasil pengamatan?\n                 (kolom interpretasi, soal penerapan kontekstual, ilustrasi konteks)';
    } else if (b.includes('analisis data')) {
        seksiA = 'Sajikan data (tabel, grafik, atau infografis) yang relevan dengan materi\n                 Siswa membaca dan memahami makna data yang disajikan\n                 (gambar grafik/tabel data + pertanyaan pemahaman data awal)';
        seksiB = 'Analisis data: jawab pertanyaan berdasarkan data yang sudah disajikan\n                 (pertanyaan inferensi, perbandingan data, identifikasi pola/tren)';
        seksiC = 'Interpretasi & penerapan: apa makna data ini bagi kehidupan nyata?\n                 (kolom narasi interpretasi, soal kontekstual, gambar pendukung)';
    } else if (b.includes('literasi') || b.includes('membaca')) {
        seksiA = 'Teks bacaan pendek relevan dengan materi + pertanyaan pemahaman awal\n                 (teks informasi bergambar, pertanyaan "5W+1H" sederhana, ilustrasi konteks)';
        seksiB = 'Menemukan & mengorganisasi informasi penting dari teks\n                 (peta pikiran/tabel ide pokok, kolom kosakata baru, gambar konteks teks)';
        seksiC = 'Menulis respons/ringkasan dengan kata-kata sendiri + soal penalaran\n                 (kolom isian ringkasan, soal inferensi/evaluasi, gambar pendukung)';
    } else if (b.includes('latihan') || b.includes('drill')) {
        seksiA = 'Contoh soal terselesaikan (worked example): tunjukkan cara menjawab dengan jelas\n                 + latihan soal tipe pertama (tingkat mudah/dasar)';
        seksiB = 'Latihan soal tipe kedua (tingkat sedang): variasi soal dengan format berbeda\n                 (isian singkat, menjodohkan, atau melengkapi tabel/kalimat)';
        seksiC = 'Latihan mandiri (tingkat menantang): soal campuran untuk mengukur penguasaan\n                 (soal terbuka, soal cerita, atau soal multi-langkah + gambar pendukung)';
    } else if (b.includes('diskusi kelompok')) {
        // Jika bentuk Diskusi Kelompok, tambahkan nuansa kolaborasi ke seksi yang sudah ada
        if (!seksiA.toLowerCase().includes('kelompok') && !seksiA.toLowerCase().includes('diskusi')) {
            seksiA += '\n                 ★ Diskusikan bersama kelompok; catat hasil kesepakatan pada kolom yang tersedia';
        }
        if (!seksiB.toLowerCase().includes('kelompok') && !seksiB.toLowerCase().includes('diskusi')) {
            seksiB += '\n                 ★ Bandingkan jawaban antar anggota kelompok sebelum disepakati bersama';
        }
        if (!seksiC.toLowerCase().includes('kelompok') && !seksiC.toLowerCase().includes('presentasi')) {
            seksiC += '\n                 ★ Setiap kelompok menyampaikan hasil kepada kelas (presentasi singkat)';
        }
    }

    return { seksiA, seksiB, seksiC };
}
