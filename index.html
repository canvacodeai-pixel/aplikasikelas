window.initPmKelasOptions = function() {
    const sel = document.getElementById('pmKelas');
    if (!sel || sel.options.length > 1) return; // sudah terisi
    // Gunakan mc_masterkurikulumbaru sebagai sumber utama.
    // Kumpulkan kelas unik dengan normalisasi yang sama seperti renderGuruProta/renderGuruModulAjar:
    // - Prioritas field item.Kelas per baris (format database baru)
    // - Fallback carry-forward via ATP regex (format database lama)
    let klsList = [];
    const _mb = getDB('mc_masterkurikulumbaru') || [];
    if (_mb.length > 0) {
        const kelasSet = new Set();
        let currentKelasCarry = null;
        _mb.forEach(function(item) {
            const kelasRaw = String(item.Kelas || item.kelas || '').trim();
            if (kelasRaw) {
                // Format database baru: kolom Kelas tersedia per baris
                currentKelasCarry = kelasRaw;
                kelasSet.add(kelasRaw);
            } else {
                // Format database lama: coba baca dari ATP (carry-forward)
                const atp = String(item.alurtujuanpembelajaran || item.ATP || '').trim();
                const m = atp.match(/Kelas\s+(\d+[A-Za-z]?)/i);
                if (m) {
                    const kelasFromAtp = 'Kelas ' + m[1];
                    currentKelasCarry = kelasFromAtp;
                    kelasSet.add(kelasFromAtp);
                } else if (currentKelasCarry) {
                    kelasSet.add(currentKelasCarry);
                }
            }
        });
        klsList = Array.from(kelasSet).sort();
    }
    if (klsList.length === 0) {
        // Fallback ke mc_kurikulum jika mc_masterkurikulumbaru kosong
        const db = getDB('mc_kurikulum') || [];
        klsList = [...new Set(db.map(i => i.Kelas).filter(Boolean))].sort();
    }
    sel.innerHTML = '<option value="">-- Pilih Kelas --</option>' + klsList.map(k => `<option value="${k}">${k}</option>`).join('');
};

window.generatePromptModulAjar = function() {
    const kelas  = document.getElementById('pmKelas').value;
    const mapel  = document.getElementById('pmMapel').value;
    const bab    = (document.querySelector('.pmMateriRad:checked') || {}).value || '';
    const tp     = (document.querySelector('.pmATPRad:checked')    || {}).value || '';
    const waktu  = document.getElementById('pmWaktu').value.trim();
    const model  = document.getElementById('pmModel').value.trim();
    const instruksi = document.getElementById('pmInstruksi').value.trim();
    const profil = Array.from(document.querySelectorAll('.pm-cb-profil:checked')).map(cb => cb.value);

    if (!kelas || !mapel || !bab) {
        customAlert('Lengkapi minimal Kelas, Mapel, dan Materi/Topik terlebih dahulu.', 'warning');
        return;
    }

    // Ambil materi pokok dari database kurikulum (support mc_masterkurikulumbaru & mc_kurikulum)
    const _pmRows = _getNormalizedKurikulumRows(kelas, mapel);
    const _pmRow  = _pmRows.find(it =>
        (getMateriEsensial(it) || getBabField(it) || '').trim() === bab.trim() ||
        getBabField(it).trim() === bab.trim()
    ) || null;
    const materiPokok = _pmRow ? (getMateriEsensial(_pmRow) || getBabField(_pmRow) || bab) : bab;
    const tpText = tp || (_pmRows.filter(it => (getMateriEsensial(it)||getBabField(it)||'').trim()===bab.trim()).map(r => r.TujuanPembelajaran).filter(Boolean).join('; '));

    const profilText = profil.length > 0 ? profil.join(', ') : 'Penalaran Kritis, Kreativitas, Kolaborasi';
    const waktuText  = waktu || '2 x 35 Menit (1 x Pertemuan)';
    const modelText  = model || 'Problem Based Learning (PBL)';

    const prompt = `Anda adalah seorang pendidik ahli pembuat Modul Ajar Kurikulum Merdeka berbasis Pembelajaran Mendalam (PM).
Buat Modul Ajar LENGKAP dan DETAIL berdasarkan data berikut:

Mapel            : ${mapel}
Kelas/Fase       : ${kelas}
Bab/Topik        : ${bab}${materiPokok && materiPokok !== bab ? ' - ' + materiPokok : ''}
Tujuan Pembelajaran: ${tpText || '(Tentukan TP yang sesuai dengan Bab/Topik)'}
Alokasi Waktu    : ${waktuText}
Model Pembelajaran: ${modelText}
Profil Lulusan   : ${profilText}${instruksi ? '\nInstruksi Khusus: ' + instruksi : ''}

=== FORMAT OUTPUT MODUL AJAR ===

Susun Modul Ajar dalam format berikut (lengkap dan detail):

**A. INFORMASI UMUM**
- Identitas Modul (Sekolah, Mapel, Fase/Kelas, Alokasi Waktu, Jumlah Pertemuan)
- Kompetensi Awal Peserta Didik
- Profil Pelajar Pancasila / Profil Lulusan yang dikembangkan
- Sarana dan Prasarana
- Target Peserta Didik
- Model/Pendekatan/Metode Pembelajaran

**B. KOMPONEN INTI**
1. Capaian Pembelajaran (CP)
2. Tujuan Pembelajaran (TP)
3. Pemahaman Bermakna
4. Pertanyaan Pemantik

**C. KEGIATAN PEMBELAJARAN**
Uraikan secara detail setiap fase sesuai sintaks model ${modelText}:
- Kegiatan Pendahuluan (± 10 menit): apersepsi, motivasi, tujuan pembelajaran
- Kegiatan Inti: ikuti sintaks/fase model pembelajaran secara urut dan rinci
  (Tuliskan aktivitas guru DAN siswa untuk setiap fase)
- Kegiatan Penutup (± 10 menit): refleksi, simpulan, tindak lanjut

**D. ASESMEN**
- Asesmen Diagnostik (sebelum pembelajaran)
- Asesmen Formatif (selama pembelajaran)
- Asesmen Sumatif (di akhir pembelajaran)
- Instrumen Penilaian (rubrik/kisi-kisi singkat)

**E. PENGAYAAN DAN REMEDIAL**
- Kegiatan Pengayaan untuk peserta didik yang sudah mencapai TP
- Kegiatan Remedial untuk peserta didik yang belum mencapai TP

**F. LAMPIRAN**
- Bahan Ajar / Materi Pendukung (ringkasan materi)
- LKPD (Lembar Kerja Peserta Didik) minimal 1 lembar
- Glosarium istilah penting
- Daftar Pustaka

=== CATATAN PENTING ===
- Gunakan bahasa Indonesia yang baik dan benar
- Kegiatan pembelajaran harus kontekstual dan sesuai usia siswa ${kelas}
- Aktivitas harus mencerminkan dimensi Profil Lulusan: ${profilText}
- Pastikan ada unsur diferensiasi (konten/proses/produk) untuk keberagaman peserta didik`;

    document.getElementById('hasilPromptModulAjar').value = prompt;
    const area = document.getElementById('areaHasilPromptModul');
    area.classList.remove('hidden');
    area.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

window.updateMaMateriOpts = function() {
    const box = document.getElementById('maMateriOptions');
    if (!box) return;
    const k = (document.getElementById('mKelas') || {}).value || '';
    const m = (document.getElementById('mMapel') || {}).value || '';
    if (!k || !m) {
        box.innerHTML = '<p class="text-xs text-orange-100 italic">Pilih Kelas &amp; Mapel terlebih dahulu.</p>';
        window.updateMaATPOpts();
        return;
    }
    const semTerpilih = (document.querySelector('.maSemCheck:checked') || {}).value || '';
    const filtered = _getNormalizedKurikulumRows(k, m, semTerpilih);
    const materiMap = new Map();
    filtered.forEach(it => {
        const materi = (getMateriEsensial(it) || getBabField(it) || it.TujuanPembelajaran || '').trim();
        if (!materi) return;
        if (!materiMap.has(materi)) {
            const sem = _getItemSemester(it);
            materiMap.set(materi, sem);
        }
    });
    if (materiMap.size === 0) {
        box.innerHTML = `<p class="text-xs text-orange-100 italic">${semTerpilih ? 'Tidak ada Materi untuk ' + semTerpilih + '.' : 'Tidak ada data Materi untuk pilihan ini.'}</p>`;
        window.updateMaATPOpts();
        return;
    }
    box.innerHTML = Array.from(materiMap.entries()).map(([materi, sem], idx) => {
        const dispVal = materi.replace(/"/g, '&quot;');
        const semBadge = (!semTerpilih && sem) ? `<span class="ml-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-yellow-300 text-orange-800">${sem}</span>` : '';
        return `
        <label class="flex items-start gap-2 text-xs font-semibold text-white cursor-pointer hover:bg-white/20 rounded px-1 py-0.5">
            <input type="radio" name="maMateriFilter" class="maMateriRad mt-0.5 w-4 h-4 accent-orange-400 flex-shrink-0" value="${dispVal}"
                onchange="window.updateMaATPOpts()">
            <span>${materi}${semBadge}</span>
        </label>`;
    }).join('');
    window.updateMaATPOpts();
};

window.updateMaATPOpts = function() {
    const box = document.getElementById('maATPOptions');
    if (!box) return;
    const k = (document.getElementById('mKelas') || {}).value || '';
    const m = (document.getElementById('mMapel') || {}).value || '';
    if (!k || !m) {
        box.innerHTML = '<p class="text-xs text-orange-100 italic">Pilih Kelas &amp; Mapel terlebih dahulu.</p>';
        return;
    }
    const semTerpilih = (document.querySelector('.maSemCheck:checked') || {}).value || '';
    const materiTerpilih = (document.querySelector('.maMateriRad:checked') || {}).value || '';
    const filtered = _getNormalizedKurikulumRows(k, m, semTerpilih);
    const rowsForMateri = materiTerpilih
        ? filtered.filter(it => (getMateriEsensial(it) || getBabField(it) || '').trim() === materiTerpilih.trim())
        : filtered;
    // Tampilkan TujuanPembelajaran per baris individual (bukan ATP yang dideduplikasi).
    // TujuanPembelajaran = field tujuanpembelajaran dari mc_masterkurikulumbaru,
    // sudah dinormalisasi oleh _getNormalizedKurikulumRows ke key TujuanPembelajaran.
    const tpRows = rowsForMateri
        .map(it => String(it.TujuanPembelajaran || '').trim())
        .filter(Boolean);
    const seen = new Set();
    const tpUniq = tpRows.filter(tp => { if (seen.has(tp)) return false; seen.add(tp); return true; });
    if (tpUniq.length === 0) {
        box.innerHTML = '<p class="text-xs text-orange-100 italic">' + (materiTerpilih ? 'Tidak ada Tujuan Pembelajaran untuk materi ini.' : 'Pilih Materi di atas untuk menampilkan Tujuan Pembelajaran.') + '</p>';
        return;
    }
    box.innerHTML = tpUniq.map(tp => {
        const dispVal = tp.replace(/"/g, '&quot;');
        return `
        <label class="flex items-start gap-2 text-xs font-semibold text-white cursor-pointer hover:bg-white/20 rounded px-1 py-0.5">
            <input type="radio" name="maATPFilter" class="maATPRad mt-0.5 w-4 h-4 accent-orange-400 flex-shrink-0" value="${dispVal}">
            <span>${tp}</span>
        </label>`;
    }).join('');
};

    }).join('');

window.updatePmATPOpts = function() {
    const box = document.getElementById('pmATPOptions');
    if (!box) return;
    const k = (document.getElementById('pmKelas') || {}).value || '';
    const m = (document.getElementById('pmMapel') || {}).value || '';
    if (!k || !m) {
        box.innerHTML = '<p class="text-xs text-gray-400 italic">Pilih Kelas &amp; Mapel terlebih dahulu.</p>';
        return;
    }
    const semTerpilih = (document.querySelector('.pmSemCheck:checked') || {}).value || '';
    const materiTerpilih = (document.querySelector('.pmMateriRad:checked') || {}).value || '';
    const filtered = _getNormalizedKurikulumRows(k, m, semTerpilih);
    const rowsForMateri = materiTerpilih
        ? filtered.filter(it => (getMateriEsensial(it) || getBabField(it) || '').trim() === materiTerpilih.trim())
        : filtered;
    // Tampilkan ATP per baris individual (bukan di-deduplikasi berdasarkan string ATP),
    // agar semua entri ATP muncul terpisah sesuai urutan baris database.
    const atpRows = rowsForMateri
        .map(it => String(it.ATP || it.AlurTujuanPembelajaran || it.TujuanPembelajaran || '').trim())
        .filter(Boolean);
    // Hapus duplikat persis (string identik) tapi pertahankan urutan baris database
    const seen = new Set();
    const atpUniq = atpRows.filter(atp => { if (seen.has(atp)) return false; seen.add(atp); return true; });
    if (atpUniq.length === 0) {
        box.innerHTML = '<p class="text-xs text-gray-400 italic">' + (materiTerpilih ? 'Tidak ada ATP untuk materi ini.' : 'Pilih Materi di atas untuk menampilkan ATP.') + '</p>';
        return;
    }
    box.innerHTML = atpUniq.map(atp => {
        const dispVal = atp.replace(/"/g, '&quot;');
        return `
        <label class="flex items-start gap-2 text-xs font-semibold text-gray-700 cursor-pointer hover:bg-orange-50 rounded px-1 py-0.5">
            <input type="radio" name="pmATPFilter" class="pmATPRad mt-0.5 w-4 h-4 accent-orange-500 flex-shrink-0" value="${dispVal}">
            <span>${atp}</span>
        </label>`;
    }).join('');
};

window.hitungBobot = function() {
    const get = (id) => {
        const el = document.getElementById(id);
        return (el && !el.disabled) ? (parseInt(el.value) || 0) : 0;
    };
    const cbPG    = document.getElementById('cbPG')?.checked;
    const cbIsian = document.getElementById('cbIsian')?.checked;
    const cbUraian= document.getElementById('cbUraian')?.checked;

    const totalPG    = cbPG    ? get('jmlPG')    * get('bobotPG')    : 0;
    const totalIsian = cbIsian ? get('jmlIsian')  * get('bobotIsian') : 0;
    const totalUraian= cbUraian? get('jmlUraian') * get('bobotUraian'): 0;
    const grand = totalPG + totalIsian + totalUraian;

    const fmt = (n) => n > 0 ? `Total: ${n} poin` : '';
    const dPG    = document.getElementById('bobotPGDisplay');
    const dIsian = document.getElementById('bobotIsianDisplay');
    const dUraian= document.getElementById('bobotUraianDisplay');
    if (dPG)    dPG.textContent    = cbPG    ? fmt(totalPG)    : '';
    if (dIsian) dIsian.textContent = cbIsian ? fmt(totalIsian) : '';
    if (dUraian)dUraian.textContent= cbUraian? fmt(totalUraian): '';

    const totalEl = document.getElementById('totalBobotVal');
    const warnEl  = document.getElementById('bobotWarning');
    const boxEl   = document.getElementById('totalBobotBox');
    if (totalEl) totalEl.textContent = grand;
    if (warnEl)  warnEl.classList.toggle('hidden', grand === 100);
    if (boxEl) {
        boxEl.style.borderColor = grand === 100 ? '#4ade80' : (grand > 100 ? '#f87171' : '#facc15');
        boxEl.style.color       = grand === 100 ? '#4ade80' : (grand > 100 ? '#f87171' : '#fde68a');
    }
};

--- PRAKTIK PEDAGOGIS ---

--- KEGIATAN AWAL ---
Harus memuat 3 sub-bagian dengan label BOLD di awal:

2. <b>Apersepsi Kontekstual (Bermakna)</b> – kaitkan materi dengan pengalaman nyata peserta didik, tanya jawab pemantik

  • MENGAPLIKASI → sintaks yang berfokus penerapan/praktik/kerja kelompok (biasanya sintaks tengah)

Berdasarkan deskripsi kegiatan yang kamu buat untuk setiap tahap (MEMAHAMI/MENGAPLIKASI/MEREFLEKSI),

  • Bermakna      → kegiatan yang menghubungkan materi dengan konteks nyata, pengalaman, relevansi kehidupan
  • Menggembirakan → kegiatan yang melibatkan kolaborasi, permainan, kompetisi sehat, kreativitas, apresiasi
Satu tahap BOLEH memuat 1, 2, atau ketiga prinsip sekaligus — sesuaikan dengan isi kegiatan yang kamu buat.

    // Helper: panggil API sesuai provider

    // Fungsi repair JSON yang terpotong akibat batas token
    function _repairJSON(text) {
        // Coba parse langsung dulu
        try { return JSON.parse(text); } catch(e) {}

        // Coba ekstrak blok JSON terluar dengan regex
        const jsonMatch = text.match(/\{[\s\S]*/);
        if (!jsonMatch) throw new Error('Tidak ditemukan blok JSON dalam respons AI');
        let s = jsonMatch[0];

        // Hapus trailing koma sebelum tutup kurung (JSON tidak valid)
        s = s.replace(/,\s*([\}\]])/g, '$1');

        // Coba tutup string yang terpotong dan objek yang belum ditutup
        const candidates = [
            s,
            s + '"',
            s + '"}',
            s + '"}}',
            s + '"}}}',
            s + '}',
            s + '}}',
        ];
        for (const c of candidates) {
            try { return JSON.parse(c); } catch(e) {}
        }

        // Terakhir: potong sampai karakter valid terakhir dan tutup
        for (let i = s.length - 1; i > 0; i--) {
            if (s[i] === ',' || s[i] === '"' || s[i] === ':') continue;
            if (s[i] === '}' || s[i] === ']') {
                try { return JSON.parse(s.substring(0, i + 1)); } catch(e) {}
            }
            const tries = [s.substring(0, i + 1) + '"}', s.substring(0, i + 1) + '"}}'];
            for (const t of tries) {
                try { return JSON.parse(t); } catch(e) {}
            }
        }
        throw new Error('JSON tidak dapat diperbaiki — respons AI terpotong terlalu jauh');
    }

// ── TOGGLE MODE VALIDASI BERDAMPINGAN ───────────────────────────────────────
// PENTING: fungsi ini memindahkan node DOM tabel (bukan render ulang seluruh halaman),
// agar edit sel yang belum disimpan (belum klik "Simpan") TIDAK hilang saat toggle.
window._toggleKaldikValidasiMode = function(mode) {
    const newMode = (mode !== undefined) ? mode : !window._kaldikValidasiMode;
    if (newMode === window._kaldikValidasiMode) return;

    const tableCard = document.getElementById('kaldikTableCard');
    const anchor = document.getElementById('kaldikTableCardAnchor');

    if (!tableCard || !anchor) {
        // Elemen belum ada di DOM (mis. tab belum pernah dirender) -> fallback render ulang penuh
        window._kaldikValidasiMode = newMode;
        window.renderGuruKalender('analisis');
        return;
    }

    window._kaldikValidasiMode = newMode;

    const btn = document.getElementById('kaldikValidasiToggleBtn');
    if (btn) {
        btn.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border transition ${newMode ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-white text-cyan-700 border-cyan-200 hover:bg-cyan-50'}`;
        btn.innerHTML = `<i class="fas fa-columns"></i> ${newMode ? 'Tampilan Normal' : 'Tampilan Berdampingan'}`;
    }

    if (newMode) {
        const wrap = document.createElement('div');
        wrap.id = 'kaldikValidasiWrap';
        wrap.className = 'grid grid-cols-1 lg:grid-cols-12 gap-6 items-start';
        const leftCol = document.createElement('div');
        leftCol.className = 'lg:col-span-5';
        leftCol.innerHTML = window._buildKaldikSidePanel();
        const rightCol = document.createElement('div');
        rightCol.className = 'lg:col-span-7';

        anchor.parentNode.insertBefore(wrap, anchor);
        wrap.appendChild(leftCol);
        wrap.appendChild(rightCol);
        rightCol.appendChild(anchor); // anchor ikut pindah agar posisi asal tetap konsisten saat kembali
        rightCol.appendChild(tableCard); // memindahkan node tabel apa adanya (edit yang belum tersimpan tetap utuh)
    } else {
        const wrap = document.getElementById('kaldikValidasiWrap');
        if (wrap) {
            wrap.parentNode.insertBefore(anchor, wrap);
            wrap.parentNode.insertBefore(tableCard, wrap);
            wrap.remove();
        }
    }

    // Scroll ke area tabel/gambar agar user langsung melihat hasilnya
    setTimeout(() => { tableCard.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
};

// Panel gambar kalender terupload, ditampilkan berdampingan dengan tabel saat mode validasi aktif
window._buildKaldikSidePanel = function() {
    const fd = window._kaldikFileData;
    if (!fd) {
        return `
        <div class="bg-white rounded-2xl shadow-md border border-cyan-100 p-6 text-center text-gray-400">
            <i class="fas fa-image text-4xl mb-2 block text-gray-300"></i>
            <p class="text-sm">Belum ada file kalender yang diupload untuk dibandingkan.<br>Upload file di atas terlebih dahulu.</p>
        </div>`;
    }

    const pages = (fd.pages && fd.pages.length > 0) ? fd.pages : (fd.base64 ? [{ base64: fd.base64, mimeType: fd.mimeType }] : []);
    const isRawPdf = fd.mimeType === 'application/pdf' && (!fd.pages || fd.pages.length === 0);

    let bodyHtml;
    if (isRawPdf || pages.length === 0) {
        bodyHtml = `<div class="text-center text-gray-400 text-sm py-8">
            <i class="fas fa-file-pdf text-4xl mb-2 block text-red-300"></i>
            Pratinjau PDF ini tidak tersedia untuk ditampilkan besar. Gunakan file JPG/PNG, atau file akan tetap dianalisis seperti biasa.
        </div>`;
    } else {
        bodyHtml = pages.map((p, idx) => {
            const src = `data:${p.mimeType};base64,${p.base64}`;
            return `
            <div class="mb-3 last:mb-0">
                ${pages.length > 1 ? `<p class="text-[11px] font-bold text-cyan-600 mb-1">Halaman ${idx + 1} / ${pages.length}</p>` : ''}

                     class="w-full rounded-lg border-2 border-cyan-200 shadow cursor-zoom-in hover:opacity-90 transition"
                     onclick="openImageModal(this.src)">
            </div>`;
        }).join('');
    }

    return `
    <div class="bg-white rounded-2xl shadow-md border border-cyan-100 p-4 lg:sticky lg:top-4 lg:self-start lg:max-h-[calc(100vh-2rem)] lg:overflow-y-auto">

};

window._getKaldikMonths = function(tahunAjaran) {
    const parts = tahunAjaran.split('/');
    const y1 = parseInt(parts[0]); const y2 = parseInt(parts[1]);
    const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const months = [];
    // Sem I: Juli - Desember y1
    for (let m = 6; m <= 11; m++) months.push({ label: namaBulan[m] + ' ' + y1, year: y1, month: m });
    // Sem II: Januari - Juni y2
    for (let m = 0; m <= 5; m++) months.push({ label: namaBulan[m] + ' ' + y2, year: y2, month: m });
    return months;
};

window._daysInMonth = function(year, month) {
    return new Date(year, month + 1, 0).getDate();
};

window._loadKaldikData = function() {

window._saveKaldikData = function(showAlert) {
    const ta = document.getElementById('kaldikTahunAjaran')?.value || '2025/2026';
    const months = window._getKaldikMonths(ta);
    const rows = months.map((m, i) => {

            row[k] = el ? (el.innerText || el.value || '') : '';

        return { bulan: m.label, ...row };

    let all = [];

// ── AUTO CALC PER ROW ──────────────────────────────────────────────────────
window._autoCalcKaldikRow = function(rowIdx) {
    const g = id => { const el = document.getElementById(`kc_${rowIdx}_${id}`); return el ? parseInt(el.innerText||el.value||'0')||0 : 0; };
    const s = (id, v) => { const el = document.getElementById(`kc_${rowIdx}_${id}`); if(el) el.innerText = v; };
    const ne = g('minggu') + g('liburUmum') + g('liburSemester') + g('liburKhusus') + g('liburKeagamaan');
    s('jumlahNE', ne > 0 ? ne : '');
    const hari = g('jumlahHari');
    s('hariSekolah', hari > 0 ? Math.max(0, hari - ne) : '');
    window._calcKaldikSummary();
};

// ── SUMMARY ROWS ───────────────────────────────────────────────────────────
window._calcKaldikSummary = function() {
    const cols = ['jumlahHari','minggu','liburUmum','liburSemester','liburKhusus','liburKeagamaan','jumlahNE','awalTP','hariTatapMuka','asesmenAkhir','ujianAkhir','pascaAAS','bagiRapor','hariSekolah'];
    const getV = (rowIdx, col) => { const el = document.getElementById(`kc_${rowIdx}_${col}`); return el ? parseInt(el.innerText||el.value||'0')||0 : 0; };
    const setS = (sem, col, v) => { const el = document.getElementById(`ks_${sem}_${col}`); if(el) el.textContent = v||'0'; };
    cols.forEach(col => {
        let s1=0,s2=0;
        for(let i=0;i<6;i++) s1+=getV(i,col);
        for(let i=6;i<12;i++) s2+=getV(i,col);
        setS('semI',col,s1); setS('semII',col,s2); setS('total',col,s1+s2);
    });
};

// ── FILE HANDLING ──────────────────────────────────────────────────────────
window._kaldikFileData = null; // { base64, mimeType, name, size }

window._kaldikHandleDrop = function(e) {
    e.preventDefault();
    document.getElementById('kaldikUploadZone').classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) window._kaldikHandleFile(f);
};

window._kaldikHandleFile = async function(file) {
    if (!file) return;
    const allowed = ['image/jpeg','image/png','image/webp','image/gif','application/pdf'];
    if (!allowed.includes(file.type)) {
        customAlert('Format file tidak didukung. Gunakan JPG, PNG, WEBP, atau PDF.', 'warning'); return;
    }

    const zone = document.getElementById('kaldikUploadZone');
    const previewArea = document.getElementById('kaldikPreviewArea');
    const imgBox = document.getElementById('kaldikImgPreview');
    const fnEl = document.getElementById('kaldikFileName');
    const fiEl = document.getElementById('kaldikFileInfo');

    fnEl.textContent = file.name;
    fiEl.textContent = (file.size / 1024).toFixed(1) + ' KB · ' + file.type;

    if (file.type === 'application/pdf') {
        // Render PDF page 1 using PDF.js (untuk preview thumbnail, tidak berubah)
        try {
            window._kaldikFileData = await window._pdfToImageBase64(file);
            imgBox.innerHTML = `<div class="bg-red-50 flex flex-col items-center justify-center p-4 rounded-xl w-40 h-28">
                <i class="fas fa-file-pdf text-red-500 text-4xl mb-1"></i>
                <span class="text-xs font-bold text-red-600 text-center">PDF · halaman 1<br>siap dianalisis</span></div>`;

            // Render SEMUA halaman agar Kaldik multi-halaman terbaca lengkap saat dianalisis AI
            try {
                const allPages = await window._pdfAllPagesToImageBase64(file);
                if (allPages && allPages.length > 0) {
                    window._kaldikFileData.pages = allPages;
                    if (allPages.length > 1) {
                        imgBox.innerHTML = `<div class="bg-red-50 flex flex-col items-center justify-center p-4 rounded-xl w-40 h-28">
                            <i class="fas fa-file-pdf text-red-500 text-4xl mb-1"></i>
                            <span class="text-xs font-bold text-red-600 text-center">PDF · ${allPages.length} halaman<br>siap dianalisis</span></div>`;
                    }
                }
            } catch(pagesErr) {
                // Gagal render semua halaman: tetap lanjut dengan halaman 1 saja (perilaku lama)
                console.warn('Gagal render semua halaman PDF, menggunakan halaman 1 saja:', pagesErr);
            }
        } catch(err) {
            // Fallback: send as base64 PDF directly (for Claude which supports documents)
            const b64 = await window._fileToBase64(file);
            window._kaldikFileData = { base64: b64, mimeType: 'application/pdf', name: file.name };
            imgBox.innerHTML = `<div class="bg-red-50 flex flex-col items-center justify-center p-4 rounded-xl w-40 h-28">
                <i class="fas fa-file-pdf text-red-500 text-4xl mb-1"></i>
                <span class="text-xs font-bold text-red-600 text-center">PDF siap dianalisis</span></div>`;
        }
    } else {
        const b64 = await window._fileToBase64(file);
        window._kaldikFileData = { base64: b64, mimeType: file.type, name: file.name };
        imgBox.innerHTML = `<img src="data:${file.type};base64,${b64}" class="max-w-[220px] max-h-[150px] object-contain rounded-xl border-2 border-cyan-200 shadow">`;
    }

    zone.querySelector('#kaldikUploadLabel').classList.add('hidden');
    previewArea.classList.remove('hidden');
    previewArea.classList.add('flex');
};

window._clearKaldikFile = function() {
    window._kaldikFileData = null;
    document.getElementById('kaldikFileInput').value = '';
    document.getElementById('kaldikPreviewArea').classList.add('hidden');
    document.getElementById('kaldikPreviewArea').classList.remove('flex');
    document.getElementById('kaldikUploadLabel').classList.remove('hidden');
    document.getElementById('kaldikImgPreview').innerHTML = '';
};

window._fileToBase64 = function(file) {
    return new Promise((res,rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
    });
};

window._pdfToImageBase64 = async function(pdfFile) {
    // Use PDF.js CDN
    if (!window.pdfjsLib) {
        await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const ab = await pdfFile.arrayBuffer();
    const pdfDoc = await window.pdfjsLib.getDocument({ data: ab }).promise;
    const page = await pdfDoc.getPage(1);
    const viewport = page.getViewport({ scale: 2.0 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const b64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
    return { base64: b64, mimeType: 'image/jpeg', name: pdfFile.name.replace('.pdf','') + '_p1.jpg' };
};

// Render SEMUA halaman PDF menjadi array gambar, agar Kaldik multi-halaman
// (mis. per triwulan/semester) tetap terbaca lengkap oleh AI, bukan hanya halaman 1.
// Dibatasi maksimal 8 halaman untuk menjaga ukuran payload tetap wajar.
window._pdfAllPagesToImageBase64 = async function(pdfFile) {
    if (!window.pdfjsLib) {
        await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const ab = await pdfFile.arrayBuffer();
    const pdfDoc = await window.pdfjsLib.getDocument({ data: ab }).promise;
    const maxPages = Math.min(pdfDoc.numPages, 8);
    const pages = [];
    for (let i = 1; i <= maxPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        const b64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
        pages.push({ base64: b64, mimeType: 'image/jpeg' });
    }
    return pages;
};

// ── AI ANALYSIS ────────────────────────────────────────────────────────────
// Fungsi repair JSON khusus untuk hasil analisis Kaldik, agar tahan terhadap
// respons AI yang mengandung teks tambahan, trailing comma, atau terpotong
// akibat batas token. Tidak mengubah/menggantikan _repairJSON milik fitur lain.
window._repairKaldikJSON = function(text) {
    // 1) Coba parse langsung
    try { return JSON.parse(text); } catch(e) {}

    // 2) Ambil blok JSON terluar (dari '{' pertama)
    const jsonMatch = text.match(/\{[\s\S]*/);
    if (!jsonMatch) throw new Error('Respons AI tidak mengandung JSON yang valid.');
    let s = jsonMatch[0];

    // 3) Hapus trailing koma sebelum tutup kurung/kurawal
    s = s.replace(/,\s*([\}\]])/g, '$1');

    // 4) Coba parse langsung setelah dibersihkan, lalu coba beberapa varian penutup
    const candidates = [
        s,
        s + '"',
        s + ']}',
        s + '"}]}',
        s + '}]}',
        s + ']}}',
        s + '}',
        s + '}}',
    ];
    for (const c of candidates) {
        try { return JSON.parse(c); } catch(e) {}
    }

    // 5) Terakhir: potong mundur ke penutup objek/array valid terakhir dalam array "rows"
    for (let i = s.length - 1; i > 0; i--) {
        if (s[i] === '}' || s[i] === ']') {
            const attempt = s.substring(0, i + 1);
            const tries = [attempt, attempt + ']}', attempt + '}]}'];
            for (const t of tries) {
                try { return JSON.parse(t); } catch(e) {}
            }
        }
    }
    throw new Error('Respons AI tidak dapat diparsing sebagai JSON (kemungkinan terpotong).');
};

window._analyzeKaldik = async function() {
    if (!window._kaldikFileData) { customAlert('Pilih file terlebih dahulu!', 'warning'); return; }

    const aiCfg = window.getAIConfig();
    if (!aiCfg.apiKey) {
        const go = await customConfirm('API Key AI belum diatur. Atur di Pengaturan AI terlebih dahulu?\n\nMau ke Pengaturan AI sekarang?', 'API Key Belum Ada');
        if (go) window.navTo('renderGuruPengaturan');
        return;
    }

    const ta = document.getElementById('kaldikTahunAjaran').value;
    const months = window._getKaldikMonths(ta);
    const monthNames = months.map(m => m.label);

    document.getElementById('kaldikAnalyzingBar').classList.remove('hidden');
    document.querySelector('#kaldikPreviewArea button[onclick*="_analyzeKaldik"]').disabled = true;

    const prompt = `Anda adalah analis kalender pendidikan sekolah dasar Indonesia yang teliti dan berpengalaman.

Saya akan memberikan gambar Kalender Pendidikan (Kaldik) sekolah untuk tahun ajaran ${ta}. Gambar bisa terdiri dari satu atau beberapa halaman/potongan yang mencakup seluruh bulan dalam tahun ajaran tersebut — gabungkan informasi dari semua gambar yang diberikan.

Tugas Anda: Baca dan analisis kalender tersebut, lalu ekstrak data jumlah hari untuk setiap bulan.

Bulan yang perlu dianalisis (urutan index 0-11):
${monthNames.map((m,i) => `${i}: ${m}`).join('\n')}

Untuk setiap bulan, hitung dan isi kolom berikut:
- jumlahHari: total hari dalam bulan tersebut
- minggu: jumlah hari Minggu (hari libur mingguan)
- liburUmum: jumlah hari libur nasional/umum
- liburSemester: jumlah hari libur semester (awal/akhir semester)
- liburKhusus: jumlah hari libur khusus sekolah
- liburKeagamaan: jumlah hari libur keagamaan
- awalTP: jumlah hari awal tahun pelajaran / MPLS (biasanya hanya Juli)
- hariTatapMuka: jumlah hari efektif tatap muka pembelajaran
- asesmenAkhir: jumlah hari asesmen akhir semester / PTS
- ujianAkhir: jumlah hari ujian akhir sekolah utama
- pascaAAS: jumlah hari pasca asesmen akhir sekolah
- bagiRapor: jumlah hari pembagian rapor

Jika data tertentu tidak terlihat jelas di kalender atau tidak ada, isi dengan 0.

WAJIB balas HANYA dalam format JSON murni berikut (tanpa markdown, tanpa penjelasan):
{
  "rows": [
    { "jumlahHari": 31, "minggu": 4, "liburUmum": 1, "liburSemester": 0, "liburKhusus": 0, "liburKeagamaan": 0, "awalTP": 3, "hariTatapMuka": 20, "asesmenAkhir": 0, "ujianAkhir": 0, "pascaAAS": 0, "bagiRapor": 0 },
    ... (12 objek total, urutan sesuai daftar bulan di atas)
  ]
}`;

    try {
        const { base64, mimeType, name } = window._kaldikFileData;
        // Gunakan seluruh halaman jika tersedia (PDF multi-halaman), fallback ke 1 gambar (perilaku lama)
        const pages = (window._kaldikFileData.pages && window._kaldikFileData.pages.length > 0)
            ? window._kaldikFileData.pages
            : [{ base64, mimeType }];
        const apiKey = aiCfg.apiKey;
        const modelName = aiCfg.model;
        const provider = aiCfg.provider;

        let rawText = '';

        if (provider === 'claude') {
            const imageBlocks = pages.map(p => ({
                type: 'image',
                source: { type: 'base64', media_type: p.mimeType === 'application/pdf' ? 'application/pdf' : p.mimeType, data: p.base64 }
            }));
            const msgContent = [...imageBlocks, { type: 'text', text: prompt }];
            const r = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
                body: JSON.stringify({ model: modelName, max_tokens: 8192, messages: [{ role: 'user', content: msgContent }] })
            });
            const d = await r.json();
            if (d.error) throw new Error(d.error.message);
            rawText = d.content?.[0]?.text || '{}';

        } else if (provider === 'gemini') {
            const inlineParts = pages.map(p => ({ inlineData: { mimeType: p.mimeType === 'application/pdf' ? 'image/jpeg' : p.mimeType, data: p.base64 } }));
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [...inlineParts, { text: prompt }] }], generationConfig: { maxOutputTokens: 8192 } })
            });
            const d = await r.json();
            if (d.error) throw new Error(d.error.message);
            rawText = d.candidates?.[0]?.content?.parts?.[0]?.text || '{}';

        } else if (provider === 'openai') {
            const imageBlocks = pages.map(p => ({ type: 'image_url', image_url: { url: `data:${p.mimeType === 'application/pdf' ? 'image/jpeg' : p.mimeType};base64,${p.base64}` } }));
            const r = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                body: JSON.stringify({ model: modelName, messages: [{ role: 'user', content: [...imageBlocks, { type: 'text', text: prompt }] }], max_tokens: 8192 })
            });
            const d = await r.json();
            if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
            rawText = d.choices?.[0]?.message?.content || '{}';

        } else if (provider === 'openrouter') {
            const imageBlocks = pages.map(p => ({ type: 'image_url', image_url: { url: `data:${p.mimeType === 'application/pdf' ? 'image/jpeg' : p.mimeType};base64,${p.base64}` } }));
            const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey, 'HTTP-Referer': window.location.origin, 'X-Title': 'MyClassroom Kaldik' },
                body: JSON.stringify({ model: modelName, messages: [{ role: 'user', content: [...imageBlocks, { type: 'text', text: prompt }] }], max_tokens: 8192 })
            });
            const d = await r.json();
            if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
            rawText = d.choices?.[0]?.message?.content || '{}';

        } else {
            throw new Error('Provider "' + provider + '" tidak mendukung analisis gambar. Gunakan Claude, Gemini, OpenAI, atau OpenRouter.');
        }

        // Parse AI response (tahan terhadap markdown fence, teks tambahan, & output terpotong)
        rawText = rawText.replace(/```json/gi,'').replace(/```/g,'').trim();
        let aiJson;
        try {
            aiJson = window._repairKaldikJSON(rawText);
        } catch(parseErr) {
            console.error('Kaldik AI raw response (gagal diparsing):', rawText);
            throw parseErr;
        }

        const aiRows = aiJson.rows || [];
        if (!Array.isArray(aiRows) || aiRows.length === 0) {
            throw new Error('Respons AI tidak berisi data "rows" yang valid.');
        }
        window._renderKaldikTable(aiRows);

        // Show success popup
        document.getElementById('kaldikSuccessPopup').classList.remove('hidden');

    } catch(err) {
        customAlert('Analisis gagal: ' + err.message, 'error');
    } finally {
        document.getElementById('kaldikAnalyzingBar').classList.add('hidden');
        const btn = document.querySelector('#kaldikPreviewArea button[onclick*="_analyzeKaldik"]');
        if (btn) btn.disabled = false;
    }
};

window.addKalender = async function() {
    const judul = document.getElementById('kJudul').value;
    const fotoFile = document.getElementById('kFoto').files[0];
    
    if(!judul || !fotoFile) { customAlert("Keterangan dan Foto wajib diisi!", "warning"); return; }
    
    document.getElementById('loadingText').innerText = "Mengupload ke Google Drive...";
    document.getElementById('loadingOverlay').classList.remove('hidden');
    
    try {
        let compressedBase64 = await compressImageToBase64(fotoFile, 1200); 
        let finalFotoUrl = await uploadFileToDrive(compressedBase64, 'Kalender_' + Date.now() + '.jpg');
        
        let data = { id: Date.now(), username: currentUserUsername, judul: judul, url: finalFotoUrl, schoolCode: currentSchoolCode };
        let kalenderDb = getDB('mc_kalender');
        kalenderDb.push(data);
        
        saveDB('mc_kalender', kalenderDb);
        syncToSheet('tambah_kalender', data);
        
        document.getElementById('loadingOverlay').classList.add('hidden');
        customAlert("Kalender berhasil diupload!", "success");
        window.renderGuruKalender('upload');
    } catch(e) {
        document.getElementById('loadingOverlay').classList.add('hidden');
        customAlert("Gagal upload: " + e.message, "error");
    }
};

window.deleteKalender = async function(id) {
    const isConfirm = await customConfirm("Hapus kalender pendidikan ini secara permanen?", "Konfirmasi Hapus");
    if(!isConfirm) return;
    
    document.getElementById('loadingText').innerText = "Menghapus...";
    document.getElementById('loadingOverlay').classList.remove('hidden');
    
    let kalenderDb = getDB('mc_kalender').filter(k => k.id != id);
    saveDB('mc_kalender', kalenderDb);
    syncToSheet('hapus_kalender', { id: id });
    
    document.getElementById('loadingOverlay').classList.add('hidden');
    window.renderGuruKalender('upload');
};

window.updateAgendaMapel = function() {
    const kls = document.getElementById('agKelas').value;
    // Sumber: mc_masterkurikulumbaru — filter langsung via field item.Kelas
    const masterBaru = getDB('mc_masterkurikulumbaru') || [];

    // Prioritas 1: filter mc_masterkurikulumbaru via field item.Kelas (jika tersedia per baris)
    let mapels = [];
    if(masterBaru.length > 0) {
        let rowsKelas = masterBaru.filter(function(item){ return String(item.Kelas||'').trim() === kls.trim(); });
        mapels = [...new Set(rowsKelas.map(function(k){ return (k.Matapelajaran||k.matapelajaran||k.MataPelajaran||'').trim(); }).filter(Boolean))].sort();
    }

    // Fallback ke mc_kurikulum jika masterBaru tidak punya item.Kelas per baris TP
    // (mc_kurikulum adalah hasil auto-generate yang sudah punya field Kelas di setiap baris)
    if(mapels.length === 0) {
        const mcKur = getDB('mc_kurikulum') || [];
        const rowsKur = mcKur.filter(function(k){ return String(k.Kelas||'').trim() === kls.trim(); });
        mapels = [...new Set(rowsKur.map(function(k){ return (k.MataPelajaran||k.mataPelajaran||'').trim(); }).filter(Boolean))].sort();
    }

    document.getElementById('agMapel').innerHTML = '<option value="">-- Pilih Mata Pelajaran --</option>' + mapels.map(m => `<option value="${m}">${m}</option>`).join('');

    // Reset ATP, Materi, TP
    document.getElementById('agRefTP').innerHTML = '<option value="">-- Pilih Mata Pelajaran Terlebih Dahulu --</option>';
    document.getElementById('agMateri').value = '';
    document.getElementById('agTP').value = '';
};

// Dipanggil saat Mapel berubah: bangun ATP dropdown dengan data-materi per baris (pola Prota)
window.updateAgendaMateri = function() {
    const kls = document.getElementById('agKelas').value;
    const mpl = document.getElementById('agMapel').value;
    const masterBaru = getDB('mc_masterkurikulumbaru') || [];
    let db = [];
    let useMasterBaru = false;

    if(masterBaru.length > 0) {
        // Prioritas: filter mc_masterkurikulumbaru via item.Kelas (jika field Kelas tersedia per baris)
        let mapelLower = mpl.toLowerCase().trim();
        let filtered = masterBaru.filter(function(k) {
            let kelasMatch = String(k.Kelas||'').trim() === kls.trim();
            let mp = (k.Matapelajaran||k.matapelajaran||k.MataPelajaran||'').trim();
            let mapelMatch = mp.toLowerCase() === mapelLower;
            // Hanya baris berisi konten ATP atau TP (bukan baris header kosong)
            let hasContent = String(k.alurtujuanpembelajaran||'').replace(/^\s*Kelas\s+\d+[A-Za-z]?\s*[:\.-]?\s*/i,'').trim() !== '' || String(k.tujuanpembelajaran||'').trim() !== '';
            return kelasMatch && mapelMatch && hasContent;
        });
        if(filtered.length > 0) {
            db = filtered;
            useMasterBaru = true;
        }
    }

    // Fallback ke mc_kurikulum jika masterBaru tidak punya item.Kelas per baris TP
    if(!useMasterBaru) {
        db = getDB('mc_kurikulum').filter(function(k){
            return String(k.Kelas||'').trim() === kls.trim() && (k.MataPelajaran||'').trim() === mpl.trim();
        });
    }

    // Bangun ATP dropdown — setiap option membawa data-materi dan data-tp dari baris yang sama
    let atpOpts = '<option value="">-- Pilih ATP --</option>';
    if(useMasterBaru) {
        db.forEach(function(k) {
            let atp = String(k.alurtujuanpembelajaran || '')
                .replace(/^\s*Kelas\s+\d+[A-Za-z]?\s*[:\.-]?\s*/i, '')
                .trim();
            if(!atp) return;
            let materi = (k.materi||'').trim();
            let tp     = (k.tujuanpembelajaran||k.TujuanPembelajaran||'').trim();
            atpOpts += '<option value="' + atp.replace(/"/g,'&quot;') +
                       '" data-materi="' + materi.replace(/"/g,'&quot;') +
                       '" data-tp="'    + (tp||atp).replace(/"/g,'&quot;') +
                       '">' + atp + '</option>';
        });
    } else {
        // Gunakan mc_kurikulum: pakai TujuanPembelajaran sebagai ATP, Materi/MateriPokok sebagai materi
        db.forEach(function(k) {
            let tp  = (k.TujuanPembelajaran||'').trim();
            let atp = (k.ATP||tp).trim();
            let mat = (k.Materi||k.MateriPokok||'').trim();
            if(!tp) return;
            let label = atp || tp;
            atpOpts += '<option value="' + label.replace(/"/g,'&quot;') +
                       '" data-materi="' + mat.replace(/"/g,'&quot;') +
                       '" data-tp="'    + tp.replace(/"/g,'&quot;') +
                       '">' + label + '</option>';
        });
    }
    document.getElementById('agRefTP').innerHTML = atpOpts;

    // Reset textarea
    document.getElementById('agMateri').value = '';
    document.getElementById('agTP').value = '';
};

window.applyAgendaTP = function() {
    const sel = document.getElementById('agRefTP');
    const opt = sel.options[sel.selectedIndex];
    const elMateri = document.getElementById('agMateri');
    const elTP     = document.getElementById('agTP');
    if(!opt || !opt.value) {
        elMateri.value = ''; window.agResize(elMateri);
        elTP.value     = ''; window.agResize(elTP);
        return;
    }
    let materi = (opt.getAttribute('data-materi') || '').trim();
    elMateri.value = materi || opt.value; window.agResize(elMateri);
    elTP.value     = opt.value;           window.agResize(elTP);
};

window.editAgenda = function(id) {
    editingAgendaId = id;
    window.renderGuruAgenda();
    const ag = getDB('mc_agenda').find(x => x.id == id);
    if(ag) {
        document.getElementById('agHari').value = ag.hari;
        document.getElementById('agTanggal').value = ag.tanggal;
        // Parse pukul (07.00-09.00 atau 07:00-09:00) ke dua time input
        const parsePukul = (str) => {
            if (!str || str === '-') return ['', ''];
            const norm = str.replace(/\./g, ':');   // titik → titik dua
            const parts = norm.split('-').map(s => s.trim());
            // Pastikan format HH:MM valid
            const toTime = s => /^\d{1,2}:\d{2}$/.test(s) ? s.padStart(5, '0') : '';
            return [toTime(parts[0] || ''), toTime(parts[1] || '')];
        };
        const [pm, ps] = parsePukul(ag.pukul);
        document.getElementById('agPukulMulai').value   = pm;
        document.getElementById('agPukulSelesai').value = ps;
        document.getElementById('agH').value = ag.hadir;
        document.getElementById('agS').value = ag.sakit;
        document.getElementById('agI').value = ag.izin;
        document.getElementById('agA').value = ag.alpha;
        document.getElementById('agKelas').value = ag.kelas;
        window.updateAgendaMapel();
        
            document.getElementById('agMapel').value = ag.mapel;
            window.updateAgendaMateri();
            document.getElementById('agMateri').value = ag.materi;
            document.getElementById('agTP').value = ag.tp;
            document.getElementById('agTMT').value = ag.tmt;
            document.getElementById('agTMTT').value = ag.tmtt;
            document.getElementById('agProses').value = ag.proses;
        
    }
    window.scrollTo({top: 0, behavior: 'smooth'});
};

window.importKurikulumExcel = async function(event) {
    await window.ensureXlsx();
    let file = event.target.files[0];
    if (!file) return;

    document.getElementById('loadingText').innerText = "Membaca File Excel...";
    document.getElementById('loadingOverlay').classList.remove('hidden');

    let reader = new FileReader();
    reader.onload = function(e) {
        try {
            let data = new Uint8Array(e.target.result);
            let workbook = XLSX.read(data, {type: 'array'});
            let firstSheetName = workbook.SheetNames[0];
            let worksheet = workbook.Sheets[firstSheetName];
            let jsonData = XLSX.utils.sheet_to_json(worksheet);

            if(jsonData.length === 0) throw new Error("File Excel kosong atau format tidak terbaca.");

            let masterDB   = getDB('mc_masterkurikulumbaru');
            let newRecords = [];
            let idBase     = Date.now();

            jsonData.forEach((row, index) => {
                // Mapping fleksibel — toleran terhadap variasi huruf besar/kecil header
                let fase   = String(row["Fase"] || row["fase"] || '').trim().toUpperCase();
                let mapel  = String(row["Matapelajaran"] || row["MataPelajaran"] || row["Mata Pelajaran"] || row["Mapel"] || '').trim();

                // Kolom wajib: Fase, Matapelajaran, tujuanpembelajaran
                if(!fase || !mapel || !tp) return;

                let newItem = {
                    id: idBase + index,
                    Fase: fase,
                    Matapelajaran: mapel,
                    elemen: String(row["elemen"] || row["Elemen"] || '').trim(),
                    capaianpembelajaran: String(row["capaianpembelajaran"] || row["Capaian Pembelajaran"] || row["CP"] || '').trim(),
                    tujuanpembelajaran: tp,
                    alurtujuanpembelajaran: String(row["alurtujuanpembelajaran"] || row["ATP"] || row["Alur TP"] || '').trim(),
                    materi: String(row["materi"] || row["Materi"] || '').trim(),
                    semester: String(row["semester"] || row["Semester"] || '').trim(),
                    Kelas: String(row["Kelas"] || row["kelas"] || '').trim(),
                    Keterangan: String(row["Keterangan"] || row["keterangan"] || '').trim()
                };
                masterDB.push(newItem);
                newRecords.push(newItem);
            });

            if(newRecords.length > 0) {
                saveDB('mc_masterkurikulumbaru', masterDB);
                syncToSheet('import_masterkurikulum', newRecords);
                // Rebuild mc_kurikulum dari master terbaru
                window.autoGenerateKurikulumDariMaster();
                customAlert(`Berhasil mengimpor ${newRecords.length} baris ke Master Kurikulum!`, "success");
                window.renderGuruDatabase();
            } else {
                customAlert("Gagal import! Pastikan kolom Fase, Matapelajaran, dan tujuanpembelajaran terisi. Gunakan tombol Template untuk format yang benar.", "error");
            }
        } catch(error) {
            customAlert("Gagal memproses Excel: " + error.message, "error");
        } finally {
            document.getElementById('loadingOverlay').classList.add('hidden');
            event.target.value = '';
        }
    };
    reader.readAsArrayBuffer(file);
};

window.importDapodikExcel = async function(event) {
    await window.ensureXlsx();
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('loadingText').innerText = "Memproses Data Dapodik...";
    document.getElementById('loadingOverlay').classList.remove('hidden');

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            // Dapodik header is at row 5 (index 4), data starts row 7 (index 6)
            // Use raw array to access by column index (AQ = index 42)
            const jsonRaw = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

            if (jsonRaw.length < 7) throw new Error("Format file tidak dikenali sebagai file Dapodik.");

            let studentsDB = getDB('mc_students');
            let newRecords = [];
            let kelasSet = new Set();

            // Data rows start from index 6 (row 7 in Excel)
            for (let i = 6; i < jsonRaw.length; i++) {
                const row = jsonRaw[i];
                if (!row || row.length === 0) continue;
                // Col B (1) = Nama, Col E (4) = NISN, Col AQ (42) = Rombel Saat Ini
                // Helper: konversi ke Title Case sesuai EYD
                const _eydParticles = new Set(['bin','binti','van','de','den','der','el','al','abu','bou','bt','bte']);
                const toEYD = function(str) {
                    return String(str).toLowerCase().replace(/\b[a-z]+/g, function(word, offset) {
                        if (offset > 0 && _eydParticles.has(word)) return word;
                        return word.charAt(0).toUpperCase() + word.slice(1);
                    });
                };
                const nama  = toEYD(String(row[1]  || '').trim());
                const nisn  = String(row[4]  || '').trim();
                const kelas = toEYD(String(row[42] || '').trim());
                if (!nama || !kelas) continue;
                kelasSet.add(kelas);
                // Avoid duplicates
                const isExist = studentsDB.some(s => s.nama === nama && s.kelas === kelas);
                if (!isExist) {
                    const idx = newRecords.length + studentsDB.length;
                    const newS = {
                        id: Date.now() + idx,
                        nisn: nisn,
                        nama: nama,
                        kelas: kelas,
                        foto: '',
                        schoolCode: currentSchoolCode,
                        guruUsername: currentUserUsername
                    };
                    studentsDB.push(newS);
                    newRecords.push(newS);
                }
            }

            // Update state: build sorted kelas list, aktifkan filter otomatis
            dapodikKelasOptions = Array.from(kelasSet).sort();
            dapodikSelectedKelas = dapodikKelasOptions[0] || '';
            dapodikFilterActive = true;
            setSafe('mc_dapodik_kelas',     JSON.stringify(dapodikKelasOptions));
            setSafe('mc_dapodik_kelas_sel', dapodikSelectedKelas);
            setSafe('mc_dapodik_filter',    'true');

            if (newRecords.length > 0) {
                saveDB('mc_students', studentsDB);
                syncToSheet('import_siswa', newRecords);
            }

            document.getElementById('loadingOverlay').classList.add('hidden');
            customAlert(
                (newRecords.length > 0
                    ? `Berhasil mengimpor ${newRecords.length} siswa baru dari Dapodik!`
                    : 'Semua data Dapodik sudah ada, tidak ada duplikasi.') +
                ` Ditemukan ${dapodikKelasOptions.length} kelas: ${dapodikKelasOptions.join(', ')}`,
                newRecords.length > 0 ? 'success' : 'warning'
            );
            renderGuruSiswa();
        } catch (error) {
            customAlert("Gagal membaca file Dapodik: " + error.message, "error");
            document.getElementById('loadingOverlay').classList.add('hidden');
        } finally {
            event.target.value = '';
        }
    };
    reader.readAsArrayBuffer(file);
};

// =========================================================================
// FITUR BARU: KRITERIA KETERCAPAIAN TUJUAN PEMBELAJARAN (KKTP)
// =========================================================================
// -------------------------------------------------------------------------
// Helper: Filter baris mc_masterkurikulumbaru untuk kelas tertentu.
// Menggunakan carry-forward: begitu ATP berisi "Kelas X", semua baris
// berikutnya (termasuk baris itu sendiri) dianggap milik Kelas X —
// sampai muncul "Kelas Y" di ATP berikutnya.
// Pola ini konsisten dengan cara simpanKeMcKurikulumOtomatis membaca data.
// -------------------------------------------------------------------------
window._getKKTPRowsForKelas = function(masterRows, kelas) {
    // Normalisasi: "Kelas 4" / "kelas 4" / "4" → angka string, mis. "4"
    let targetNum = kelas.trim().replace(/^kelas\s+/i, '').trim().toLowerCase();

    let result = [];
    let currentKelasNum = null; // carry-forward angka kelas

    for(let i = 0; i < masterRows.length; i++) {
        let item = masterRows[i];
        // Prioritas: field item.Kelas (GAS baru, per-baris) → ATP regex carry-forward (GAS lama)
        let itemKelasRaw = String(item.Kelas || '').trim();
        if(itemKelasRaw) {
            currentKelasNum = itemKelasRaw.replace(/^kelas\s+/i, '').trim().toLowerCase();
        } else {
            let atp = String(item.alurtujuanpembelajaran || '').trim();
            let kelasMatch = atp.match(/Kelas\s+(\d+[A-Za-z]?)/i);
            if(kelasMatch) {
                currentKelasNum = kelasMatch[1].toLowerCase();
            }
        }
        // Sertakan baris jika kelas carry-forward sesuai target
        if(currentKelasNum === targetNum) {
            result.push(item);
        }
    }
    return result;
};

// Helper: Populate checkbox mapel KKTP dari mc_masterkurikulumbaru berdasarkan kelas terpilih
window.updateKKTPMapel = function() {
    let kelas = (document.getElementById('kktpKelas') || {}).value || '';
    let container = document.getElementById('kktpMapelContainer');
    if(!container) return;
    if(!kelas) { container.innerHTML = '<span class="text-gray-400 text-xs italic">Pilih filter utama terlebih dahulu...</span>'; return; }

    let masterBaru = getDB('mc_masterkurikulumbaru') || [];
    // Dapatkan baris yang masuk ke kelas ini
    let rowsKelas = window._getKKTPRowsForKelas(masterBaru, kelas);
    // Kumpulkan mapel unik dari baris tersebut
    let mapelSet = [];
    rowsKelas.forEach(function(item) {
        let mp = (item.Matapelajaran || item.matapelajaran || item.MataPelajaran || '').trim();
        if(mp && !mapelSet.includes(mp)) mapelSet.push(mp);
    });
    mapelSet.sort();

    if(mapelSet.length === 0) { container.innerHTML = '<span class="text-red-400 text-xs italic">Data mapel kosong.</span>'; return; }

    let html = `<label class="flex items-center space-x-2 mb-2 border-b pb-2 cursor-pointer sticky top-0 bg-white z-10"><input type="checkbox" onchange="window.toggleAllCb(this, 'cb-mapel-kktp')" class="form-checkbox text-blue-600 rounded"> <span class="font-bold text-blue-700 text-sm">Pilih Semua Mapel</span></label>`;
    mapelSet.forEach(function(m) {
        if(m) html += `<label class="flex items-center space-x-2 mb-1 cursor-pointer"><input type="checkbox" value="${m}" class="cb-mapel-kktp form-checkbox text-gray-600 rounded"> <span class="text-sm font-semibold text-gray-700">${m}</span></label>`;
    });
    container.innerHTML = html;
};

window.renderGuruKKTP = function() {
    window.setPageTitle("Kriteria Ketercapaian Tujuan Pembelajaran (KKTP)");
    // Sumber data KKTP: mc_masterkurikulumbaru (langsung, tanpa enrichment dari mc_kurikulum)
    const masterBaru = getDB('mc_masterkurikulumbaru') || [];
    if(masterBaru.length === 0) { 
        document.getElementById('main-content').innerHTML = `<div class="p-8 text-center bg-white rounded-xl shadow border border-red-200 max-w-2xl mx-auto mt-10"><i class="fas fa-database text-6xl text-red-400 mb-4"></i><h2 class="text-2xl font-bold text-gray-800 mb-2">Data Master Kosong</h2></div>`; 
        return; 
    }
    
    // Kelas diparsing dari kolom alurtujuanpembelajaran menggunakan pola carry-forward
    // yang sama dengan simpanKeMcKurikulumOtomatis: cari "Kelas X" di mana saja dalam ATP.
    let kelasUnik = [];
    masterBaru.forEach(function(item) {
        let atp = String(item.alurtujuanpembelajaran || '').trim();
        let m = atp.match(/Kelas\s+(\d+[A-Za-z]?)/i);
        if(m) {
            let kNorm = 'Kelas ' + m[1];
            if(!kelasUnik.includes(kNorm)) kelasUnik.push(kNorm);

        const def4 = "Sudah mencapai tujuan pembelajaran.";
        const def5 = "Sudah mencapai tujuan pembelajaran, perlu tantangan lebih (pengayaan).";

        selectedMapels.forEach((mapel, mIndex) => {

                // Simpan data baris untuk fitur Generate Deskripsi KKTP via AI

                        <p style="font-size: 14px; font-weight: bold; text-transform: uppercase; margin: 2px 0;">KELAS ${kelas.replace('Kelas ', '')}</p>
                        <p style="font-size: 14px; font-weight: bold; text-transform: uppercase; margin: 2px 0;">TAHUN AJARAN ${tahun}</p>
                    </div>
                    <table style="width: 100%; border-collapse: collapse; font-size: 11px; border: 1px solid black; margin-bottom: 20px;">
                        <thead>
                            <tr style="background-color: #3b82f6; color: white;">
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-weight: bold; width: 3%;">No</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-weight: bold; width: 27%;">Alur Tujuan Pembelajaran</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-weight: bold; width: 15%;">Materi</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-weight: bold; width: 11%;">0-20<br>(Belum Tuntas)<br>Intervensi penuh</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-weight: bold; width: 11%;">21-40<br>(Belum Tuntas)<br>Remedial Sebagian Besar</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-weight: bold; width: 11%;">41-60<br>(Hampir Tuntas)<br>Remedial pada kriteria yang diperlukan</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-weight: bold; width: 11%; background: linear-gradient(to bottom right, #15803d, #16a34a);">61-80<br>(Tuntas)</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-weight: bold; width: 11%;">81-100<br>(Sangat Tuntas)</th>
                            </tr>
                        </thead>
                        <tbody style="color: black;">${trHtml}</tbody>
                    </table>
                    ${window.getTandaTangan()}
                </div>
                ${pageBreak}
            `;
        });

        if(combinedHtml === '') {
            document.getElementById('loadingOverlay').classList.add('hidden');
            customAlert("Data Kurikulum untuk Kelas/Mapel yang dipilih tidak ditemukan.", "warning");
            return;
        }

        document.getElementById('kktpArea').innerHTML = `
            <div class="mb-4 flex flex-wrap gap-2 justify-end no-print">

                <button id="btnGenDeskripsiKKTP" onclick="window.generateDeskripsiKKTPWithAI()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg shadow font-bold text-sm flex items-center"><i class="fas fa-robot mr-2"></i> Generate Deskripsi KKTP (AI)</button>

window.generateDeskripsiKKTPNormal = function() {
    const rows = window._kktpRowsData || [];
    if (rows.length === 0) {
        customAlert('Tidak ada data baris KKTP. Buat tabel KKTP terlebih dahulu.', 'warning');
        return;
    }

    rows.forEach(function(row) {
        // Gunakan materi jika ada, fallback ke penggalan ATP
        const topik = row.materi && row.materi.trim()
            ? row.materi.trim()
            : row.atp.replace(/^\d+[\.\)]\s*/, '').substring(0, 80);

        const desc = [
            'Peserta didik belum mampu memahami ' + topik + '. Tindak lanjut: guru memberikan intervensi penuh dengan mengulang seluruh materi menggunakan pendekatan yang berbeda dan lebih sederhana.',
            'Peserta didik sudah mengenal sebagian kecil konsep ' + topik + ' namun masih banyak yang belum dipahami. Tindak lanjut: remedial sebagian besar materi, guru memfokuskan kembali pada pemahaman konsep dasar.',
            'Peserta didik cukup memahami ' + topik + ' namun belum sepenuhnya menguasai semua indikator. Tindak lanjut: remedial terbatas pada indikator atau kriteria tertentu yang masih kurang.',
            'Peserta didik sudah memahami ' + topik + ' dengan baik dan mencapai tujuan pembelajaran. Tindak lanjut: tidak perlu remedial, dapat melanjutkan ke materi berikutnya.',
            'Peserta didik menguasai ' + topik + ' dengan sangat baik melebihi capaian yang diharapkan. Tindak lanjut: diberikan pengayaan/enrichment atau dapat berperan sebagai tutor sebaya.'
        ];

        for (let col = 1; col <= 5; col++) {
            const cell = document.getElementById('kktp-cell-' + row.rowIdx + '-' + col);
            if (cell) cell.innerHTML = desc[col - 1];
        }
    });

    customAlert('Deskripsi KKTP berhasil diisi untuk ' + rows.length + ' baris ATP.', 'success');
};

window.generateDeskripsiKKTPWithAI = async function() {
    const aiCfg = window.getAIConfig();
    if (!aiCfg || !aiCfg.apiKey) {
        customAlert('API Key AI belum diatur. Silakan atur di menu Pengaturan AI terlebih dahulu.', 'warning');
        return;
    }
    const rows = window._kktpRowsData || [];
    if (rows.length === 0) {
        customAlert('Tidak ada data baris KKTP. Buat tabel KKTP terlebih dahulu.', 'warning');
        return;
    }

    const btn = document.getElementById('btnGenDeskripsiKKTP');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Sedang Generate...'; }

    document.getElementById('loadingText').innerText = 'AI sedang membuat deskripsi KKTP...';
    document.getElementById('loadingOverlay').classList.remove('hidden');

    // Kelompokkan baris per mapel agar bisa dikirim dalam 1 prompt per mapel
    const mapelGroups = {};
    rows.forEach(function(r) {
        if (!mapelGroups[r.mapel]) mapelGroups[r.mapel] = [];
        mapelGroups[r.mapel].push(r);
    });

    const mapelList = Object.keys(mapelGroups);
    let totalBerhasil = 0;
    let totalGagal = 0;

    for (let mi = 0; mi < mapelList.length; mi++) {
        const mapel = mapelList[mi];
        const mapelRows = mapelGroups[mapel];
        const kelas = mapelRows[0].kelas || '';

        document.getElementById('loadingText').innerText =
            'AI: Deskripsi ' + mapel + ' (' + (mi + 1) + '/' + mapelList.length + ')...';

        // Susun prompt untuk satu mapel (semua ATP sekaligus)
        const rowsText = mapelRows.map(function(r, i) {
            return 'ATP ' + (i + 1) + ': ' + r.atp + '\nMateri ' + (i + 1) + ': ' + (r.materi || '-');
        }).join('\n\n');

        const prompt = `Kamu adalah guru berpengalaman Kurikulum Merdeka SD/MI Indonesia.
Tugas: Buat deskripsi KKTP (Kriteria Ketercapaian Tujuan Pembelajaran) yang SPESIFIK sesuai materi untuk mata pelajaran "${mapel}" ${kelas}.

Untuk setiap ATP+Materi di bawah, buat deskripsi 5 rentang nilai yang mencerminkan KONTEN MATERI secara konkret (bukan deskripsi generik).
Sertakan tindak lanjut di akhir setiap deskripsi.

${rowsText}

Format respons: HANYA JSON array murni (tanpa markdown, tanpa backtick, tanpa teks lain).
Jumlah elemen array: tepat ${mapelRows.length}.
Struktur tiap elemen:
{
  "int1": "[Deskripsi spesifik kemampuan siswa terkait materi, tanpa label rentang nilai]. Tindak lanjut: guru memberikan intervensi penuh, mengulang seluruh materi dari awal dengan pendekatan berbeda.",
  "int2": "[Deskripsi spesifik kemampuan siswa terkait materi, tanpa label rentang nilai]. Tindak lanjut: remedial sebagian besar materi, fokus pada konsep dasar yang belum dipahami.",
  "int3": "[Deskripsi spesifik kemampuan siswa terkait materi, tanpa label rentang nilai]. Tindak lanjut: remedial hanya pada kriteria/indikator tertentu yang belum dikuasai.",
  "int4": "[Deskripsi spesifik kemampuan siswa terkait materi, tanpa label rentang nilai]. Tindak lanjut: tidak perlu remedial, dapat melanjutkan ke materi berikutnya.",
  "int5": "[Deskripsi spesifik kemampuan siswa terkait materi, tanpa label rentang nilai]. Tindak lanjut: pengayaan/enrichment, dapat menjadi tutor sebaya atau mengerjakan soal pengayaan tingkat lebih tinggi."
}`;

        try {
            const rawText = await _callAIProviderSoal(prompt, aiCfg);
            let parsed;
            try {
                const clean = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
                parsed = JSON.parse(clean);
            } catch(parseErr) {
                console.warn('[KKTP AI] Gagal parse JSON untuk mapel:', mapel, rawText.substring(0, 300));
                totalGagal += mapelRows.length;
                continue;
            }

            if (!Array.isArray(parsed)) {
                console.warn('[KKTP AI] Respons bukan array untuk mapel:', mapel);
                totalGagal += mapelRows.length;
                continue;
            }

            // Update sel di DOM
            mapelRows.forEach(function(row, i) {
                const desc = parsed[i];
                if (!desc) return;
                for (let col = 1; col <= 5; col++) {
                    const cell = document.getElementById('kktp-cell-' + row.rowIdx + '-' + col);
                    if (cell && desc['int' + col]) {
                        cell.innerHTML = desc['int' + col];
                    }
                }
                totalBerhasil++;
            });

        } catch(err) {
            console.error('[KKTP AI] Error untuk mapel:', mapel, err);
            totalGagal += mapelRows.length;
        }
    }

    document.getElementById('loadingOverlay').classList.add('hidden');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-robot mr-2"></i> Generate Deskripsi KKTP (AI)'; }

    if (totalBerhasil > 0) {
        customAlert('Berhasil membuat deskripsi KKTP untuk ' + totalBerhasil + ' baris ATP!' + (totalGagal > 0 ? ' (' + totalGagal + ' baris gagal, lihat konsol)' : ''), 'success');
    } else {
        customAlert('Gagal membuat deskripsi KKTP. Periksa koneksi dan konfigurasi AI.', 'error');
    }
};

window.cetakRekapAbsenSemester = async function() {
	await window.ensureHtml2pdf();
    const students = getMyStudents();
    const absen = filterBySchool(getDB('mc_absen'));
    let trHtml = '';

    // 1. Kalkulasi data absen tiap siswa untuk Semester 1 & 2
    students.forEach((s, index) => {
        let count = { smt1: {h:0, s:0, i:0, t:0}, smt2: {h:0, s:0, i:0, t:0} };
        absen.filter(a => a.studentId == s.id).forEach(a => {
            // Semester 1 = Juli - Desember (Bulan ke 6 - 11 di JavaScript)
            let d = new Date(a.tanggal);
            let isSmt1 = d.getMonth() >= 6; 
            let tgt = isSmt1 ? count.smt1 : count.smt2;
            
            if(a.status === 'Hadir') tgt.h++;
            else if(a.status === 'Sakit') tgt.s++;
            else if(a.status === 'Izin') tgt.i++;
            else tgt.t++;
        });

        trHtml += `
            <tr style="border: 1px solid black;">
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${index + 1}</td>
                <td style="border: 1px solid black; padding: 6px;">${s.nama}</td>
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${count.smt1.h}</td>
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${count.smt1.s}</td>
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${count.smt1.i}</td>
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${count.smt1.t}</td>
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${count.smt2.h}</td>
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${count.smt2.s}</td>
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${count.smt2.i}</td>
                <td style="border: 1px solid black; padding: 6px; text-align: center;">${count.smt2.t}</td>
            </tr>`;
    });

    // 2. Buat elemen HTML sementara untuk dirender ke PDF
    const printAreaId = 'printAreaRekapAbsenSmt';
    let printDiv = document.getElementById(printAreaId);
    if (!printDiv) {
        printDiv = document.createElement('div');
        printDiv.id = printAreaId;
        document.body.appendChild(printDiv);

// --- Blangko Absen (blangko kehadiran kosong per bulan, kolom tanggal dinamis) ---
// Helper: tentukan warna tipis kolom tanggal Blangko Absen berdasarkan data Tanggal Libur (Kaldik)
// dan toggle 5 hari/6 hari sekolah. Dipakai bersama oleh preview (layar) & cetak PDF.
window._getBlangkoDayColor = function(tahun, bulan, day, maps, hariSekolah) {
    const dateObj = new Date(parseInt(tahun), parseInt(bulan), day);
    const dow = dateObj.getDay(); // 0 = Minggu, 6 = Sabtu
    const key = tahun + '-' + String(parseInt(bulan) + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    if (maps.nasional[key]) return { bg: 'rgba(239,68,68,0.25)', title: 'Libur Nasional: ' + maps.nasional[key] };
    if (maps.kaldik[key]) return { bg: 'rgba(234,179,8,0.25)', title: 'Libur Kaldik: ' + maps.kaldik[key] };
    if (dow === 0) return { bg: 'rgba(34,197,94,0.35)', title: 'Hari Minggu' };
    if (hariSekolah === '5' && dow === 6) return { bg: 'rgba(34,197,94,0.35)', title: 'Hari Sabtu Libur (5 Hari Sekolah)' };
    return { bg: '', title: '' };
};

// Helper: hitung Tahun Ajaran otomatis dari bulan & tahun terpilih (Semester 1: Jul-Des, Semester 2: Jan-Jun)
window._getTahunAjaranFromBulanTahun = function(bulan, tahun) {
    const b = parseInt(bulan); const t = parseInt(tahun);
    return (b >= 6) ? (t + '/' + (t + 1)) : ((t - 1) + '/' + t);
};
