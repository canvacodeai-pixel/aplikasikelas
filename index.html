// GENERATE: masterkurikulumbaru → mc_kurikulum
// Parse "Kelas X" dari alurtujuanpembelajaran, simpan ke localStorage mc_kurikulum
// Kolom sheet masterkurikulumbaru yang dipakai:
//   Fase, Matapelajaran, elemen, capaianpembelajaran, tujuanpembelajaran,
//   alurtujuanpembelajaran, materi (kolom baru → MateriPokok di mc_kurikulum)
// =========================================================================
window.generateToMcKurikulum = function() {
    let fase = document.getElementById('tpFase') ? document.getElementById('tpFase').value : '';
    if(!fase) { customAlert('Pilih Fase terlebih dahulu!', 'warning'); return; }

    // Kumpulkan pilihan semester per kelas dari UI
    let semesterMap = {};
    document.querySelectorAll('.sem-kelas-input').forEach(el => {
        semesterMap[el.dataset.kelas] = el.value || 'Semester I';
    });
    if(Object.keys(semesterMap).length === 0) {
        customAlert('Data kelas tidak ditemukan. Pastikan kolom ATP di spreadsheet diawali "Kelas 1", "Kelas 2", dst.', 'warning');
        return;
    }

    let db = getDB('mc_masterkurikulumbaru').filter(item => item.Fase === fase);
    if(db.length === 0) { customAlert('Data kosong untuk fase ini!', 'warning'); return; }

    let newRows = [];
    let idCounter = Date.now();
    // Fix: carry-forward — baris header "Kelas X" (tanpa TP) tetap mengupdate
    // lastKelas2 sehingga TP berikutnya tanpa label kelas di ATP-nya tetap benar.
    let lastKelas2 = '';
    // Carry-forward ATP (kolom G): sel merged di spreadsheet membuat baris lanjutan
    // ber-ATP kosong → baris tsb mewarisi ATP baris sebelumnya dalam mapel yang sama.
    let lastAtp2 = '';
    let lastMapel2 = '';

    db.forEach(item => {
        let mapel    = String(item.Matapelajaran || '').trim();
        let elemen   = String(item.elemen || '').trim();
        let tp       = String(item.tujuanpembelajaran || '').trim();
        // 'materi' = kolom baru di sheet masterkurikulumbaru → MateriPokok mc_kurikulum
        // fallback ke elemen jika kolom materi belum diisi
        let materi   = String(item.materi || elemen).trim();
        let atpRaw   = String(item.alurtujuanpembelajaran || '');
        // Bersihkan label "Kelas X" di awal teks ATP (label kelas sudah jadi field tersendiri)
        let atpClean2 = atpRaw.replace(/^\s*Kelas\s+\d+[A-Za-z]?\s*[:.\-]?\s*/i, '').trim();
        // Ganti mapel → reset ATP agar tidak mewarisi ATP mapel sebelumnya
        if(mapel && mapel !== lastMapel2) { lastMapel2 = mapel; lastAtp2 = ''; }
        if(atpClean2) { lastAtp2 = atpClean2; }
        else if(/Kelas\s+\d+/i.test(atpRaw)) { lastAtp2 = ''; } // baris header "Kelas X" baru → reset

        // Ekstraksi kelas HARUS dilakukan sebelum return agar baris header
        // "Kelas X" (yang tidak punya TP) tetap mengupdate carry-forward.
        var _firstKelasMatch2 = atpRaw.match(/Kelas\s+(\d+)/i);
        if(_firstKelasMatch2) lastKelas2 = 'Kelas ' + _firstKelasMatch2[1];

        if(!mapel || !tp) return; // skip baris kosong

        let kelasList = lastKelas2 ? [lastKelas2] : [];

        if(kelasList.length === 0) {
            // Tidak ada info kelas di ATP — tidak di-generate
            return;
        }

        kelasList.forEach(kelas => {
            let semester = semesterMap[kelas] || 'Semester I';
            newRows.push({
                id: idCounter++,
                Kelas: kelas,
                MataPelajaran: mapel,
                Semester: semester,
                Bab: elemen,
                MateriPokok: materi,
                Materi: materi,
                TujuanPembelajaran: tp,
                ATP: lastAtp2
            });
        });
    });

    if(newRows.length === 0) {
        customAlert('Tidak ada data yang bisa di-generate. Periksa format kolom ATP di spreadsheet.', 'warning');
        return;
    }

    // Gabung dengan mc_kurikulum yang sudah ada:
    // Hapus record lama yang kombinasi (Kelas + MataPelajaran)-nya sama dengan yang baru di-generate
    let kelasBaru  = [...new Set(newRows.map(r => r.Kelas))];
    let mapelBaru  = [...new Set(newRows.map(r => r.MataPelajaran))];
    let existing   = getDB('mc_kurikulum').filter(k =>
        !(kelasBaru.includes(k.Kelas) && mapelBaru.includes(k.MataPelajaran))
    );
    let finalDB = [...existing, ...newRows];
    saveDB('mc_kurikulum', finalDB);

    // Kumpulkan update semester per-baris untuk dikirim ke spreadsheet
    // Fix: filter hanya mapel yang dicentang user (bukan semua mapel di fase)
    let selectedMapelsForSync = Array.from(document.querySelectorAll('.cb-mapel-tpatp:checked')).map(cb => cb.value);
    let dbToSync = (selectedMapelsForSync.length > 0)
        ? db.filter(function(item){ return selectedMapelsForSync.includes(String(item.Matapelajaran || '').trim()); })
        : db;
    // Fix: carry-forward lastKelas — baris tanpa "Kelas X" di ATP tetap dapat semester dari kelas sebelumnya
    let semUpdates = [];
    let lastKelasForSem = '';
    dbToSync.forEach(function(item) {
        if(!item.id && item.id !== 0) return;
        let atpRaw = String(item.alurtujuanpembelajaran || '');
        let kelasMatch = atpRaw.match(/Kelas\s+(\d+)/i);
        if(kelasMatch) lastKelasForSem = 'Kelas ' + kelasMatch[1];
        let semester = semesterMap[lastKelasForSem] || '';
        if(semester) semUpdates.push({ id: item.id, semester: semester });
    });
    if(semUpdates.length > 0) {
        syncToSheet('update_semester_masterkurikulum', semUpdates);
    }

    customAlert(
        `✅ Berhasil! <b>${newRows.length} baris</b> disimpan ke Database Kurikulum & Spreadsheet.<br>
        <span class="text-xs text-gray-600">Kelas: ${kelasBaru.join(', ')} | Mapel: ${mapelBaru.length} mata pelajaran</span>`,
        'success'
    );
};

window.generateTabelTPATP = function() {
    let tahun = document.getElementById('tpTahun').value; 
    let fase = document.getElementById('tpFase').value; 
    let selectedMapels = Array.from(document.querySelectorAll('.cb-mapel-tpatp:checked')).map(cb => cb.value);
    let mode = (document.getElementById('tpMode') || {}).value || 'fase';

    if(!tahun || !fase || selectedMapels.length === 0) { customAlert("Harap lengkapi filter dan centang minimal 1 Mapel!", "warning"); return; }

    // Mode Kelas: gunakan renderer khusus
    if(mode === 'kelas') {
        let kelas = (document.getElementById('tpKelas') || {}).value || '';
        if(!kelas) { customAlert("Pilih Kelas terlebih dahulu!", "warning"); return; }
        window._generateTPATPKelasMode(tahun, fase, kelas, selectedMapels);
        return;
    }
    
    document.getElementById('loadingText').innerText = "Menyusun Dokumen TP & ATP..."; 
    document.getElementById('loadingOverlay').classList.remove('hidden');

    let protaMode = !!(document.getElementById('tpProtaToggle') && document.getElementById('tpProtaToggle').checked);

    // Prefill Alokasi Waktu dari mc_prota (Prota → TP&ATP, jika toggle ON)
    let tahunTp = (document.getElementById('tpTahun') ? document.getElementById('tpTahun').value : '').trim();
    let protaAlokasiMap = {};
    if (protaMode) {
        getDB('mc_prota').forEach(function(p) {
            if (!tahunTp || p.tahun === tahunTp) {
                let key = String(p.mapel||'').trim() + '|||' + String(p.tp||'').trim();
                if (!protaAlokasiMap[key] && (p.alokasi||'').trim()) protaAlokasiMap[key] = (p.alokasi||'').trim();
            }
        });
    }

    let tpAtpFull = getDB('mc_masterkurikulumbaru');
    let combinedHtml = '';

    selectedMapels.forEach((mapel, mIndex) => {
        let dataFiltered = tpAtpFull.filter(k => k.Fase === fase && k.Matapelajaran === mapel);
        if(dataFiltered.length === 0) return;
        
        dataFiltered.sort((a, b) => {
            let faseComp = String(a.Fase||'').localeCompare(String(b.Fase||''));
            if(faseComp !== 0) return faseComp;
            let mapelComp = String(a.Matapelajaran||'').localeCompare(String(b.Matapelajaran||''));
            if(mapelComp !== 0) return mapelComp;
            return Number(a.id||0) - Number(b.id||0);
        });

        // Kelompokkan per elemen untuk rowspan — CONSECUTIVE-RUN grouping.
        // Carry-forward: handle merged cell dari spreadsheet (baris ke-2 dst. kosong).
        // PENTING: Jika elemen yang sama muncul KEMBALI setelah diselingi elemen lain
        // (mis. "Negara Kesatuan" → "Pancasila" → "Negara Kesatuan" lagi), kita buat
        // grup BARU untuk kemunculan kedua itu — TIDAK digabung ke grup pertama.
        // Ini memastikan urutan elemenOrder = urutan asli spreadsheet, sehingga ATP
        // yang berurutan tidak "loncat" karena grup elemen yang tergabung salah posisi.
        let elemenGroups = {};
        let elemenOrder = [];
        let elemenCP = {};
        let elemenDisplayName = {}; // uniqueKey → nama tampil (tanpa suffix __N)
        let lastElemen = '-';
        let lastCP = '';
        let currentGroupKey = null;
        dataFiltered.forEach(item => {
            let elemen = String(item.elemen || '').trim();
            if(elemen) lastElemen = elemen; else elemen = lastElemen;
            let cp = String(item.capaianpembelajaran || '').trim();
            if(cp) lastCP = cp; else cp = lastCP;
            // Cek apakah baris ini masih bagian dari grup aktif
            if(currentGroupKey !== null && elemenDisplayName[currentGroupKey] === elemen) {
                // Masih elemen yang sama secara berurutan → tambahkan ke grup aktif
                elemenGroups[currentGroupKey].push(item);
                if(!elemenCP[currentGroupKey] && cp) elemenCP[currentGroupKey] = cp;
            } else {
                // Elemen berbeda, atau elemen yang sama tapi sudah diselingi elemen lain
                // → buat grup baru dengan unique key (tambah suffix jika nama sudah ada)
                let uniqueKey = elemen;
                let counter = 2;
                while(elemenGroups[uniqueKey] !== undefined) { uniqueKey = elemen + '__' + counter; counter++; }
                currentGroupKey = uniqueKey;
                elemenGroups[uniqueKey] = [item];
                elemenOrder.push(uniqueKey);
                elemenCP[uniqueKey] = cp;
                elemenDisplayName[uniqueKey] = elemen;
            }
        });

        // Format teks ATP: "Kelas X Teks..." → "<b>Kelas X</b><br>Teks..."
        function formatATP(raw) {
            if(!raw) return '-';
            let text = String(raw);
            // Bold penanda "Kelas X" dan pindah ke baris baru
            text = text.replace(/(Kelas\s+\d+[A-Za-z]?)\s+/g, '<b>$1</b><br>');
            // Hilangkan nomor urut ("1. ", "2. ", dst.) di awal teks / setelah marker Kelas X —
            // data ATP di database sudah punya poin/nomor sendiri, tidak perlu ditambahkan lagi.
            text = text.replace(/(<br>)\s*\d+\.\s*/g, '$1');
            text = text.replace(/^\s*\d+\.\s*/, '');
            return text;
        }

        let trHtml = '';
        let visibleElemenCounter = 0;
        let globalRowIdx = 0; // counter global yang terus naik melewati batas elemen
        elemenOrder.forEach((elemenKey) => {
            let rows = elemenGroups[elemenKey];
            let displayElemen = elemenDisplayName[elemenKey] || elemenKey; // nama tampil tanpa suffix
            visibleElemenCounter++;
            let elemenNo = visibleElemenCounter;
            let rowCount = rows.length;
            let cpText = elemenCP[elemenKey] || '-';

            // atpSkip: tandai baris dengan ATP kosong sebagai lanjutan (tetap dipakai untuk konten)
            let atpSkip = new Array(rowCount).fill(false);
            for (let i = 0; i < rowCount; i++) {
                let hasAtp = String(rows[i].alurtujuanpembelajaran || '').trim() !== '';
                if (hasAtp) {
                    let j = i + 1;
                    while (j < rowCount && String(rows[j].alurtujuanpembelajaran || '').trim() === '') {
                        atpSkip[j] = true; j++;
                    }
                }
            }

            rows.forEach((item, idx) => {
                let tdNo = '';
                let tdElemen = '';
                let tdCP = '';
                if(idx === 0) {
                    tdNo = `<td rowspan="${rowCount}" style="border:1px solid black;padding:8px;text-align:center;vertical-align:top;">${elemenNo}</td>`;
                    tdElemen = `<td rowspan="${rowCount}" style="border:1px solid black;padding:8px;vertical-align:top;font-weight:bold;background:#f9fafb;">${displayElemen}</td>`;
                    tdCP = `<td rowspan="${rowCount}" style="border:1px solid black;padding:8px;vertical-align:top;font-size:12px;">${cpText}</td>`;
                }
                // ATP, Materi & Keterangan: border penuh per baris (konsisten dengan kolom lain)
                let atpIsGroup = atpSkip[idx];
                let fullBorder = 'border:1px solid black;';
                let tdAtp = `<td style="${fullBorder}padding:8px;vertical-align:top;font-size:12px;">${atpIsGroup ? '' : formatATP(item.alurtujuanpembelajaran)}</td>`;
                let materiVal = (item.materi || item.elemen || '').replace(/"/g, '&quot;');
                let tdMateri = `<td style="${fullBorder}padding:8px;vertical-align:top;font-size:12px;">${atpIsGroup ? '' : (materiVal || '-')}</td>`;

                let ketVal = (item.Keterangan || '').trim();
                let ketBg = ketVal ? '#fffde7' : 'white';
                let ketCellHtml;
                if (protaMode) {
                    ketCellHtml = `<textarea data-ket="1" data-rowid="${item.id}" placeholder="Isi keterangan..." rows="2" oninput="this.style.background=this.value?'#fffde7':'white';this.style.height='auto';this.style.height=this.scrollHeight+'px';" style="width:100%;border:1px solid #d1d5db;border-radius:4px;padding:4px;font-size:12px;background:${ketBg};outline:none;resize:none;overflow:hidden;line-height:1.4;">${ketVal.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>`;
                } else {
                    ketCellHtml = `<select data-ket="1" data-rowid="${item.id}" onchange="this.style.background=this.value?'#fffde7':'white'" style="width:100%;border:1px solid #d1d5db;border-radius:4px;padding:3px;font-size:12px;background:${ketBg};cursor:pointer;">
                        <option value=""${ketVal ? '' : ' selected'}>-</option>
                        <option value="Semester I"${ketVal === 'Semester I' ? ' selected' : ''}>Semester I</option>
                        <option value="Semester II"${ketVal === 'Semester II' ? ' selected' : ''}>Semester II</option>
                    </select>`;
                }
                let tdAlokasi = protaMode ? (function(){
                    let pKey = String(item.Matapelajaran||'').trim() + '|||' + String(item.tujuanpembelajaran||'').trim();
                    let awPrefill = (protaAlokasiMap[pKey] || '').replace(/"/g,'&quot;');
                    return `<td style="${fullBorder}padding:6px;vertical-align:top;font-size:12px;min-width:80px;"><input type="text" data-aw="1" data-rowid="${item.id}" value="${awPrefill}" placeholder="cth: 12 JP" style="width:100%;border:1px solid #d1d5db;border-radius:4px;padding:3px;font-size:12px;outline:none;background:${awPrefill?'#e8f5e9':'white'};"></td>`;
                })() : '';
                trHtml += `<tr style="page-break-inside:avoid;">
                    ${tdNo}
                    ${tdElemen}
                    ${tdCP}
                    <td style="border:1px solid black;padding:8px;vertical-align:top;font-size:12px;">${item.tujuanpembelajaran || '-'}</td>
                    ${tdMateri}
                    ${tdAtp}
                    ${tdAlokasi}
                    <td style="${fullBorder}padding:6px;vertical-align:top;font-size:12px;min-width:90px;">${ketCellHtml}</td>
                </tr>`;
                globalRowIdx++; // naikkan setiap baris selesai diproses
            });
        });

        let pageBreak = (mIndex < selectedMapels.length - 1) ? '<div style="page-break-after:always;margin-bottom:40px;"></div>' : '';

        combinedHtml += `
            <div class="mapel-section mb-10">
                <span class="mapel-title-hidden hidden">${mapel}</span>
                ${window.getKopSurat()}
                <div style="text-align:center;margin-bottom:24px;">
                    <h2 style="font-size:16px;font-weight:bold;text-transform:uppercase;margin:0 0 10px 0;">TUJUAN PEMBELAJARAN DAN ALUR TUJUAN PEMBELAJARAN</h2>
                    <p style="font-size:14px;font-weight:bold;text-transform:uppercase;margin:5px 0;">MATA PELAJARAN: ${mapel}</p>
                    <p style="font-size:14px;font-weight:bold;text-transform:uppercase;margin:5px 0;">FASE ${fase}</p>
                    <p style="font-size:14px;font-weight:bold;text-transform:uppercase;margin:5px 0;">TAHUN AJARAN ${tahun}</p>
                </div>
                <table style="width:100%;border-collapse:collapse;font-size:13px;border:1px solid black;margin-bottom:20px;">
                    <thead>
                        <tr style="background-color:#f3f4f6;">
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:4%;">Nomor</th>
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:11%;">Elemen</th>

                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:20%;">Tujuan Pembelajaran</th>
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:13%;">Materi Esensial</th>
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:${protaMode ? '18%' : '22%'};">Alur Tujuan Pembelajaran</th>
                            ${protaMode ? '<th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:9%;">Alokasi Waktu</th>' : ''}
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:${protaMode ? '5%' : '10%'};">Keterangan</th>

            <button onclick="window.exportTPATP('excel')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow font-bold text-sm flex items-center"><i class="fas fa-file-excel mr-2"></i> Excel (Multi-Sheet)</button>
            <button onclick="window.exportTPATP('word')"  class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow font-bold text-sm flex items-center"><i class="fas fa-file-word mr-2"></i> Word</button>
            <button onclick="window.exportTPATP('pdf')"   class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg shadow font-bold text-sm flex items-center"><i class="fas fa-file-pdf mr-2"></i> PDF</button>
        </div>
        <p class="text-xs no-print ${protaMode ? 'text-purple-700 bg-purple-50 border border-purple-200' : 'text-amber-700 bg-amber-50 border border-amber-200'} rounded px-3 py-2 mb-3">
            ${protaMode
                ? '<i class="fas fa-calendar-alt mr-1"></i> Mode <b>Prota</b> aktif — Kolom <b>Alokasi Waktu</b> dan <b>Keterangan</b> (teks bebas) tersedia. Isi lalu unduh.'
                : '<i class="fas fa-list mr-1"></i> Kolom <b>Keterangan</b> pilih langsung Semester I / Semester II dari dropdown sebelum diunduh.'}
        </p>
        <div id="printTPATPArea" class="p-4 bg-white" style="font-family:'Times New Roman',Times,serif;color:black;line-height:1.5;width:100%;max-width:1000px;margin:0 auto;">
            ${combinedHtml}
        </div>
    `;

    // Helper: select/input Keterangan sudah otomatis diserialisasi jadi teks oleh
    // exportToWord/downloadPDF/exportMultiTableToExcel — tidak perlu strip manual lagi.
    window._tpAtpFase = fase;
    window.exportTPATP = function(type) {
        var faseLabel = window._tpAtpFase || '';
        if(type === 'excel')      window.exportMultiTableToExcel('printTPATPArea', 'TP_ATP_Gabungan_Fase' + faseLabel, 'tpatp');
        else if(type === 'word')  window.exportToWord('printTPATPArea', 'TP_ATP_Gabungan_Fase' + faseLabel, null, 'tpatp');
        else if(type === 'pdf')   downloadPDF('printTPATPArea', 'TP_ATP_Gabungan_Fase' + faseLabel + '.pdf', null, 'tpatp');
    };

    document.getElementById('tpAtpArea').classList.remove('hidden'); 
    document.getElementById('loadingOverlay').classList.add('hidden');
}

// =========================================================================
// MODE KELAS: Render tabel TP-ATP per Kelas
// Algoritma:
//   Kolom Elemen, CP, TP → rowspan normal, hanya TP milik kelas ini
//   Kolom ATP → 1 rowspan besar mencakup semua baris, isi = list bernomor
//               urut sequence kelas yang dipilih (independen dari posisi TP)
// =========================================================================
window._generateTPATPKelasMode = function(tahun, fase, kelas, selectedMapels) {
    document.getElementById('loadingText').innerText = 'Menyusun Dokumen TP & ATP (Mode Kelas)...';
    document.getElementById('loadingOverlay').classList.remove('hidden');

    let protaModeK = !!(document.getElementById('tpProtaToggle') && document.getElementById('tpProtaToggle').checked);

    // Prefill Alokasi Waktu dari mc_prota (Prota → TP&ATP, jika toggle ON)
    let protaAlokasiMapK = {};
    if (protaModeK) {
        getDB('mc_prota').forEach(function(p) {
            if ((!tahun || p.tahun === tahun) && p.kelas === kelas) {
                let key = String(p.mapel||'').trim() + '|||' + String(p.tp||'').trim();
                if (!protaAlokasiMapK[key] && (p.alokasi||'').trim()) protaAlokasiMapK[key] = (p.alokasi||'').trim();
            }
        });
        // Fallback: tanpa filter kelas jika tidak ada hasil
        if (Object.keys(protaAlokasiMapK).length === 0) {
            getDB('mc_prota').forEach(function(p) {
                if (!tahun || p.tahun === tahun) {
                    let key = String(p.mapel||'').trim() + '|||' + String(p.tp||'').trim();
                    if (!protaAlokasiMapK[key] && (p.alokasi||'').trim()) protaAlokasiMapK[key] = (p.alokasi||'').trim();
                }
            });
        }
    }

    let tpAtpFull = getDB('mc_masterkurikulumbaru');
    let combinedHtml = '';

    selectedMapels.forEach(function(mapel, mIndex) {
        let dataFiltered = tpAtpFull.filter(function(k){ return k.Fase === fase && k.Matapelajaran === mapel; });
        if(dataFiltered.length === 0) return;

        dataFiltered.sort(function(a,b){
            let fa = String(a.Fase||'').localeCompare(String(b.Fase||''));
            if(fa !== 0) return fa;
            let ma = String(a.Matapelajaran||'').localeCompare(String(b.Matapelajaran||''));
            if(ma !== 0) return ma;
            return Number(a.id||0) - Number(b.id||0);
        });

        // --- Lookup mc_kurikulum: sumber kebenaran keanggotaan kelas per TP ---
        // Carry-forward "Kelas X" dari ATP field tidak bisa diandalkan karena
        // elemen seperti "Berbicara" / "Menulis" bisa tidak punya marker eksplisit.
        // mc_kurikulum sudah punya field Kelas yang di-set saat sync/generate.
        let mcKurikulumAll = getDB('mc_kurikulum');
        // Cocokkan dengan MataPelajaran (mc_kurikulum) vs Matapelajaran (masterkurikulumbaru)
        let mcRows = mcKurikulumAll.filter(function(k) {
            return String(k.Kelas || '').trim() === kelas &&
                   String(k.MataPelajaran || '').trim() === mapel;
        });
        // Index ATP per TP dari mc_kurikulum (ambil entry pertama jika duplikat)
        // Catatan: mc_kurikulum TIDAK lagi dipakai untuk menentukan keanggotaan kelas
        // (lihat itemKelasArr di bawah, posisional) — hanya sebagai sumber teks ATP.
        let atpByTP = {};
        mcRows.forEach(function(k) {
            let tpKey = String(k.TujuanPembelajaran || '').trim();
            if(tpKey && !atpByTP[tpKey]) atpByTP[tpKey] = String(k.ATP || '').trim();
        });

        // --- Pre-scan POSISIONAL: hitung kelas untuk SETIAP baris (bukan Set teks-TP) ---
        // ROOT CAUSE lama: baik tpInKelas (mc_kurikulum) maupun tpInKelasFromATP dicek dengan
        // Set.has(tp) — cocok berdasarkan TEKS TP saja. Jika teks TP yang identik dipakai ulang
        // di kelas 1 dan kelas 2 (lazim: TP generik beda nomor/redaksi mirip), baris kelas 2 ikut
        // ter-flag "milik kelas 1" karena string-nya memang ada di Set, walau Set tsb dibangun
        // dengan scoping carry-forward yang benar — pengecekan .has() tidak tahu baris mana asalnya.
        // FIX: hitung kelas per-baris (posisional) satu kali via carry-forward Keterangan/ATP,
        // lalu bandingkan langsung itemKelas[idx] === kelas. Tidak ada lagi pencocokan by-teks.
        let itemKelasArr = new Array(dataFiltered.length);
        let _lastKelasPos = '';
        dataFiltered.forEach(function(item, idx) {
            // Prioritas: field item.Kelas (GAS baru, per-baris) →
            //   item.Keterangan regex (GAS lama, "Kelas X" di kolom Keterangan) →
            //   ATP regex carry-forward (lama, pola "Kelas X" di teks ATP)
            let _itemKelasPos = String(item.Kelas || '').trim();
            if(_itemKelasPos) {
                _lastKelasPos = _itemKelasPos;
            } else {
                let atpRawPos = String(item.alurtujuanpembelajaran || '').trim();
                let _ketMatchPos = String(item.Keterangan || '').trim().match(/Kelas\s+(\d+)/i);
                let kmPos = _ketMatchPos || atpRawPos.match(/Kelas\s+(\d+)/i);
                if(kmPos) _lastKelasPos = 'Kelas ' + kmPos[1];
            }
            itemKelasArr[idx] = _lastKelasPos;
        });

        // --- PASS 2: Bangun elemenGroups dari SEMUA data (bukan hanya kelas ini) ---
        // Semua elemen tetap tampil; hanya kolom TP yang difilter per kelas.
        // FIX ROOT CAUSE: keanggotaan kelas ditentukan POSISIONAL (itemKelasArr), bukan Set teks-TP.
        // mc_kurikulum tetap dipakai sebagai sumber ATP text (atpByTP), tapi bukan lagi penentu
        // keanggotaan baris — supaya TP dengan teks identik di kelas berbeda tidak saling bocor.
        let elemenGroups = {};  // elemenKey → { cpText, tpItems: [{tp, materi}] }
        let elemenOrder  = [];
        let elemenDisplayName = {};
        let lastElemen   = '-';
        let lastCP       = '';
        let currentGK    = null;

        dataFiltered.forEach(function(item, idx) {
            let elemen = String(item.elemen || '').trim();
            if(elemen) lastElemen = elemen; else elemen = lastElemen;
            let cp = String(item.capaianpembelajaran || '').trim();
            if(cp) lastCP = cp; else cp = lastCP;
            let tp = String(item.tujuanpembelajaran || '').trim();
            let materi = String(item.materi || item.elemen || '').trim();
            let ket = String(item.Keterangan || '').trim();
            let rowId = item.id;
            // ATP baris ini: strip prefix "Kelas X" + nomor urut agar tidak dobel saat render,
            // sejajar langsung dengan baris TP/Materi (bukan lagi list gabungan terpisah).
            let atpRawRow = String(item.alurtujuanpembelajaran || '').trim();
            let atpCleanRow = atpRawRow.replace(/^\s*Kelas\s+\d+[A-Za-z]?\s*\d*[:.–\-]?\s*/i, '').trim();
            let atpTextRow = atpCleanRow.replace(/^\d+\.\s*/, '').trim();

            // Keanggotaan kelas: POSISIONAL — kelas baris ini (itemKelasArr[idx]) harus sama
            // dengan kelas yang sedang dipilih. Ini berlaku baik ada mc_kurikulum atau tidak,
            // dan tidak terpengaruh oleh duplikasi teks TP lintas kelas.
            let tpMilikKelas = (itemKelasArr[idx] === kelas) && tp !== '';

            // Consecutive-run grouping (sama seperti mode fase)
            if(currentGK !== null && elemenDisplayName[currentGK] === elemen) {
                if(!elemenGroups[currentGK].cpText && cp) elemenGroups[currentGK].cpText = cp;
                // Tambah TP hanya jika milik kelas yang dipilih
                if(tpMilikKelas) elemenGroups[currentGK].tpItems.push({ tp: tp, materi: materi, atp: atpTextRow, ket: ket, rowId: rowId });
            } else {
                let uniqueKey = elemen;
                let counter = 2;
                while(elemenGroups[uniqueKey] !== undefined) { uniqueKey = elemen + '__' + counter; counter++; }
                currentGK = uniqueKey;
                elemenDisplayName[uniqueKey] = elemen;
                elemenGroups[uniqueKey] = {
                    cpText: cp,
                    tpItems: tpMilikKelas ? [{ tp: tp, materi: materi, atp: atpTextRow, ket: ket, rowId: rowId }] : []
                };
                elemenOrder.push(uniqueKey);
            }
        });

        // --- Hitung total baris: hanya elemen yang punya TP di kelas ini ---
        // Elemen dengan 0 TP dikecualikan sepenuhnya (tidak tampil, tidak masuk rowspan ATP).
        let totalTPRows = 0;
        elemenOrder.forEach(function(k){
            if(elemenGroups[k].tpItems.length > 0) totalTPRows += elemenGroups[k].tpItems.length;
        });

        let trHtml = '';
        let visibleElemenCounter = 0;
        elemenOrder.forEach(function(elemenKey) {
            let tpItems   = elemenGroups[elemenKey].tpItems;
            let displayElemen = elemenDisplayName[elemenKey] || elemenKey;
            let cpText    = elemenGroups[elemenKey].cpText || '-';
            let rowCount  = tpItems.length;

            if(tpItems.length === 0) {
                // Elemen tidak punya TP di kelas ini → lewati sepenuhnya (tidak tampil di tabel)
                return;
            } else {
                // Increment nomor urut hanya untuk elemen yang benar-benar ditampilkan
                visibleElemenCounter++;
                let elemenNo = visibleElemenCounter;
                tpItems.forEach(function(tpObj, idx) {
                    let tdNo     = idx === 0 ? `<td rowspan="${rowCount}" style="border:1px solid black;padding:8px;text-align:center;vertical-align:top;">${elemenNo}</td>` : '';
                    let tdElemen = idx === 0 ? `<td rowspan="${rowCount}" style="border:1px solid black;padding:8px;vertical-align:top;font-weight:bold;background:#f9fafb;">${displayElemen}</td>` : '';
                    let tdCP     = idx === 0 ? `<td rowspan="${rowCount}" style="border:1px solid black;padding:8px;vertical-align:top;font-size:12px;">${cpText}</td>` : '';
                    let ketVal = (tpObj.ket || '').trim();
                    let ketBg = ketVal ? '#fffde7' : 'white';
                    let ketCellHtmlK;
                    if (protaModeK) {
                        ketCellHtmlK = `<textarea data-ket="1" data-rowid="${tpObj.rowId || ''}" placeholder="Isi keterangan..." rows="2" oninput="this.style.background=this.value?'#fffde7':'white';this.style.height='auto';this.style.height=this.scrollHeight+'px';" style="width:100%;border:1px solid #d1d5db;border-radius:4px;padding:4px;font-size:12px;background:${ketBg};outline:none;resize:none;overflow:hidden;line-height:1.4;">${ketVal.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>`;
                    } else {
                        ketCellHtmlK = `<select data-ket="1" data-rowid="${tpObj.rowId || ''}" onchange="this.style.background=this.value?'#fffde7':'white'" style="width:100%;border:1px solid #d1d5db;border-radius:4px;padding:3px;font-size:12px;background:${ketBg};cursor:pointer;">
                        <option value=""${ketVal ? '' : ' selected'}>-</option>
                        <option value="Semester I"${ketVal === 'Semester I' ? ' selected' : ''}>Semester I</option>
                        <option value="Semester II"${ketVal === 'Semester II' ? ' selected' : ''}>Semester II</option>
                    </select>`;
                    }
                    let tdAlokasiK = protaModeK ? (function(){
                        let pKeyK = String(mapel||'').trim() + '|||' + String(tpObj.tp||'').trim();
                        let awPrefillK = (protaAlokasiMapK[pKeyK] || '').replace(/"/g,'&quot;');
                        return `<td style="border:1px solid black;padding:6px;vertical-align:top;font-size:12px;min-width:80px;"><input type="text" data-aw="1" data-rowid="${tpObj.rowId || ''}" value="${awPrefillK}" placeholder="cth: 12 JP" style="width:100%;border:1px solid #d1d5db;border-radius:4px;padding:3px;font-size:12px;outline:none;background:${awPrefillK?'#e8f5e9':'white'};"></td>`;
                    })() : '';
                    trHtml += `<tr style="page-break-inside:avoid;">
                        ${tdNo}${tdElemen}${tdCP}
                        <td style="border:1px solid black;padding:8px;vertical-align:top;font-size:12px;">${tpObj.tp}</td>
                        <td style="border:1px solid black;padding:8px;vertical-align:top;font-size:12px;">${tpObj.materi || '-'}</td>
                        <td style="border:1px solid black;padding:8px;vertical-align:top;font-size:12px;">${tpObj.atp || '-'}</td>
                        ${tdAlokasiK}
                        <td style="border:1px solid black;padding:6px;vertical-align:top;font-size:12px;min-width:90px;">${ketCellHtmlK}</td>
                    </tr>`;
                });
            }
        });

        let pageBreak = (mIndex < selectedMapels.length - 1) ? '<div style="page-break-after:always;margin-bottom:40px;"></div>' : '';
        combinedHtml += `
            <div class="mapel-section mb-10">
                <span class="mapel-title-hidden hidden">${mapel}</span>
                ${window.getKopSurat()}
                <div style="text-align:center;margin-bottom:24px;">
                    <h2 style="font-size:16px;font-weight:bold;text-transform:uppercase;margin:0 0 10px 0;">TUJUAN PEMBELAJARAN DAN ALUR TUJUAN PEMBELAJARAN</h2>
                    <p style="font-size:14px;font-weight:bold;text-transform:uppercase;margin:5px 0;">MATA PELAJARAN: ${mapel}</p>
                    <p style="font-size:14px;font-weight:bold;text-transform:uppercase;margin:5px 0;">FASE ${fase} — ${kelas}</p>
                    <p style="font-size:14px;font-weight:bold;text-transform:uppercase;margin:5px 0;">TAHUN AJARAN ${tahun}</p>
                </div>
                <table style="width:100%;border-collapse:collapse;font-size:13px;border:1px solid black;margin-bottom:20px;">
                    <thead>
                        <tr style="background-color:#f3f4f6;">
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:4%;">Nomor</th>
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:10%;">Elemen</th>
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:18%;">Capaian Pembelajaran</th>
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:18%;">Tujuan Pembelajaran</th>
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:14%;">Materi Esensial</th>
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:${protaModeK ? '14%' : '18%'};">Alur Tujuan Pembelajaran — ${kelas}</th>
                            ${protaModeK ? '<th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:9%;">Alokasi Waktu</th>' : ''}
                            <th style="border:1px solid black;padding:10px;text-align:center;font-weight:bold;width:${protaModeK ? '5%' : '14%'};">Keterangan</th>
                        </tr>
                    </thead>
                    <tbody>${trHtml}</tbody>
                </table>
                ${window.getTandaTangan()}
            </div>
            ${pageBreak}`;
    });

    let tpAtpArea = document.getElementById('tpAtpArea');
    tpAtpArea.classList.remove('hidden');
    tpAtpArea.innerHTML = `
        <div class="mb-4 flex flex-wrap gap-2 justify-end no-print">
            ${btnPengaturanCetak('tpatp', 'TP/ATP Gabungan')}
            <button onclick="window.simpanKeterangan()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg shadow font-bold text-sm flex items-center" title="Simpan isi kolom Keterangan ke spreadsheet (kolom J masterkurikulumbaru)"><i class="fas fa-save mr-2"></i> Simpan Keterangan</button>
            <button onclick="window.exportTPATP('excel')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow font-bold text-sm flex items-center"><i class="fas fa-file-excel mr-2"></i> Excel</button>
            <button onclick="window.exportTPATP('word')"  class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow font-bold text-sm flex items-center"><i class="fas fa-file-word mr-2"></i> Word</button>
            <button onclick="window.exportTPATP('pdf')"   class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg shadow font-bold text-sm flex items-center"><i class="fas fa-file-pdf mr-2"></i> PDF</button>
        </div>
        <p class="text-xs no-print ${protaModeK ? 'text-purple-700 bg-purple-50 border border-purple-200' : 'text-amber-700 bg-amber-50 border border-amber-200'} rounded px-3 py-2 mb-3">
            ${protaModeK
                ? '<i class="fas fa-calendar-alt mr-1"></i> Mode <b>Prota</b> aktif — Kolom <b>Alokasi Waktu</b> dan <b>Keterangan</b> (teks bebas) tersedia. Isi lalu unduh.'
                : '<i class="fas fa-list mr-1"></i> Kolom <b>Keterangan</b> pilih langsung Semester I / Semester II dari dropdown sebelum diunduh.'}
        </p>
        <div id="printTPATPArea" class="p-4 bg-white" style="font-family:'Times New Roman',Times,serif;color:black;line-height:1.5;width:100%;max-width:1000px;margin:0 auto;">
            ${combinedHtml}
        </div>`;

    window._tpAtpFase = fase;
    window.exportTPATP = function(type) {
        var faseLabel = (window._tpAtpFase || '') + '_' + kelas.replace(/\s+/g,'');
        if(type === 'excel')      window.exportMultiTableToExcel('printTPATPArea', 'TP_ATP_' + faseLabel, 'tpatp');
        else if(type === 'word')  window.exportToWord('printTPATPArea', 'TP_ATP_' + faseLabel, null, 'tpatp');
        else if(type === 'pdf')   downloadPDF('printTPATPArea', 'TP_ATP_' + faseLabel + '.pdf', null, 'tpatp');
    };

    document.getElementById('loadingOverlay').classList.add('hidden');
    tpAtpArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

// =========================================================================
// SIMPAN KETERANGAN → Spreadsheet kolom J (masterkurikulumbaru)
// Membaca nilai dropdown select[data-ket] (Semester I / Semester II) → kirim ke GAS via syncToSheet
// Sekaligus update lokal mc_masterkurikulumbaru agar Keterangan konsisten
// =========================================================================
window.simpanKeterangan = function() {
    var area = document.getElementById('printTPATPArea');
    if (!area) { customAlert('Generate tabel TP-ATP terlebih dahulu!', 'warning'); return; }

    var faseEl = document.getElementById('tpFase');
    var fase   = faseEl ? faseEl.value : '';
    if (!fase) { customAlert('Pilih Fase terlebih dahulu!', 'warning'); return; }

    // 1. Kumpulkan nilai Keterangan dari select (mode normal) atau input (mode prota)
    var cells = area.querySelectorAll('[data-ket][data-rowid]');
    var updates = [];
    cells.forEach(function(el) {
        var rowId = el.getAttribute('data-rowid');
        var ket   = (el.value || '').trim();
        if (rowId) updates.push({ id: rowId, keterangan: ket });
    });
    if (updates.length === 0) { customAlert('Tidak ada data Keterangan yang ditemukan.', 'warning'); return; }

    // 2. Update mc_masterkurikulumbaru lokal dengan nilai Keterangan terbaru
    var localDB = getDB('mc_masterkurikulumbaru');
    var ketMap  = {};
    updates.forEach(function(u) { ketMap[String(u.id)] = u.keterangan; });
    localDB.forEach(function(item) {
        var key = String(item.id);
        if (ketMap.hasOwnProperty(key)) item.Keterangan = ketMap[key];
    });
    saveDB('mc_masterkurikulumbaru', localDB);


    // 3. Build map { "mapel|||tp" → semester } dari baris fase ini
    var tpSemMap = {};
    localDB.filter(function(item){ return item.Fase === fase; }).forEach(function(item) {
        var tp    = String(item.tujuanpembelajaran || '').trim();
        var sem   = String(item.Keterangan || item.semester || '').trim();
        var mapel = String(item.Matapelajaran || '').trim();
        if (tp && sem && mapel) tpSemMap[mapel + '|||' + tp] = sem;
    });

    // 4. Generate newRows untuk mc_kurikulum (sama seperti simpanKeMcKurikulumOtomatis)
    var newRows    = [];
    var idCounter  = Date.now();
    // Fix: carry-forward — baris header "Kelas X" (tanpa TP) tetap mengupdate
    // lastKelas3 sehingga TP berikutnya tanpa label kelas di ATP-nya tetap benar.
    var lastKelas3 = '';
    // Carry-forward ATP (kolom G): sel merged di spreadsheet membuat baris lanjutan
    // ber-ATP kosong → baris tsb mewarisi ATP baris sebelumnya dalam mapel yang sama.
    var lastAtp3 = '';
    var lastMapel3 = '';
    localDB.filter(function(item){ return item.Fase === fase; }).forEach(function(item) {
        var mapel  = String(item.Matapelajaran || '').trim();
        var elemen = String(item.elemen || '').trim();
        var tp     = String(item.tujuanpembelajaran || '').trim();
        var materi = String(item.materi || elemen).trim();
        var atpRaw = String(item.alurtujuanpembelajaran || '');
        // Bersihkan label "Kelas X" di awal teks ATP (label kelas sudah jadi field tersendiri)
        var atpClean3 = atpRaw.replace(/^\s*Kelas\s+\d+[A-Za-z]?\s*[:.\-]?\s*/i, '').trim();
        // Ganti mapel → reset ATP agar tidak mewarisi ATP mapel sebelumnya
        if(mapel && mapel !== lastMapel3) { lastMapel3 = mapel; lastAtp3 = ''; }
        if(atpClean3) { lastAtp3 = atpClean3; }
        else if(/Kelas\s+\d+/i.test(atpRaw)) { lastAtp3 = ''; } // baris header "Kelas X" baru → reset
        var semDflt = String(item.Keterangan || item.semester || 'Semester I').trim();

        // Ekstraksi kelas HARUS dilakukan sebelum return agar baris header
        // "Kelas X" (yang tidak punya TP) tetap mengupdate carry-forward.
        var _firstKelasMatch3 = atpRaw.match(/Kelas\s+(\d+)/i);
        if(_firstKelasMatch3) lastKelas3 = 'Kelas ' + _firstKelasMatch3[1];

        if (!mapel || !tp) return;

        var kelasList = lastKelas3 ? [lastKelas3] : [];
        if (kelasList.length === 0) {
            // Fallback hanya jika belum ada kelas carry-forward sama sekali
            var _faseMap = {'A':['Kelas 1','Kelas 2'],'B':['Kelas 3','Kelas 4'],'C':['Kelas 5','Kelas 6'],'D':['Kelas 7','Kelas 8','Kelas 9'],'E':['Kelas 10'],'F':['Kelas 11','Kelas 12']};
            var _faseChar = String(item.Fase || '').trim().toUpperCase().match(/([A-F])/);
            kelasList = _faseChar ? (_faseMap[_faseChar[1]] || []) : [];
            if (kelasList.length === 0) return;
        }
        kelasList.forEach(function(kelas) {
            newRows.push({ id: idCounter++, Kelas: kelas, MataPelajaran: mapel, Semester: semDflt,
                Bab: elemen, MateriPokok: materi, Materi: materi, TujuanPembelajaran: tp, ATP: lastAtp3 });
        });
    });

    // 5. Simpan ke mc_kurikulum (timpa kombinasi Kelas + Mapel yang sama)
    var kelasBaru = [...new Set(newRows.map(function(r){ return r.Kelas; }))];
    var mapelBaru = [...new Set(newRows.map(function(r){ return r.MataPelajaran; }))];
    if (newRows.length > 0) {
        var existing = getDB('mc_kurikulum').filter(function(k){
            return !(kelasBaru.includes(k.Kelas) && mapelBaru.includes(k.MataPelajaran));
        });
        saveDB('mc_kurikulum', existing.concat(newRows));
    }

    // 6. Update semester di mc_prota (hanya record yang sudah ada)
    var protaDB      = getDB('mc_prota');
    var protaChanged = false;
    protaDB.forEach(function(p) {
        var key = String(p.mapel || '').trim() + '|||' + String(p.tp || '').trim();
        if (tpSemMap[key]) { p.semester = tpSemMap[key]; protaChanged = true; }
    });

    // 6b. Jika mode Prota aktif: sync Alokasi Waktu dari [data-aw] → mc_prota.alokasi
    var protaAwChanged = false;
    var protaAwMsg     = '';
    var protaMode = !!(document.getElementById('tpProtaToggle') && document.getElementById('tpProtaToggle').checked);
    if (protaMode) {
        var awCells = area.querySelectorAll('[data-aw][data-rowid]');
        if (awCells.length > 0) {
            // Map: mc_masterkurikulumbaru.id → { aw, tp, mapel }
            var awMap = {};
            awCells.forEach(function(el) {
                var rid = el.getAttribute('data-rowid');
                if (rid) awMap[String(rid)] = (el.value || '').trim();
            });
            var masterDB = getDB('mc_masterkurikulumbaru');
            // Build key map: "mapel|||tp" → alokasi value
            var tpAwMap = {};
            masterDB.forEach(function(item) {
                var id = String(item.id);
                if (awMap.hasOwnProperty(id) && awMap[id] !== undefined) {
                    var tp    = String(item.tujuanpembelajaran || '').trim();
                    var mapel = String(item.Matapelajaran || '').trim();
                    if (tp && mapel) tpAwMap[mapel + '|||' + tp] = awMap[id];
                }
            });
            // Update mc_prota.alokasi untuk record yang sudah ada
            var awUpdateCount = 0;
            protaDB.forEach(function(p) {
                var key = String(p.mapel || '').trim() + '|||' + String(p.tp || '').trim();
                if (tpAwMap.hasOwnProperty(key)) {
                    p.alokasi = tpAwMap[key];
                    protaChanged = true; protaAwChanged = true; awUpdateCount++;
                }
            });
            if (protaAwChanged) protaAwMsg = '<br><span class="text-xs text-green-700">⏱️ Alokasi Waktu (' + awUpdateCount + ' baris) → Database Prota diperbarui.</span>';
        }
    }

    if (protaChanged) saveDB('mc_prota', protaDB);

    // 7. Kirim Keterangan ke spreadsheet (kolom J)
    syncToSheet('update_keterangan_masterkurikulum', updates);

        ? '<br><span class="text-xs text-gray-600">mc_kurikulum: ' + newRows.length + ' baris | Kelas: ' + kelasBaru.join(', ') + '</span>'
        : '';
    customAlert('✅ Tersimpan! Keterangan (' + updates.length + ' baris) → Spreadsheet & Database Kurikulum.' + protaInfo + protaAwMsg + dbInfo, 'success');
};

// Helper: hitung index minggu (0-4) dari hari di bulan tertentu (acuan Senin)
window.promesWeekIdx = function(day, year, monthJS) {
    let firstDay = new Date(year, monthJS, 1).getDay(); // 0=Min,...,6=Sab
    let firstMon = (firstDay + 6) % 7; // Senin=0
    return Math.min(Math.floor((day + firstMon - 1) / 7), 4);
};

// Live preview: distribusikan tanggal yang diketik ke 5 slot minggu
window.updatePromesWeekPreview = function(inputEl, rowIdx, mIdx) {
    let val   = inputEl.value;
    let year  = window._promesActualYear;
    let mJS   = (window._promesMonthsJS || [])[mIdx];
    let slots = ['','','','',''];
    if(val && year != null && mJS != null) {
        val.split(/[,;\s]+/).map(s=>s.trim()).filter(s=>s).forEach(t => {
            let day = parseInt(t);
            if(!isNaN(day) && day>=1 && day<=31) {
                let wIdx = window.promesWeekIdx(day, year, mJS);
                slots[wIdx] = slots[wIdx] ? slots[wIdx]+','+day : String(day);
            }
        });
    }
    for(let w=0; w<5; w++) {

};

    let masterLookupForElemen = getDB('mc_masterkurikulumbaru').filter(function(k) {

        let rawTgl = Array(6).fill('');
        if (saved) {

            if (saved.dataBulan && saved.dataBulan !== "") {
                try { rawTgl = JSON.parse(saved.dataBulan); } catch(e) { rawTgl = Array(6).fill(''); }
            }
            // 2. CADANGAN: Jika Kolom O kosong, konversi data dari Kolom K (DataMinggu)
            else if (saved.dataMinggu) {

                    let dm = typeof saved.dataMinggu === 'string' ? JSON.parse(saved.dataMinggu) : saved.dataMinggu;

                <div class="grid grid-cols-5 gap-0.5" id="wPrev_${index}_${mIdx}">

                        <div id="wSlot_${index}_${mIdx}_${w}" class="text-[9px] font-bold rounded px-0.5 min-h-[16px] ${savedWeeks[w]?'bg-green-100 text-green-700':'text-gray-300'}">${savedWeeks[w]||'-'}</div>
                    </div>`).join('')}
                </div>
            </div>`;
        });
        html += `</div>`; // tutup grid bulan ATP

        // --- Sumatif Harian toggle + input tanggal ---
        let sumatifChecked = saved && saved.sumatifAktif ? 'checked' : '';
        let sumatifNamaVal = (saved && saved.sumatifNama) ? saved.sumatifNama : 'Penilaian sumatif harian';
        let rawTglSumatif = Array(6).fill('');
        if (saved && saved.sumatifDataBulan) {
            try { rawTglSumatif = JSON.parse(saved.sumatifDataBulan); } catch(e) { rawTglSumatif = Array(6).fill(''); }
        }
        html += `<div class="mt-3 pt-3 border-t border-gray-100">
            <div class="flex items-center gap-3 mb-2">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <div class="relative inline-block w-10 h-5">

                            onchange="document.getElementById('sumatifSection_${index}').style.display=this.checked?'':'none'">
                        <div class="w-10 h-5 bg-gray-300 peer-checked:bg-blue-500 rounded-full transition-colors duration-200"></div>
                        <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200 peer-checked:translate-x-5"></div>
                    </div>
                    <span class="text-xs font-bold text-gray-600">Sumatif Harian</span>
                </label>
            </div>
            <div id="sumatifSection_${index}" style="display:${sumatifChecked ? '' : 'none'}" class="pl-3 border-l-2 border-blue-200">
                <input type="text" id="sumatifNama_${index}" value="${sumatifNamaVal}"
                    placeholder="Nama penilaian sumatif..."
                    class="w-full p-1.5 border border-blue-200 rounded text-xs font-semibold text-blue-700 mb-2 outline-none focus:ring-2 focus:ring-blue-300">
                <div class="grid grid-cols-3 md:grid-cols-6 gap-2">`;
        months.forEach((m, mIdx) => {
            let savedSWeeks = ['','','','',''];
            if(rawTglSumatif[mIdx]) {
                rawTglSumatif[mIdx].split(/[,;\s]+/).map(s=>s.trim()).filter(s=>s).forEach(t => {
                    let day = parseInt(t);
                    if(!isNaN(day) && day>=1 && day<=31) {
                        let wIdx = window.promesWeekIdx(day, window._promesActualYear, window._promesMonthsJS[mIdx]);
                        savedSWeeks[wIdx] = savedSWeeks[wIdx] ? savedSWeeks[wIdx]+','+day : String(day);
                    }
                });
            }
            html += `<div>
                <label class="text-[10px] uppercase font-bold text-gray-400 block text-center mb-1">${m}</label>

                    placeholder="mis: 1,7,14"
                    oninput="window.updateSumatifWeekPreview(this,${index},${mIdx})"

                <div class="grid grid-cols-5 gap-0.5" id="swPrev_${index}_${mIdx}">
                    ${[0,1,2,3,4].map(w=>`<div class="text-center">
                        <div class="text-[8px] text-gray-400 font-bold">M${w+1}</div>
                        <div id="swSlot_${index}_${mIdx}_${w}" class="text-[9px] font-bold rounded px-0.5 min-h-[16px] ${savedSWeeks[w]?'bg-blue-100 text-blue-700':'text-gray-300'}">${savedSWeeks[w]||'-'}</div>
                    </div>`).join('')}

        html += `</div></div></div>`; // tutup: grid-sumatif, sumatifSection, wrapper-sumatif
        html += `</div>`; // tutup outer item div
    });
    html += `</div>`;

    document.getElementById('modalKurikulumTitle').innerHTML = `<i class="fas fa-calendar-check mr-2"></i> Input Tanggal Promes`;
    document.getElementById('modalKurikulumBody').innerHTML = html;

    document.getElementById('modalInputKurikulum').classList.remove('hidden');
};

			window.simpanModalPromes = function(protaFiltered, tahun, kelas, mapel, semester) {
			    let rowToSave = [];
			    let batchIdPromes = `${kelas}_${mapel}_${semester.replace(' ','')}_${tahun.replace('/','-')}`;

			    // --- Kalender aktual: tentukan tahun & mapping bulan JS per mIdx ---
			    // Semester I: Juli–Des (tahun pertama), Semester II: Jan–Jun (tahun kedua)
			    let tahunParts = tahun.split('/');
			    let actualYear = semester === 'Semester I'
			        ? parseInt(tahunParts[0])
			        : parseInt(tahunParts[1] || tahunParts[0]);
			    // monthsJS: indeks bulan JS (0=Jan, 6=Jul, dst) untuk mIdx 0–5
			    let monthsJS = semester === 'Semester I'
			        ? [6, 7, 8, 9, 10, 11]   // Juli, Agustus, Sept, Okt, Nov, Des
			        : [0, 1, 2, 3, 4, 5];     // Jan, Feb, Mar, Apr, Mei, Jun
			    
			    // --- Iterasi dari protaFiltered (ATP sudah ada semester+alokasi dari Prota) ---
			    protaFiltered.forEach((item, i) => {
			        let dataBulan = [];
			        let dataMinggu = Array(30).fill(''); 
			        let hasData = false;

			        for(let mIdx = 0; mIdx < 6; mIdx++) {
			            let inputEl = document.getElementById(`mP_${i}_${mIdx}`);
			            let val = inputEl ? inputEl.value.trim() : '';
			            dataBulan.push(val);
			            
			            if(val !== '') {
			                hasData = true;
			                val.split(/[,;\s]+/).map(s=>s.trim()).filter(s=>s).forEach(t => {
			                    let day = parseInt(t);
			                    if(!isNaN(day) && day >= 1 && day <= 31) {
			                        let firstDayJS  = new Date(actualYear, monthsJS[mIdx], 1).getDay();
			                        let firstDayMon = (firstDayJS + 6) % 7; // Senin=0
			                        let weekIdx     = Math.min(Math.floor((day + firstDayMon - 1) / 7), 4);
			                        let absIdx      = (mIdx * 5) + weekIdx;
			                        // Akumulasi — setiap tanggal masuk ke slot minggu yang tepat
			                        dataMinggu[absIdx] = dataMinggu[absIdx]
			                            ? dataMinggu[absIdx] + ',' + day
			                            : String(day);
			                    }
			                });
			            }
			        }

			        // Tangkap data sumatif harian
		        let sumatifToggleEl = document.getElementById('sumatifToggle_' + i);
		        let sumatifNamaEl   = document.getElementById('sumatifNama_' + i);
		        let sumatifAktif    = sumatifToggleEl ? sumatifToggleEl.checked : false;
		        let sumatifNama     = (sumatifNamaEl && sumatifNamaEl.value.trim()) ? sumatifNamaEl.value.trim() : 'Penilaian sumatif harian';
		        let sumatifDataBulan  = [];
		        let sumatifDataMinggu = Array(30).fill('');
		        if(sumatifAktif) {
		            for(let mIdx = 0; mIdx < 6; mIdx++) {
		                let sEl  = document.getElementById('sP_' + i + '_' + mIdx);
		                let sVal = sEl ? sEl.value.trim() : '';
		                sumatifDataBulan.push(sVal);
		                if(sVal !== '') {
		                    sVal.split(/[,;\s]+/).map(s=>s.trim()).filter(s=>s).forEach(t => {
		                        let day = parseInt(t);
		                        if(!isNaN(day) && day >= 1 && day <= 31) {
		                            let firstDayJS  = new Date(actualYear, monthsJS[mIdx], 1).getDay();
		                            let firstDayMon = (firstDayJS + 6) % 7;
		                            let weekIdx     = Math.min(Math.floor((day + firstDayMon - 1) / 7), 4);
		                            let absIdx      = (mIdx * 5) + weekIdx;
		                            sumatifDataMinggu[absIdx] = sumatifDataMinggu[absIdx]
		                                ? sumatifDataMinggu[absIdx] + ',' + day
		                                : String(day);
		                        }
		                    });
		                }
		            }
		        }

		        if(hasData || sumatifAktif) {
			            // AW & Materi langsung dari item prota (tidak perlu lookup ulang)
			            rowToSave.push({
			                id: Date.now() + i, guru: currentUserName, guruUsername: currentUserUsername, tahun: tahun, kelas: kelas, mapel: mapel,
			                semester: semester, babMateri: item.bab + ' - ' + item.materi, materi: item.materi, tp: item.tp, atp: item.atp || item.tp,
			                aw: item.alokasi || '-', dataMinggu: dataMinggu, dataBulan: JSON.stringify(dataBulan), keterangan: '', batchId: batchIdPromes,
			                sumatifAktif: sumatifAktif, sumatifNama: sumatifNama,
			                sumatifDataBulan: JSON.stringify(sumatifDataBulan), sumatifDataMinggu: sumatifDataMinggu
			            });
			        }
			    });

			    document.getElementById('loadingText').innerText = "Menyimpan Promes..."; 
			    document.getElementById('loadingOverlay').classList.remove('hidden');

			    
			        let db = getDB('mc_promes');
			        // PENTING: Filter pengaman antar guru
			        db = db.filter(p => !(p.batchId === batchIdPromes && p.guruUsername === currentUserUsername)); 
			        db.push(...rowToSave); 
			        
			        saveDB('mc_promes', db);
			        syncToSheet('simpan_promes', { batchId: batchIdPromes, rows: rowToSave });
			        
			        document.getElementById('loadingOverlay').classList.add('hidden');

			   window.simpanDataPromes = function() {
			let tahun = document.getElementById('prDataTahun').value;
			let kelas = document.getElementById('prDataKelas').value;
			let mapel = document.getElementById('prDataMapel').value;
			let semester = document.getElementById('prDataSemester').value;
			let batchId = `${kelas}_${mapel}_${semester.replace(' ','')}_${tahun.replace('/','-')}`;
			
			let kurikulumDB = getDB('mc_kurikulum').filter(k => k.Kelas === kelas && k.MataPelajaran === mapel && k.Semester === semester);
			let rowToSave = [];
			
			// Ambil data alokasi waktu dari Prota untuk referensi otomatis
			let batchIdProta = `${kelas}_${mapel}_${tahun.replace('/','-')}`;
			let protaDb = getDB('mc_prota');

			kurikulumDB.forEach((item, i) => {
				let dataMinggu = [];
				let hasData = false;
				
				// Loop 30 kolom minggu
				for(let w = 0; w < 30; w++) {
					let el = document.querySelector(`input[data-type="pr_week"][data-idx="${i}"][data-w="${w}"]`);
					let val = el ? el.value : '';
					dataMinggu.push(val);
					if(val !== '') hasData = true;
				}

				let ketEl = document.querySelector(`input[data-type="pr_week"][data-idx="${i}"]`); // Koreksi selector keterangan
				let ketVal = document.querySelector(`input[data-type="pr_ket"][data-idx="${i}"]`).value;
				if(ketVal !== '') hasData = true;

				if(hasData) {
					let awVal = '-';
					let savedProta = protaDb.find(p => p.batchId === batchIdProta && p.tp === item.TujuanPembelajaran && p.bab === item.Bab);
					if(savedProta) awVal = savedProta.alokasi;

					rowToSave.push({
						id: Date.now() + i,
						guru: currentUserName,
						tahun: tahun,
						kelas: kelas,
						mapel: mapel,
						semester: semester,
						babMateri: item.Bab + ' - ' + item.MateriPokok,

						aw: awVal,
						dataMinggu: dataMinggu,
						keterangan: ketVal,
						batchId: batchId
					});
				}
			});

			if(rowToSave.length === 0) {
				customAlert("Isi data absen minggu atau keterangan sebelum menyimpan!", "warning");

			document.getElementById('loadingText').innerText = "Menyimpan Promes...";
			document.getElementById('loadingOverlay').classList.remove('hidden');

			
				let promesDb = getDB('mc_promes').filter(p => p.batchId !== batchId);

				syncToSheet('simpan_promes', { batchId: batchId, rows: rowToSave });
				document.getElementById('loadingOverlay').classList.add('hidden');

        // ── JADWAL PELAJARAN (Grid per Jam × Hari) ─────────────────────────────
        function getJadwalConfig() {
            try { return JSON.parse(getSafe('mc_jadwal_config')) || {}; } catch(e) { return {}; }
        }
        function saveJadwalConfig(cfg) { setSafe('mc_jadwal_config', JSON.stringify(cfg)); }

        function getDefaultJadwalConfig() {
            return {
                hariSekolah: 6,
                jamPeriods: [
                    { jamKe: 1, waktu: '07.30-08.05' },
                    { jamKe: 2, waktu: '08.05-08.40' },
                    { jamKe: 3, waktu: '08.40-09.15' },
                    { jamKe: 4, waktu: '09.30-10.05' },
                    { jamKe: 5, waktu: '10.05-10.40' },
                    { jamKe: 6, waktu: '10.40-11.15' }
                ],
                istirahat: [{ afterJam: 3, waktu: '09.15-09.30' }]
            };
        }

        // Merge saved config di atas default, lalu sort periods
        function getMergedJadwalConfig() {
            const def = getDefaultJadwalConfig();
            const saved = getJadwalConfig();
            const merged = Object.assign({}, def, saved);
            // jamPeriods dari saved menang penuh jika ada
            if (!saved.jamPeriods || saved.jamPeriods.length === 0) merged.jamPeriods = def.jamPeriods;
            merged.jamPeriods.sort((a, b) => a.jamKe - b.jamKe);
            return merged;
        }

        function buildJadwalTable(jadwal, days, cfg, forPrint) {
            const fs = forPrint ? '12px' : '13px';
            const pad = forPrint ? '6px 9px' : '7px 10px';
            const thStyle = `border:1px solid #000;padding:${pad};text-align:center;font-weight:bold;background-color:#f3f4f6;font-family:'Times New Roman',Times,serif;font-size:${fs};`;
            const tdBase  = `border:1px solid #000;padding:${pad};text-align:center;vertical-align:middle;font-family:'Times New Roman',Times,serif;font-size:${fs};`;
            const TH = (txt) => `<th style="${thStyle}">${txt}</th>`;
            const TD = (txt, extra) => `<td style="${tdBase}${extra||''}">${txt}</td>`;

            const lookup = {};
            jadwal.forEach(j => { lookup[`${j.jamKe}_${j.hari}`] = j; });

            const displayDay = d => d === 'Jumat' ? "Jum'at" : d;
            const headers = `<tr>${TH('Jam')}${TH('Waktu')}${days.map(d => TH(displayDay(d))).join('')}</tr>`;

            let rows = '';
            cfg.jamPeriods.forEach(period => {
                // Baris Istirahat sebelum period ini jika ada
                (cfg.istirahat || []).filter(i => i.afterJam === period.jamKe - 1).forEach(ist => {
                    rows += `<tr>
                        ${TD('', 'background:#fff;')}
                        ${TD(ist.waktu, 'font-weight:bold;white-space:nowrap;background:#fff;')}
                        ${days.map(() => TD('Istirahat', 'font-weight:bold;font-style:italic;background:#fff;')).join('')}
                    </tr>`;
                });

                const cells = days.map(day => {
                    const entry = lookup[`${period.jamKe}_${day}`];
                    if (forPrint) return TD(entry ? entry.mapel : '');
                    const delBtn = currentUserRole === 'guru' && entry
                        ? `<button onclick="deleteJadwal(${entry.id})" title="Hapus" style="color:#ef4444;margin-left:4px;font-size:10px;vertical-align:middle;"><i class="fas fa-times-circle"></i></button>`
                        : '';
                    return `<td style="${tdBase}">${entry
                        ? `<span style="font-weight:600;">${entry.mapel}</span>${delBtn}`
                        : '<span style="color:#d1d5db;font-size:11px;">—</span>'}</td>`;
                }).join('');

                rows += `<tr>
                    ${TD(period.jamKe, 'font-weight:bold;')}
                    ${TD(period.waktu, 'white-space:nowrap;')}
                    ${cells}
                </tr>`;
            });

            return `<table style="width:100%;border-collapse:collapse;border:1px solid #000;">
                <thead>${headers}</thead><tbody>${rows}</tbody>
            </table>`;
        }

        // Tab switcher form
        window.switchJadwalTab = function(tab) {
            const panels = { input: 'jpanel-input', atur: 'jpanel-atur' };
            const tabs   = { input: 'jtab-input',   atur: 'jtab-atur'   };
            Object.keys(panels).forEach(k => {
                const panel = document.getElementById(panels[k]);
                const btn   = document.getElementById(tabs[k]);
                if (!panel || !btn) return;
                if (k === tab) {
                    panel.classList.remove('hidden');
                    btn.classList.add('text-indigo-700', 'border-b-2', 'border-indigo-600', 'bg-white');
                    btn.classList.remove('text-gray-500', 'bg-indigo-50');
                } else {
                    panel.classList.add('hidden');
                    btn.classList.remove('text-indigo-700', 'border-b-2', 'border-indigo-600', 'bg-white');
                    btn.classList.add('text-gray-500', 'bg-indigo-50');
                }
            });
        };

        window.setHariSekolah = function(n) {
            const cfg = getMergedJadwalConfig();
            cfg.hariSekolah = n;
            saveJadwalConfig(cfg);
            renderJadwal();
        };

        // Simpan periode jam dari panel Atur
        window.simpanPeriode = function() {
            const jamKe = parseInt(document.getElementById('aturJamKe').value);
            const waktu = document.getElementById('aturWaktu').value.trim();
            if (!jamKe || !waktu) { customAlert('Isi nomor jam dan waktu!', 'warning'); return; }
            const cfg = getMergedJadwalConfig();
            const idx = cfg.jamPeriods.findIndex(p => p.jamKe === jamKe);
            if (idx >= 0) cfg.jamPeriods[idx].waktu = waktu;
            else cfg.jamPeriods.push({ jamKe, waktu });
            cfg.jamPeriods.sort((a,b) => a.jamKe - b.jamKe);
            saveJadwalConfig(cfg);
            renderJadwal();
            setTimeout(() => window.switchJadwalTab('atur'), 50);
        };

        // Simpan istirahat dari panel Atur
        window.simpanIstirahat = function() {
            const afterJam = parseInt(document.getElementById('aturIstAfter').value);
            const waktu    = document.getElementById('aturIstWaktu').value.trim();
            if (!afterJam || !waktu) { customAlert('Isi setelah jam ke- dan waktu istirahat!', 'warning'); return; }
            const cfg = getMergedJadwalConfig();
            if (!cfg.istirahat) cfg.istirahat = [];
            // Hindari duplikat afterJam yang sama
            cfg.istirahat = cfg.istirahat.filter(i => i.afterJam !== afterJam);
            cfg.istirahat.push({ afterJam, waktu });
            cfg.istirahat.sort((a,b) => a.afterJam - b.afterJam);
            saveJadwalConfig(cfg);
            renderJadwal();
            setTimeout(() => window.switchJadwalTab('atur'), 50);
        };

        window.hapusIstirahat = function(idx) {
            const cfg = getMergedJadwalConfig();
            cfg.istirahat.splice(idx, 1);
            saveJadwalConfig(cfg);
            renderJadwal();
            setTimeout(() => window.switchJadwalTab('atur'), 50);
        };

        window.hapusJamPeriode = async function(jamKe) {
            const isConfirm = await customConfirm(`Hapus Jam ${jamKe}? Jadwal pelajaran pada jam ini juga akan ikut terhapus.`, "Konfirmasi Hapus");
            if (!isConfirm) return;

            const cfg = getMergedJadwalConfig();
            cfg.jamPeriods = cfg.jamPeriods.filter(p => p.jamKe !== jamKe);
            saveJadwalConfig(cfg);

            // Hapus juga entri jadwal yang memakai jam tsb
            let jdwl = getDB('mc_jadwal').filter(j => parseInt(j.jamKe) !== jamKe);
            saveDB('mc_jadwal', jdwl);

            renderJadwal();
            setTimeout(() => window.switchJadwalTab('atur'), 50);
        };

        window.cetakJadwal = function() {
            applyDynamicPageStyle(getPrintSettings('jadwal')); // pastikan pengaturan cetak khusus Jadwal terbaru ikut terpakai
            window.print();
        };

        function addJadwal() {
            const jamKe = parseInt(document.getElementById('jJamKe').value);
            const waktu = document.getElementById('jWaktu').value.trim();
            const hari  = document.getElementById('jHari').value;
            const mapel = document.getElementById('jMapel').value.trim();

            if (!jamKe) { customAlert('Nomor jam wajib diisi!', 'warning'); return; }
            if (!waktu) { customAlert('Waktu jam wajib diisi! (contoh: 07.30-08.05)', 'warning'); return; }
            if (!mapel) { customAlert('Mata Pelajaran wajib diisi!', 'warning'); return; }

            document.getElementById('loadingText').innerText = 'Menyimpan Jadwal...';
            document.getElementById('loadingOverlay').classList.remove('hidden');

            // Update/tambah periode di config
            const cfg = getMergedJadwalConfig();
            const pIdx = cfg.jamPeriods.findIndex(p => p.jamKe === jamKe);
            if (pIdx >= 0) cfg.jamPeriods[pIdx].waktu = waktu;
            else cfg.jamPeriods.push({ jamKe, waktu });
            cfg.jamPeriods.sort((a,b) => a.jamKe - b.jamKe);
            saveJadwalConfig(cfg);

            // Overwrite entri slot jam+hari yang sama
            let jdwl = getDB('mc_jadwal').filter(j =>
                !(parseInt(j.jamKe) === jamKe && j.hari === hari &&
                  (j.guruUsername === currentUserUsername || !j.guruUsername)));
            const data = { id: Date.now(), jamKe, hari, mapel, waktu, guru: '', schoolCode: currentSchoolCode, guruUsername: currentUserUsername };
            jdwl.push(data);
            saveDB('mc_jadwal', jdwl);
            syncToSheet('tambah_jadwal', data);

            document.getElementById('loadingOverlay').classList.add('hidden');
            customAlert('Jadwal Disimpan!', 'success');
            renderJadwal();
        }

        async function deleteJadwal(id) {
            const isConfirm = await customConfirm('Hapus jadwal ini?', 'Konfirmasi');
            if (!isConfirm) return;
            document.getElementById('loadingText').innerText = 'Menghapus...';
            document.getElementById('loadingOverlay').classList.remove('hidden');
            let jdwl = getDB('mc_jadwal').filter(j => j.id != id);
            saveDB('mc_jadwal', jdwl);
            syncToSheet('hapus_jadwal', { id });
            document.getElementById('loadingOverlay').classList.add('hidden');
            renderJadwal();
        }

window.updateChart = function() {
            // 1. Ambil daftar siswa HANYA untuk kelas/guru yang sedang login
            const students = getMyStudents(); 
            const myStudentIds = students.map(s => s.id);
            
            // 2. Tarik data absen se-sekolah, lalu filter hanya untuk siswa milik guru tersebut
            const absen = filterBySchool(getDB('mc_absen')).filter(a => 
                currentUserRole !== 'guru' || myStudentIds.includes(a.studentId) || a.guruUsername === currentUserUsername
            );
            
            const month = parseInt(document.getElementById('chartMonth').value); 
            const year = parseInt(document.getElementById('chartYear').value);
            
            // 3. Hitung Hari Efektif (KBM) berdasarkan absen yang sudah difilter
            let uniqueDatesClass = new Set(); 
            absen.forEach(a => { 
                const d = new Date(a.tanggal); 
                if(d.getMonth() === month && d.getFullYear() === year) uniqueDatesClass.add(a.tanggal); 
            }); 
            let hariEfektif = uniqueDatesClass.size;
            
            // 4. Filter absen sesuai bulan dan tahun
            let filteredAbsen = absen.filter(a => { 
                const d = new Date(a.tanggal); 
                return d.getMonth() === month && d.getFullYear() === year; 
            }); 
            
            // 5. Jika login sebagai siswa, filter lagi khusus data dirinya
            if (currentUserRole === 'siswa') { 
                filteredAbsen = filteredAbsen.filter(a => a.studentId == currentStudentId); 
            }
            
            // 6. Hitung jumlah H, S, I, TK
            let counts = { h: 0, s: 0, i: 0, t: 0 }; 
            filteredAbsen.forEach(a => { 
                if(a.status === 'Hadir') counts.h++; 
                if(a.status === 'Sakit') counts.s++; 
                if(a.status === 'Izin') counts.i++; 
                if(a.status === 'Tanpa Keterangan') counts.t++; 
            });
            
            // 7. Render Grafik Doughnut Chart
            const canvasEl = document.getElementById('absenChart');
            if (canvasEl) {
                const ctx = canvasEl.getContext('2d'); 
                if (myChart) myChart.destroy();
                myChart = new Chart(ctx, { 
                    type: 'doughnut', 
                    data: { 
                        labels: ['Hadir', 'Sakit', 'Izin', 'Tanpa Keterangan'], 
                        datasets: [{ 
                            data: [counts.h, counts.s, counts.i, counts.t], 
                            backgroundColor: ['#10B981', '#F59E0B', '#3B82F6', '#EF4444'], 
                            borderWidth: 1 
                        }] 
                    }, 
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        plugins: { legend: { position: 'bottom' } } 
                    } 
                });
            }
            
            // 8. Render Rincian Kalkulasi
            let detailHtml = "";
            if (currentUserRole === 'siswa') {
                let persentaseIndividu = hariEfektif > 0 ? (counts.h / hariEfektif) * 100 : 0;
                detailHtml = `<h4 class="font-bold text-gray-700 mb-4 border-b pb-2">Rincian Kehadiran Anda</h4><div class="space-y-3 text-sm"><div class="flex justify-between border-b pb-1"><span class="text-gray-500">Hari Efektif Kelas:</span><span class="font-bold text-gray-800">${hariEfektif} Hari</span></div><div class="flex justify-between border-b pb-1"><span class="text-gray-500">Anda Hadir:</span><span class="font-bold text-green-600">${counts.h} Kali</span></div><div class="pt-4 text-center"><p class="text-gray-500 text-xs uppercase tracking-wider mb-1">Persentase Kehadiran Anda</p><h2 class="text-4xl font-extrabold ${persentaseIndividu >= 80 ? 'text-green-600' : 'text-red-500'}">${persentaseIndividu.toFixed(1)}%</h2></div></div>`;
            } else {
                let totalSiswa = students.length; 
                let persentaseKelas = (totalSiswa > 0 && hariEfektif > 0) ? (counts.h / (totalSiswa * hariEfektif)) * 100 : 0;
                detailHtml = `<h4 class="font-bold text-gray-700 mb-4 border-b pb-2">Rincian Kalkulasi Kelas</h4><div class="space-y-3 text-sm"><div class="flex justify-between border-b pb-1"><span class="text-gray-500">Jumlah Siswa:</span><span class="font-bold text-gray-800">${totalSiswa} Anak</span></div><div class="flex justify-between border-b pb-1"><span class="text-gray-500">Hari Efektif (KBM):</span><span class="font-bold text-gray-800">${hariEfektif} Hari</span></div><div class="flex justify-between border-b pb-1"><span class="text-gray-500">Total Kehadiran:</span><span class="font-bold text-green-600">${counts.h} Kali</span></div><div class="pt-4 text-center"><p class="text-gray-500 text-xs uppercase tracking-wider mb-1">Rata-rata Kehadiran Kelas</p><h2 class="text-4xl font-extrabold ${persentaseKelas >= 80 ? 'text-green-600' : 'text-red-500'}">${persentaseKelas.toFixed(1)}%</h2></div></div>`;
            }
            
            let detailContainer = document.getElementById('absenDetails');
            if (detailContainer) {
                detailContainer.innerHTML = detailHtml;
            }
        };

// ====== TAB SWITCHER: GENERATE AI <-> BANK MODUL AJAR ======
window.switchModulAjarTab = function(tab) {
    const panelGenerate = document.getElementById('panelModulGenerateAI');
    const panelBank = document.getElementById('panelBankModul');
    const btnGenerate = document.getElementById('tabBtnGenerateAI');
    const btnBank = document.getElementById('tabBtnBankModul');
    if (!panelGenerate || !panelBank) return;

    if (tab === 'bank') {
        panelGenerate.classList.add('hidden');
        panelBank.classList.remove('hidden');
        btnBank.classList.remove('bg-gray-100', 'text-gray-600');
        btnBank.classList.add('bg-orange-500', 'text-white', 'shadow');
        btnGenerate.classList.remove('bg-orange-500', 'text-white', 'shadow');
        btnGenerate.classList.add('bg-gray-100', 'text-gray-600');
        window.initPmKelasOptions();
    } else {
        panelBank.classList.add('hidden');
        panelGenerate.classList.remove('hidden');
        btnGenerate.classList.remove('bg-gray-100', 'text-gray-600');
        btnGenerate.classList.add('bg-orange-500', 'text-white', 'shadow');
        btnBank.classList.remove('bg-orange-500', 'text-white', 'shadow');
        btnBank.classList.add('bg-gray-100', 'text-gray-600');
    }
};

    const panel = document.getElementById('modalPengaturanAIBody');
    if (!panel) return;

    const aiCfg = window.getAIConfig();
    const providerKeys = Object.keys(AI_PROVIDERS);
    const providerBtns = providerKeys.map(pid => {
        const p = AI_PROVIDERS[pid];
        const isSelected = aiCfg.provider === pid;
        const colorMap = { orange:'orange', blue:'blue', purple:'purple', green:'green' };
        const c = colorMap[p.color] || 'blue';
        const badgeGratis = p.gratis ? `<span class="ml-1 bg-green-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full">GRATIS</span>` :
            (p.creditInfo ? `<span class="ml-1 bg-yellow-400 text-yellow-900 text-xs font-bold px-1.5 py-0.5 rounded-full">${p.creditInfo}</span>` : '');

            id="aiProvBtn_${pid}"

                ${isSelected ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow' : 'border-gray-200 bg-white text-gray-500 hover:border-indigo-300'}">

    const modelOpts = (p0 ? p0.models : []).map(m => `<option value="${m}" ${aiCfg.model===m?'selected':''}>${m}</option>`).join('');
    const langkahHtml = p0 ? p0.langkah.map((l,i)=>`<li class="flex gap-2"><span class="flex-shrink-0 w-6 h-6 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-xs font-bold">${i+1}</span><span class="text-sm text-gray-700">${l}</span></li>`).join('') : '';

    panel.innerHTML = `
