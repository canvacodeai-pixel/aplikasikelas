    <script>
        // html2pdf and xlsx are heavy (~1MB+ combined) and only needed for print/export.
        // Loaded lazily on first use via ensureHtml2pdf()/ensureXlsx() instead of blocking initial render.
        window._libCache = {};
        function loadScriptOnce(key, src) {
            if (window._libCache[key]) return window._libCache[key];
            window._libCache[key] = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = () => resolve();
                s.onerror = () => { window._libCache[key] = null; reject(new Error('Gagal memuat ' + src)); };
                document.head.appendChild(s);
            });
            return window._libCache[key];
        }
        window.ensureHtml2pdf = () => loadScriptOnce('html2pdf', 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
        window.ensureXlsx = () => loadScriptOnce('xlsx', 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    </script>

            document.body.innerHTML = `

                    <h2 style="color:#e3342f; font-weight:bold;">Aplikasi Gagal Dimuat</h2>
                    <p style="color:#6c757d; max-width:600px; margin:0 auto; padding:15px; background:#f8d7da; border-radius:8px;">
                        <b>Pesan:</b> ` + message + `<br><br>
                        <b>Baris:</b> ` + lineno + `:` + colno + `
                    </p>
                </div>`;
            return true;
        };
    </script>

        const firebaseConfig = {

        let fsDb = null, fsStorage = null;
        try {

        // Helper: ambil reference collection berdasarkan schoolCode aktif
        function schoolCol(colName) {

            return fsDb.collection('schools/' + sc + '/' + colName);
        }
        // ───────────────────────────────────────────────────────────────
        
        function showCustomDialog({ title, message, type = 'info', showCancel = false }) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customDialogOverlay'); const iconContainer = document.getElementById('dialogIconContainer'); const icon = document.getElementById('dialogIcon'); const titleEl = document.getElementById('dialogTitle'); const messageEl = document.getElementById('dialogMessage'); const btnConfirm = document.getElementById('dialogBtnConfirm'); const btnCancel = document.getElementById('dialogBtnCancel');
                iconContainer.className = 'w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 '; btnConfirm.className = 'px-5 py-2.5 text-white rounded-xl font-bold shadow-md transition w-full sm:w-auto ';
                if (type === 'success') { iconContainer.classList.add('bg-green-100', 'text-green-600'); icon.className = 'fas fa-check text-3xl'; btnConfirm.classList.add('bg-green-600', 'hover:bg-green-700'); titleEl.innerText = title || 'Berhasil'; } 
                else if (type === 'error') { iconContainer.classList.add('bg-red-100', 'text-red-600'); icon.className = 'fas fa-times text-3xl'; btnConfirm.classList.add('bg-red-600', 'hover:bg-red-700'); titleEl.innerText = title || 'Gagal'; } 
                else if (type === 'warning') { iconContainer.classList.add('bg-yellow-100', 'text-yellow-600'); icon.className = 'fas fa-exclamation text-3xl'; btnConfirm.classList.add('bg-yellow-500', 'hover:bg-yellow-600'); titleEl.innerText = title || 'Peringatan'; } 
                else { iconContainer.classList.add('bg-blue-100', 'text-blue-600'); icon.className = 'fas fa-info text-3xl'; btnConfirm.classList.add('bg-blue-600', 'hover:bg-blue-700'); titleEl.innerText = title || 'Informasi'; }
                messageEl.innerText = message; btnCancel.classList.toggle('hidden', !showCancel); btnConfirm.innerText = showCancel ? 'Ya, Lanjutkan' : 'OK Mengerti'; overlay.classList.remove('hidden');
                const closeModal = (result) => { overlay.classList.add('hidden'); btnConfirm.onclick = null; btnCancel.onclick = null; resolve(result); };
                btnConfirm.onclick = () => closeModal(true); btnCancel.onclick = () => closeModal(false);
            });
        }
        const customAlert = (message, type = 'info', title = null) => showCustomDialog({ title, message, type, showCancel: false });
        const customConfirm = (message, title = 'Konfirmasi') => showCustomDialog({ title, message, type: 'warning', showCancel: true });

        // FUNGSI PENCARIAN (SEARCH) REAL-TIME GLOBAL
        window.filterItems = function(inputId, containerId, itemClassOrTag) {
            let filter = document.getElementById(inputId).value.toLowerCase();
            let container = document.getElementById(containerId);
            if(!container) return;
            let items = container.querySelectorAll(itemClassOrTag);
            for (let item of items) {
                // Abaikan baris tabel yang berupa pesan kosong (misal: "Belum ada data")
                if(item.tagName === 'TR' && item.children.length === 1 && item.children[0].colSpan > 1) continue;
                item.style.display = item.textContent.toLowerCase().includes(filter) ? "" : "none";
            }
        };

        const memStore = {};
        function getSafe(k) { if(memStore[k] !== undefined) return memStore[k]; try { return localStorage.getItem(k); } catch(e) { return null; } }
        function setSafe(k, v) { try { localStorage.setItem(k, v); if(memStore[k]) delete memStore[k]; } catch(e) { memStore[k] = v; } }
        function rmSafe(k) { try { localStorage.removeItem(k); } catch(e) {} delete memStore[k]; delete dbCache[k]; }

        // =====================================================================
        // MODUL PENGATURAN CETAK HALAMAN (PRINT PAGE SETUP)
        // Mengatur margin, orientasi, dan ukuran kertas (A4/F4) secara global
        // agar konsisten diterapkan pada semua fitur download PDF, Word, dan Excel.
        // =====================================================================
        const PRINT_PAPER_SIZES = { A4: [210, 297], F4: [215.9, 330.2] }; // mm, [lebar, tinggi] dalam posisi Portrait
        const PRINT_SETTINGS_DEFAULT = { paperSize: 'A4', orientation: 'portrait', marginTop: 15, marginRight: 10, marginBottom: 15, marginLeft: 10, fontSize: 12, lineSpacing: 1.15 };

        // Sejak versi ini, Pengaturan Cetak TIDAK lagi global satu untuk semua dokumen.
        // Setiap fitur/dokumen (Bank Soal, Prota, Promes, KKTP, dst) punya pengaturan cetak
        // sendiri-sendiri, disimpan terpisah berdasarkan "docKey" (kunci dokumen).
        // docKey = null/undefined tetap didukung (memakai kunci lama 'mc_print_settings')
        // agar kompatibel dengan pemanggilan lama yang belum sempat diperbarui.
        function _printSettingsKey(docKey) {
            return docKey ? ('mc_print_settings_' + docKey) : 'mc_print_settings';
        }

        // Beberapa dokumen (tabel lebar seperti Struktur Kurikulum, Promes, KKTP, dst) sebelumnya
        // memaksa orientasi Landscape secara hardcode di tombol Download, sehingga pilihan user di
        // modal Pengaturan Cetak untuk dokumen tsb tidak pernah benar-benar berpengaruh.
        // Sekarang tombol-tombol itu memakai getPrintSettings() apa adanya (tidak memaksa), dan
        // peta di bawah ini hanya dipakai sebagai NILAI AWAL (default) yang masuk akal untuk
        // dokumen tsb SEBELUM user pernah menyimpan Pengaturan Cetak-nya sendiri.
        const DOC_DEFAULT_ORIENTATION = {
            struktur: 'landscape', promes: 'landscape', kktp: 'landscape',
            agenda: 'landscape', prota: 'landscape', tpatp: 'landscape', cp: 'landscape',
            kaldik: 'landscape'
        };

        function getPrintSettings(docKey) {
            try {
                let raw = getSafe(_printSettingsKey(docKey));
                // Migrasi halus: jika dokumen ini belum pernah diatur secara khusus,
                // gunakan pengaturan lama (global) sebagai titik awal, bukan langsung default pabrik.
                if (!raw && docKey) raw = getSafe('mc_print_settings');
                if (!raw) {
                    let def = Object.assign({}, PRINT_SETTINGS_DEFAULT);
                    if (docKey && DOC_DEFAULT_ORIENTATION[docKey]) def.orientation = DOC_DEFAULT_ORIENTATION[docKey];
                    return def;
                }
                let parsed = JSON.parse(raw);
                return Object.assign({}, PRINT_SETTINGS_DEFAULT, parsed);
            } catch(e) { return Object.assign({}, PRINT_SETTINGS_DEFAULT); }
        }

        function savePrintSettings(settings, docKey) {
            let clean = {
                paperSize: (settings.paperSize === 'F4') ? 'F4' : 'A4',
                orientation: (settings.orientation === 'landscape') ? 'landscape' : 'portrait',
                marginTop: Math.max(0, Number(settings.marginTop) || 0),
                marginRight: Math.max(0, Number(settings.marginRight) || 0),
                marginBottom: Math.max(0, Number(settings.marginBottom) || 0),
                marginLeft: Math.max(0, Number(settings.marginLeft) || 0),
                fontSize: Math.min(24, Math.max(8, Number(settings.fontSize) || PRINT_SETTINGS_DEFAULT.fontSize)),
                lineSpacing: Math.min(3, Math.max(1, Number(settings.lineSpacing) || PRINT_SETTINGS_DEFAULT.lineSpacing))
            };
            setSafe(_printSettingsKey(docKey), JSON.stringify(clean));
            if (!docKey) applyDynamicPageStyle(clean);
            return clean;
        }

        // Kembalikan [lebar, tinggi] dalam mm sesuai ukuran kertas & orientasi terpilih
        function getPrintPaperDims(settings, forceOrientation) {
            settings = settings || getPrintSettings();
            let base = PRINT_PAPER_SIZES[settings.paperSize] || PRINT_PAPER_SIZES.A4;
            let orient = forceOrientation || settings.orientation;
            let w = Math.min(base[0], base[1]), h = Math.max(base[0], base[1]);
            return orient === 'landscape' ? [h, w] : [w, h];
        }

        // Format margin array [top, left, bottom, right] dalam mm, dipakai oleh opsi 'margin' html2pdf
        function getPrintMarginArray(settings) {
            settings = settings || getPrintSettings();
            return [settings.marginTop, settings.marginLeft, settings.marginBottom, settings.marginRight];
        }

        // Bangun string CSS "@page" sesuai pengaturan (dipakai untuk window.print() dan export Word)
        function buildPageCSS(settings, forceOrientation) {
            settings = settings || getPrintSettings();
            let dims = getPrintPaperDims(settings, forceOrientation);
            let orient = forceOrientation || settings.orientation;
            return `@page { size: ${dims[0]}mm ${dims[1]}mm; margin: ${settings.marginTop}mm ${settings.marginRight}mm ${settings.marginBottom}mm ${settings.marginLeft}mm; mso-page-orientation: ${orient}; }`;
        }

        // Bangun string CSS untuk ukuran font & spasi baris sesuai Pengaturan Cetak milik user.
        // Dipakai bersama-sama oleh window.print() (Cetak langsung), export Word, dan export PDF.
        function buildFontSpacingCSS(settings) {
            settings = settings || getPrintSettings();
            let fs = settings.fontSize || PRINT_SETTINGS_DEFAULT.fontSize;
            let ls = settings.lineSpacing || PRINT_SETTINGS_DEFAULT.lineSpacing;
            // "!important" khusus untuk table/td/th diperlukan karena banyak sel tabel di berbagai
            // fitur sudah punya font-size inline hardcode (mis. style="font-size:10px") yang lebih
            // kuat dibanding aturan CSS biasa. Tanpa !important, Ukuran Font di Pengaturan Cetak
            // tidak akan benar-benar terlihat saat Cetak (print) langsung.
            return `body, table, td, th, p, div, span { font-size: ${fs}pt; line-height: ${ls}; } table, table td, table th, td, th, .mc-footnote-block, .mc-footnote-block div { font-size: ${fs}pt !important; line-height: ${ls} !important; }`;
        }

        // Suntikkan/perbarui <style> dinamis di <head> agar window.print() (mis. Cetak Jadwal)
        // selalu memakai pengaturan kertas/margin/orientasi/font/spasi terbaru milik user.
        function applyDynamicPageStyle(settings) {
            settings = settings || getPrintSettings();
            let styleTag = document.getElementById('mcDynamicPageStyle');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'mcDynamicPageStyle';
                document.head.appendChild(styleTag);
            }
            styleTag.innerHTML = `
                ${buildPageCSS(settings)}
                @media print {
                    table tr, .avoid-break { page-break-inside: avoid; break-inside: avoid; }
                    thead { display: table-header-group; }
                    tfoot { display: table-footer-group; }
                    ${buildFontSpacingCSS(settings)}
                }
            `;
        }

        // Terapkan Pengaturan Cetak (margin/kertas/orientasi) ke sebuah worksheet Excel (SheetJS)
        // agar saat file .xlsx dibuka & dicetak, page setup-nya sudah sesuai dengan pilihan user.
        function applyXlsxPageSetup(ws, settings, forceOrientation) {
            try {
                settings = settings || getPrintSettings();
                let orient = forceOrientation || settings.orientation;
                let mmToIn = (mm) => Number((mm / 25.4).toFixed(3));
                ws['!margins'] = {
                    left: mmToIn(settings.marginLeft), right: mmToIn(settings.marginRight),

            const orientation = document.getElementById('pcmOrientasi').value;
            const mTop = Number(document.getElementById('pcmMarginTop').value) || 0;
            const mRight = Number(document.getElementById('pcmMarginRight').value) || 0;

            const mLeft = Number(document.getElementById('pcmMarginLeft').value) || 0;
            const dims = getPrintPaperDims({ paperSize, orientation }, orientation); // [w,h] mm
            const scale = 170 / Math.max(dims[0], dims[1]);

            box.style.width = boxW + 'px'; box.style.height = boxH + 'px';
            marginBox.style.top = (mTop * scale) + 'px';

		function checkSameDate(dbDate, filterDateStr) {

			let dbStr = String(dbDate);
			if(dbStr === filterDateStr || dbStr.startsWith(filterDateStr)) return true;
			let d = new Date(dbDate);
			if(!isNaN(d.getTime())) {
				let y = d.getFullYear();
				let m = String(d.getMonth() + 1).padStart(2, '0');
				let dd = String(d.getDate()).padStart(2, '0');
				return `${y}-${m}-${dd}` === filterDateStr;
			}
			return false;
		}

        // Hitung lebar kolom Excel (wch) berdasarkan isi tabel HTML aslinya (memperhitungkan
        // rowspan/colspan header seperti "Alokasi Per Tahun"/"Alokasi Per Minggu" pada Struktur
        // Kurikulum), supaya file .xlsx yang diunduh tidak menampilkan kolom sempit/terpotong
        // seperti "Mata Pela..." — melainkan selebar isi terpanjang di kolom tersebut, mirip
        // hasil preview di layar.
        window._getExcelColWidths = function(table) {
            let colWidths = [];
            let occupied = []; // occupied[row][col] = true jika sudah dipakai sel rowspan sebelumnya
            Array.from(table.rows).forEach((row, rIdx) => {
                let cIdx = 0;
                Array.from(row.cells).forEach(cell => {
                    while (occupied[rIdx] && occupied[rIdx][cIdx]) cIdx++;
                    let colSpan = cell.colSpan || 1;
                    let rowSpan = cell.rowSpan || 1;
                    let text = (cell.innerText || cell.textContent || '').trim();
                    let perCol = Math.ceil(text.length / colSpan);
                    for (let k = 0; k < colSpan; k++) {
                        let col = cIdx + k;
                        colWidths[col] = Math.max(colWidths[col] || 0, perCol);
                        for (let r = 0; r < rowSpan; r++) {
                            if (!occupied[rIdx + r]) occupied[rIdx + r] = [];
                            occupied[rIdx + r][col] = true;
                        }
                    }
                    cIdx += colSpan;
                });
            });
            return colWidths.map(w => ({ wch: Math.min(40, Math.max(8, (w || 8) + 2)) }));
        };

					let wb = XLSX.utils.table_to_book(table, {sheet: "Sheet1"});

        async function downloadPDF(elementId, filename, isLandscape = null, docKey = null) {
            await window.ensureHtml2pdf();
            document.getElementById('loadingText').innerText = "Membuat PDF..."; document.getElementById('loadingOverlay').classList.remove('hidden');
            const element = document.getElementById(elementId);

            // Ganti sementara input/textarea/select di elemen ASLI dengan teks biasa (agar tidak terpotong di PDF),
            // lalu kembalikan lagi setelah PDF selesai dibuat. Tidak memakai kloning di luar layar
            // karena html2canvas sering gagal menangkap elemen yang diposisikan jauh di luar viewport.
            const fields = element.querySelectorAll('input, textarea, select');
            const restoreList = [];
            fields.forEach(orig => {
                const val = orig.value || "";
                const span = document.createElement('span');
                span.innerText = val === "" ? " " : val;
                span.style.fontFamily = 'inherit'; span.style.fontSize = 'inherit';
                orig.parentNode.replaceChild(span, orig);
                restoreList.push({ span, orig });
            });

            // Ambil Pengaturan Cetak (margin, ukuran kertas, orientasi, font, spasi) milik user.
            // Jika pemanggil fungsi secara eksplisit menentukan isLandscape (true/false) karena kebutuhan
            // layout dokumen tertentu (contoh: tabel lebar), pilihan itu tetap dihormati.
            // Jika tidak ditentukan (null), orientasi mengikuti Pengaturan Cetak milik user.
            const _ps = getPrintSettings(docKey);
            const _orient = (isLandscape === null || isLandscape === undefined) ? _ps.orientation : (isLandscape ? 'landscape' : 'portrait');
            const opt = { margin: getPrintMarginArray(_ps), filename: filename, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: getPrintPaperDims(_ps, _orient), orientation: _orient }, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } };

            // Terapkan sementara Ukuran Font & Spasi Baris milik user ke elemen ASLI sebelum
            // ditangkap html2canvas, lalu kembalikan lagi setelah PDF selesai dibuat.
            const _prevFontSize = element.style.fontSize;
            const _prevLineHeight = element.style.lineHeight;
            if (_ps.fontSize) element.style.fontSize = _ps.fontSize + 'pt';
            if (_ps.lineSpacing) element.style.lineHeight = _ps.lineSpacing;

            const restoreFields = () => {
                restoreList.forEach(({ span, orig }) => { if(span.parentNode) span.parentNode.replaceChild(orig, span); });
                element.style.fontSize = _prevFontSize;
                element.style.lineHeight = _prevLineHeight;
            };

            html2pdf().set(opt).from(element).save().then(() => {
                restoreFields();
                document.getElementById('loadingOverlay').classList.add('hidden');
            }).catch(() => {
                restoreFields();
                document.getElementById('loadingOverlay').classList.add('hidden');
            });
        }


	window.exportToWord = function(elementId, filename = 'document', isLandscape = null, docKey = null) {
    const content = document.getElementById(elementId);
    if (!content) return;

    // 1. Kloning elemen
    const cloneEl = content.cloneNode(true);

    // 1b. PENTING: buang style layout khusus tampilan layar (mis. "min-width:1000px" yang
    // sengaja dipasang di beberapa fitur tabel lebar seperti Struktur Kurikulum/Promes/KKTP
    // supaya bisa di-scroll horizontal di browser). Jika ikut terbawa ke file Word, style ini
    // memaksa lebar konten jadi lebih lebar dari halaman (apalagi saat Portrait), sehingga
    // Word "menyusutkan" tampilan & bikin sel/judul kop surat yang tadinya satu baris jadi
    // terpotong ke baris berikutnya. Untuk export Word, konten harus mengikuti lebar kertas.
    cloneEl.style.minWidth = '';
    cloneEl.style.maxWidth = '';
    cloneEl.style.width = '100%';
    cloneEl.style.overflowX = 'visible';
    cloneEl.querySelectorAll('[style*="min-width"]').forEach(el => { el.style.minWidth = ''; });

    // 1c. PERBAIKAN: Microsoft Word TIDAK mendukung "max-width" pada tabel (mis. tabel yang
    // di preview sengaja dibatasi "max-width:820px; margin:auto" agar tampil ramping & center,
    // seperti "Tabel Data Siswa" pada Blangko Absen). Karena diabaikan Word, tabel jadi melebar
    // penuh ke lebar kertas dan tidak rapi lagi dibanding preview. Di sini, setiap "max-width"
    // inline diubah jadi "width" yang setara (nilai pastinya, bukan batas atas) supaya Word
    // menghormatinya, dan atribut align="center" ditambahkan sebagai cara center tabel yang
    // lebih didukung Word dibanding "margin-left:auto; margin-right:auto" pada CSS biasa.
    cloneEl.querySelectorAll('[style*="max-width"]').forEach(el => {
        const mw = el.style.maxWidth;
        if (mw) {
            el.style.width = mw;
            el.style.maxWidth = '';
            if (el.tagName === 'TABLE' && (el.style.marginLeft === 'auto' || el.style.marginRight === 'auto')) {
                el.setAttribute('align', 'center');
            }
        }
    });

    // 2. KRUSIAL: Sinkronisasi data dari input/textarea asli ke elemen kloning
    // Karena cloneNode tidak menyalin nilai yang diketik user di input/textarea
    const originalInputs = content.querySelectorAll('input, textarea, select');
    const clonedInputs = cloneEl.querySelectorAll('input, textarea, select');
    
    originalInputs.forEach((original, index) => {
        const val = original.value || "";
        const replacement = document.createElement('span');
        replacement.innerText = val === "" ? " " : val;
        clonedInputs[index].parentNode.replaceChild(replacement, clonedInputs[index]);
    });

    // 3. Pembersihan Placeholder & Styling
    // PERBAIKAN: sebelumnya selector ini juga menyasar SEMUA elemen "td, span" dan memaksa
    // background-color-nya jadi transparent. Efeknya, warna sel yang memang sengaja diberi
    // (mis. warna kolom tanggal Libur Nasional/Kaldik/Akhir Pekan pada Blangko Absen, atau
    // warna shading header tabel di fitur-fitur lain) ikut terhapus setiap kali file Word
    // di-download, sehingga hasilnya tampak polos/berantakan dibanding preview. Placeholder
    // titik-titik (".......") tetap dibersihkan dari td/span seperti semula, tapi penghapusan
    // warna latar sekarang HANYA menyasar elemen yang memang berupa field contenteditable /
    // class highlight kuning saat hover (elemen input di layar), bukan seluruh sel tabel.
    cloneEl.querySelectorAll('[contenteditable], .hover\\:bg-yellow-100, td, span').forEach(el => {
        let text = el.innerText.trim();
        // Jika teks hanya titik-titik placeholder, bersihkan agar Word rapi
        if (text.includes('.......') || text === "................") {
            el.innerText = ""; 
        }
        el.removeAttribute('contenteditable');
    });
    cloneEl.querySelectorAll('[contenteditable], .hover\\:bg-yellow-100').forEach(el => {
        el.style.backgroundColor = 'transparent';
    });

    // 3c. Untuk ekspor Word fitur Promes: hapus warna latar sel minggu (hijau/biru)
    // agar hasil Word tampil bersih — warna hanya untuk tampilan layar/preview.
    if(docKey === 'promes') {
        cloneEl.querySelectorAll('[data-pw]').forEach(el => {
            el.style.backgroundColor = '';
        });
    }

    // 3b. PERBAIKAN: Microsoft Word tidak mendukung warna "rgba(...)" dengan alpha/transparansi
    // (dipakai luas di aplikasi ini untuk warna lembut kolom tanggal Libur Nasional/Kaldik/
    // Akhir Pekan, shading legenda, dsb). Saat file Word dibuka, warna rgba() ini dianggap
    // transparan sehingga tampak "hilang" walau HTML-nya sudah benar berisi warna tsb. Di sini
    // setiap "background-color: rgba(r,g,b,a)" diubah jadi warna solid setara (dicampur/blend
    // di atas latar putih) dalam format hex, yang didukung penuh oleh Word — berlaku untuk
    // SEMUA fitur yang memakai warna rgba(), bukan hanya Blangko Absen.
    cloneEl.querySelectorAll('[style*="rgba"]').forEach(el => {
        const styleAttr = el.getAttribute('style') || '';
        const newStyleAttr = styleAttr.replace(/background(-color)?:\s*rgba\(([^)]+)\)/gi, (match, dash, inner) => {
            const parts = inner.split(',').map(s => parseFloat(s.trim()));
            let [r, g, b, a] = parts;
            if (isNaN(a)) a = 1;
            // Blend warna rgba di atas latar putih agar jadi warna solid yang setara secara visual
            r = Math.round(r * a + 255 * (1 - a));
            g = Math.round(g * a + 255 * (1 - a));
            b = Math.round(b * a + 255 * (1 - a));
            const toHex = n => Math.max(0, Math.min(255, n)).toString(16).padStart(2, '0');
            return 'background-color:#' + toHex(r) + toHex(g) + toHex(b);
        });
        if (newStyleAttr !== styleAttr) el.setAttribute('style', newStyleAttr);
    });


    // 4. Penanganan Gambar/Logo: ukuran dibuat proporsional (tidak gepeng), DAN setiap gambar
    // base64 (mis. logo sekolah kiri/kanan di kop surat) diubah jadi lampiran MIME terpisah
    // yang dirujuk lewat "cid:" (lihat langkah 6). Sebelumnya gambar base64 ditulis langsung
    // di src="data:...", tapi Word (saat membuka file HTML-sebagai-.doc seperti ini) sering
    // GAGAL menampilkannya dan malah menganggapnya sebagai gambar tertaut dari file eksternal
    // yang "hilang" (ikon silang merah "The linked image cannot be displayed"). Dengan format
    // MHTML (multipart/related), gambar disisipkan sebagai lampiran biner di dalam file itu
    // sendiri — inilah cara yang benar-benar didukung Word untuk gambar yang ter-embed.
    const mimeParts = [];
    let _cidCounter = 0;
    const originalImgs = content.querySelectorAll('img');
    const clonedImgs = cloneEl.querySelectorAll('img');
    clonedImgs.forEach((img, idx) => {
        const orig = originalImgs[idx];
        const maxW = 90, maxH = 90; // px, kotak yang sama dgn logo di preview kop surat (90x90, object-fit:contain)
        let natW = (orig && orig.naturalWidth) ? orig.naturalWidth : maxW;
        let natH = (orig && orig.naturalHeight) ? orig.naturalHeight : maxH;
        // Skala proporsional supaya gambar PAS di dalam kotak maxW x maxH (mirip object-fit:contain),
        // bukan hanya mengunci lebar lalu tinggi bebas ikut rasio asli — ini yg tadinya bikin
        // logo kiri & kanan (rasio gambar asli beda) tampak tidak sebanding satu sama lain di Word.
        let scale = Math.min(maxW / natW, maxH / natH);
        let targetW = Math.round(natW * scale);
        let targetH = Math.round(natH * scale);
        img.style.width = targetW + 'px';
        img.style.height = targetH + 'px';
        img.style.objectFit = '';
        img.setAttribute('width', targetW);
        img.setAttribute('height', targetH);

        const src = img.getAttribute('src') || '';
        const m = src.match(/^data:([^;,]+)(?:;charset=[^;,]+)?;base64,([\s\S]*)$/);
        if (m) {
            _cidCounter++;
            const cid = 'mcimg' + _cidCounter + '_' + Date.now();
            mimeParts.push({ cid: cid, mimeType: m[1], base64Data: m[2].replace(/\s+/g, '') });
            img.setAttribute('src', 'cid:' + cid);
        }
    });

    // 5. Setting Page Orientation & Margin (mengikuti Pengaturan Cetak milik user,
    // kecuali pemanggil menentukan isLandscape secara eksplisit demi kebutuhan layout dokumen)
    const _psWord = getPrintSettings(docKey);
    const _orientWord = (isLandscape === null || isLandscape === undefined) ? _psWord.orientation : (isLandscape ? 'landscape' : 'portrait');
    const _dimsWord = getPrintPaperDims(_psWord, _orientWord);
    const _fontSizeWord = _psWord.fontSize || PRINT_SETTINGS_DEFAULT.fontSize;
    const _lineSpacingWord = _psWord.lineSpacing || PRINT_SETTINGS_DEFAULT.lineSpacing;

    // PENTING untuk kompatibilitas Microsoft Word: ukuran kertas/orientasi/margin hanya akan
    // benar-benar dipakai Word jika didefinisikan sebagai halaman "Section1" bernama (bukan
    // @page anonim) DAN dokumen ditandai sebagai dokumen Word (meta ProgId + XML <w:WordDocument>).
    // Tanpa ini, Word sering mengabaikan @page dan memakai ukuran/margin bawaan (biasanya
    // Portrait + margin default) — inilah sebab utama Portrait/Landscape dan margin yang sudah
    // diatur user di "Pengaturan Cetak" tidak sesuai saat file .doc dibuka di Word.
    const pageOrientation = `
        @page Section1 {
            size: ${_dimsWord[0]}mm ${_dimsWord[1]}mm;
            margin: ${_psWord.marginTop}mm ${_psWord.marginRight}mm ${_psWord.marginBottom}mm ${_psWord.marginLeft}mm;
            mso-page-orientation: ${_orientWord};
        }
        div.Section1 { page: Section1; }
    `;

    const preHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
            <meta charset='utf-8'>
            <meta name="ProgId" content="Word.Document">
            <meta name="Generator" content="Microsoft Word 15">
            <meta name="Originator" content="Microsoft Word 15">
            <!--[if gte mso 9]>
            <xml>
                <w:WordDocument>
                    <w:View>Print</w:View>
                    <w:Zoom>100</w:Zoom>
                    <w:DoNotOptimizeForBrowser/>
                </w:WordDocument>
            </xml>
            <![endif]-->
            <style>
                ${pageOrientation}
                body { font-family: 'Times New Roman', serif; font-size: ${_fontSizeWord}pt; line-height: ${_lineSpacingWord}; margin: 0; }
                table { border-collapse: collapse; width: 100%; border: 1px solid black; font-size: ${_fontSizeWord}pt; line-height: ${_lineSpacingWord}; }
                th, td { border: 1px solid black; padding: 5px; vertical-align: top; }
                .text-center { text-align: center; }
                tr { page-break-inside: avoid; mso-row-break-inside: avoid; }
                thead { display: table-header-group; }
                /* PENTING: banyak sel tabel (td/th) di berbagai fitur sudah punya font-size
                   inline (mis. style="font-size:10px") yang ditulis langsung sejak lama.
                   Inline style pada elemen selalu menang dibanding aturan CSS biasa di sini,
                   sehingga Ukuran Font pada Pengaturan Cetak milik user diabaikan saat dibuka
                   di Word. Menambahkan "!important" khusus untuk table/th/td membuat pengaturan
                   user benar-benar dipakai, tanpa perlu mengubah kode pembuatan tabel yang sudah ada. */
                table, table td, table th, td, th, .mc-footnote-block, .mc-footnote-block div { font-size: ${_fontSizeWord}pt !important; line-height: ${_lineSpacingWord} !important; }
            </style>
        </head>
        <body>
        <div class="Section1">`;

    const postHtml = "</div></body></html>";
    const htmlBody = preHtml + cloneEl.innerHTML + postHtml;

    // 6. Bangun file dalam format MHTML (multipart/related) jika ada gambar yang perlu di-embed,
    // supaya logo/gambar benar-benar tersimpan di dalam file .doc (bukan sekadar tertaut) dan
    // tetap tampil walau file dibuka di komputer lain / dipindahkan.
    let finalBlobParts;
    if (mimeParts.length > 0) {
        const boundary = '----=MyClassroomBoundary' + Date.now();
        let mhtml = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${boundary}"\r\n\r\n`;
        mhtml += `--${boundary}\r\n`;
        mhtml += `Content-Type: text/html; charset="utf-8"\r\n`;
        mhtml += `Content-Transfer-Encoding: 8bit\r\n\r\n`;
        mhtml += htmlBody + '\r\n\r\n';
        mimeParts.forEach(p => {
            mhtml += `--${boundary}\r\n`;
            mhtml += `Content-Type: ${p.mimeType}\r\n`;
            mhtml += `Content-Transfer-Encoding: base64\r\n`;
            mhtml += `Content-ID: <${p.cid}>\r\n\r\n`;
            mhtml += p.base64Data + '\r\n\r\n';
        });
        mhtml += `--${boundary}--`;
        finalBlobParts = [mhtml];
    } else {
        finalBlobParts = ['\ufeff', htmlBody];
    }

    const blob = new Blob(finalBlobParts, { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename + '.doc';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};



        function compressImageToBase64(file, maxWidth = 800) {
            return new Promise((resolve, reject) => {
                if(!file) return resolve(''); const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => { const img = new Image(); img.src = event.target.result; img.onload = () => { const canvas = document.createElement('canvas'); let scaleSize = 1; if (img.width > maxWidth) { scaleSize = maxWidth / img.width; } canvas.width = img.width * scaleSize; canvas.height = img.height * scaleSize; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); resolve(canvas.toDataURL(file.type || 'image/jpeg', 0.8)); } }; reader.onerror = error => reject(error);
            });
        }

        async function uploadFileToDrive(base64DataUrl, filename) {
            if(!base64DataUrl) return '';
            const mimeType  = base64DataUrl.split(';')[0].split(':')[1];
            const base64    = base64DataUrl.split(',')[1];
            const byteChars = atob(base64);
            const byteArr   = new Uint8Array(byteChars.length);
            for(let i = 0; i < byteChars.length; i++) byteArr[i] = byteChars.charCodeAt(i);
            const blob = new Blob([byteArr], { type: mimeType });
            const sc   = currentSchoolCode || getSafe('mc_last_school') || 'unknown';
            const ref  = fsStorage.ref('schools/' + sc + '/uploads/' + filename);
            await ref.put(blob);
            return await ref.getDownloadURL();
        }

        async function uploadModulFileToDrive(file) {
            // Upload file PDF/Word ke Firebase Storage
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const mimeType  = file.type;
                        const base64    = e.target.result.split(',')[1];
                        const byteChars = atob(base64);
                        const byteArr   = new Uint8Array(byteChars.length);
                        for(let i = 0; i < byteChars.length; i++) byteArr[i] = byteChars.charCodeAt(i);
                        const blob = new Blob([byteArr], { type: mimeType });
                        const sc   = currentSchoolCode || getSafe('mc_last_school') || 'unknown';
                        const ref  = fsStorage.ref('schools/' + sc + '/modul/' + file.name);
                        await ref.put(blob);
                        const url = await ref.getDownloadURL();
                        resolve(url);
                    } catch(err) { reject(err); }
                };
                reader.onerror = () => reject(new Error('Gagal membaca file'));
                reader.readAsDataURL(file);
            });
        }

        function syncToSheet(action, payload) {
            const map = FS_ACTION_MAP[action];
            if(!map) { console.warn('syncToSheet: action tidak dikenal:', action); return; }
            const col  = schoolCol(map.col);
            const data = payload;
            try {
                if(map.mode === 'set') {
                    const docId = String(data.id || data.username || data.batchId || Date.now());
                    col.doc(docId).set(data, { merge: true }).catch(e => console.log('FS sync error:', e));

                } else if(map.mode === 'delete') {
                    const docId = String(data.id || data.batchId || '');
                    if(docId) col.doc(docId).delete().catch(e => console.log('FS delete error:', e));

                } else if(map.mode === 'batch') {
                    const rows = data.rows || (Array.isArray(data) ? data : [data]);
                    const batch = fsDb.batch();
                    rows.forEach(row => {
                        const docId = String(row.id || row.batchId || Date.now() + Math.random());
                        batch.set(col.doc(docId), row, { merge: true });
                    });
                    batch.commit().catch(e => console.log('FS batch error:', e));

                } else if(map.mode === 'batch_delete') {
                    col.where('judul', '==', data.judul).get().then(snap => {
                        const b = fsDb.batch();
                        snap.docs.forEach(d => b.delete(d.ref));
                        return b.commit();
                    }).catch(e => console.log('FS batch_delete error:', e));
                }
            } catch(e) { console.log('syncToSheet error:', e); }
        }

        async function executeSync(isSilent = false) {
            if(!isSilent) { document.getElementById('loadingText').innerText = "Sinkronisasi..."; document.getElementById('loadingOverlay').classList.remove('hidden'); }
            const sc = currentSchoolCode || getSafe('mc_last_school') || '';
            if(!sc) { if(!isSilent) document.getElementById('loadingOverlay').classList.add('hidden'); return; }
            try {
                // Ambil semua collection sekolah secara paralel
                const colList = [
                    { key:'mc_users',               col:'users'       },
                    { key:'mc_students',             col:'students'    },
                    { key:'mc_nilai',                col:'nilai'       },
                    { key:'mc_absen',                col:'absen'       },
                    { key:'mc_tabungan',             col:'tabungan'    },
                    { key:'mc_saldo_guru',           col:'saldo_guru'  },
                    { key:'mc_dokumentasi',          col:'dokumentasi' },
                    { key:'mc_jadwal',               col:'jadwal'      },
                    { key:'mc_kalender',             col:'kalender'    },
                    { key:'mc_agenda',               col:'agenda'      },
                    { key:'mc_bank_soal',            col:'bank_soal'   },
                    { key:'mc_bank_modul',           col:'bank_modul'  },
                    { key:'mc_struktur',             col:'struktur'    },
                    { key:'mc_settings',             col:'settings'    },
                    { key:'mc_prota',                col:'prota'       },
                    { key:'mc_promes',               col:'promes'      },
                    { key:'mc_masterkurikulumbaru',  col:'kurikulum'   },
                ];
                const promises = colList.map(c =>
                    fsDb.collection('schools/' + sc + '/' + c.col).get()
                        .then(snap => ({ key: c.key, data: snap.docs.map(d => d.data()) }))
                );
                // cp_master adalah data global (tidak per-sekolah)
                promises.push(
                    fsDb.collection('cp_master').get()
                        .then(snap => ({ key: 'mc_cp_master', data: snap.docs.map(d => d.data()) }))
                );
                const results = await Promise.all(promises);
                results.forEach(r => saveDB(r.key, r.data));

                // Regenerasi kurikulum dari master (sama seperti sebelumnya)
                const masterBaru = getDB('mc_masterkurikulumbaru');
                if(masterBaru.length > 0) {
                    window.autoGenerateKurikulumDariMaster();
                }
                if(!isSilent) customAlert("Sinkronisasi database terbaru berhasil!", "success", "Sinkronisasi Selesai");
            } catch(error) {
                if(!isSilent) customAlert("Gagal Sinkronisasi. Periksa koneksi internet Anda.", "error", "Koneksi Bermasalah");
                console.log('executeSync error:', error);
            }
            if(!isSilent) document.getElementById('loadingOverlay').classList.add('hidden');
        }

        async function handleLogin() {
            const schoolCode = (document.getElementById('loginSchoolCode') ? document.getElementById('loginSchoolCode').value : '').trim().toUpperCase();
            const user = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const role = document.getElementById('loginRole').value;

            if (!schoolCode) { customAlert("Kode Sekolah wajib diisi!", "warning", "Kode Sekolah Kosong"); return; }

            document.getElementById('loadingText').innerText = "Memverifikasi Akun...";
            document.getElementById('loadingOverlay').classList.remove('hidden');
            currentSchoolCode = schoolCode;
            await executeSync(true);
            document.getElementById('loadingOverlay').classList.add('hidden');

            const usersDb = getDB('mc_users');
            const validUser = usersDb.find(u =>
                String(u.schoolCode || '').trim().toUpperCase() === schoolCode &&
                String(u.username).trim() === user &&
                String(u.password).trim() === pass &&
                u.role === role
            );

            if (!validUser) {
                currentSchoolCode = null;
                customAlert("Gagal Masuk! Kode Sekolah, Username, atau Password salah.", "error", "Login Gagal");
                return;
            }

            setSafe('mc_last_school', schoolCode);
            setSafe('mc_session', JSON.stringify({
                username: validUser.username,
                role: role,
                studentId: validUser.studentId || 1,
                namaLengkap: validUser.namaLengkap || validUser.username,
                schoolCode: schoolCode
            }));
            loadSession();

            try {
                if (typeof Android !== 'undefined' && Android !== null) {
                    Android.onLoginSuccess(user, pass, role);
                }
            } catch(e) {
                console.log('Android bridge error: ' + e);
            }
        }

                        <input type="file" id="importBackupFile" accept=".json,application/json" class="hidden" onchange="window.handleImportBackupFile(event)">
                        <button onclick="document.getElementById('importBackupFile').click()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition"><i class="fas fa-upload mr-2"></i> Import Back Up</button>
                    </div>
                </div>
            `;
        };

        window.downloadBackupData = function() {
            try {
                const allKeys = getAllAppDataKeys();
                const dataDump = {};
                allKeys.forEach(function(k){ dataDump[k] = getSafe(k); });
                const backupPayload = {
                    app: 'E-Pajar',
                    backupVersion: 1,
                    exportedAt: new Date().toISOString(),
                    schoolCode: (typeof currentSchoolCode !== 'undefined') ? currentSchoolCode : '',
                    exportedBy: (typeof currentUserUsername !== 'undefined') ? currentUserUsername : '',
                    data: dataDump
                };
                const jsonStr = JSON.stringify(backupPayload, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const pad = function(n){ return String(n).padStart(2,'0'); };
                const now = new Date();
                const tanggal = now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes());
                const kodeSekolah = ((typeof currentSchoolCode !== 'undefined') && currentSchoolCode) ? currentSchoolCode.replace(/[^a-zA-Z0-9]/g,'') : 'EPajar';
                const a = document.createElement('a');
                a.href = url;
                a.download = `BackUp_EPajar_${kodeSekolah}_${tanggal}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                customAlert('Back up berhasil diunduh. Simpan file ini di tempat yang aman.', 'success', 'Berhasil');
            } catch(e) {
                console.error(e);
                customAlert('Gagal membuat back up: ' + e.message, 'error');
            }
        };

        window.handleImportBackupFile = function(event) {
            const file = event.target.files && event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                let parsed;
                try { parsed = JSON.parse(e.target.result); } catch(err) {
                    customAlert('File back up tidak valid atau rusak.', 'error');
                    event.target.value = '';
                    return;
                }
                const dataDump = (parsed && parsed.data && typeof parsed.data === 'object') ? parsed.data : null;
                if(!dataDump) {
                    customAlert('Format file back up tidak dikenali.', 'error');
                    event.target.value = '';
                    return;
                }
                const jumlahData = Object.keys(dataDump).length;
                const isConfirm = await customConfirm(`File back up ditemukan berisi ${jumlahData} data (dibuat: ${parsed.exportedAt || '-'}). Seluruh data saat ini di perangkat ini akan DIGANTI dengan data dari file ini. Lanjutkan?`, 'Konfirmasi Import Back Up');
                event.target.value = '';
                if(!isConfirm) return;
                try {
                    Object.keys(dataDump).forEach(function(k){
                        const v = dataDump[k];
                        if(v === null || v === undefined) { rmSafe(k); }
                        else { setSafe(k, v); }
                    });
                    dbCache = {};
                    await customAlert('Import back up berhasil. Aplikasi akan dimuat ulang.', 'success', 'Berhasil');
                    location.reload();
                } catch(err) {
                    console.error(err);
                    customAlert('Gagal mengimpor back up: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        };

        // Ambil daftar model terkini + info token limit langsung dari Gemini ListModels API
        window._refreshAIModelList = async function() {
            const provider = window._currentAIProvider || window.getAIConfig().provider || 'gemini';
            const infoEl = document.getElementById('aiModelListInfo');
            const sel = document.getElementById('aiModelSelect');
            const btn = document.getElementById('aiRefreshModelBtn');
            if (provider !== 'gemini') {
                infoEl.innerHTML = '<span class="text-orange-500">Fitur refresh model otomatis saat ini hanya tersedia untuk provider Gemini.</span>';
                return;
            }
            const apiKey = (document.getElementById('aiApiKeyInput').value || '').trim();
            if (!apiKey) { customAlert('Masukkan API Key terlebih dahulu!', 'warning'); return; }
            const oldIcon = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;
            infoEl.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Mengambil daftar model dari Google AI...';
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                const d = await r.json();
                if (d.error) throw new Error(d.error.message || 'Gagal mengambil daftar model.');
                const models = (d.models || [])
                    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
                    .map(m => ({
                        id: (m.name || '').replace('models/', ''),
                        displayName: m.displayName || m.name,
                        inputTokenLimit: m.inputTokenLimit,
                        outputTokenLimit: m.outputTokenLimit
                    }));
                if (!models.length) throw new Error('Tidak ada model yang tersedia untuk API Key ini.');
                const currentVal = sel.value;
                sel.innerHTML = models.map(m => {
                    const tokenInfo = (m.inputTokenLimit && m.outputTokenLimit)
                        ? ` (in:${(m.inputTokenLimit/1000).toFixed(0)}k / out:${(m.outputTokenLimit/1000).toFixed(0)}k)`
                        : '';
                    return `<option value="${m.id}">${m.displayName}${tokenInfo}</option>`;
                }).join('');
                // Coba pertahankan pilihan model sebelumnya jika masih ada di list baru
                if ([...sel.options].some(o => o.value === currentVal)) sel.value = currentVal;
                infoEl.innerHTML = `<span class="text-green-600"><i class="fas fa-check-circle mr-1"></i>${models.length} model berhasil dimuat langsung dari API (lengkap dengan limit token input/output).</span>`;
            } catch(e) {
                infoEl.innerHTML = `<span class="text-red-600"><i class="fas fa-times-circle mr-1"></i>${e.message}</span>`;
            } finally {
                btn.innerHTML = oldIcon;
                btn.disabled = false;
            }
        };

        window.testKoneksiAI = async function() {
            const provider = window._currentAIProvider || window.getAIConfig().provider || 'gemini';
            const apiKey = (document.getElementById('aiApiKeyInput').value || '').trim();
            const model = document.getElementById('aiModelSelect').value;
            const resultEl = document.getElementById('aiTestResult');
            if (!apiKey) { customAlert('Masukkan API Key terlebih dahulu!', 'warning'); return; }
            resultEl.innerHTML = '<i class="fas fa-spinner fa-spin text-blue-500 mr-2"></i> Menguji koneksi...';
            try {
                let ok = false;
                if (provider === 'gemini') {
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                        { method:'POST', headers:{'Content-Type':'application/json'},
                          body: JSON.stringify({ contents:[{ parts:[{ text:'Halo, balas satu kata saja.' }] }] }) });
                    const d = await r.json();
                    if (d.error) throw new Error(d.error.message);
                    ok = !!(d.candidates?.[0]?.content?.parts?.[0]?.text);
                } else if (provider === 'groq' || provider === 'openai') {
                    const url = provider==='groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
                    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
                        body: JSON.stringify({ model, messages:[{role:'user',content:'Halo, balas satu kata saja.'}], max_tokens:10 }) });
                    const d = await r.json();
                    if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
                    ok = !!(d.choices?.[0]?.message?.content);
                } else if (provider === 'openrouter') {
                    const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method:'POST',
                        headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey,'HTTP-Referer':window.location.origin,'X-Title':'MyClassroom EPajar'},
                        body: JSON.stringify({ model, messages:[{role:'user',content:'Halo, balas satu kata saja.'}], max_tokens:10 }) });
                    const d = await r.json();
                    if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
                    ok = !!(d.choices?.[0]?.message?.content);
                } else if (provider === 'claude') {
                    const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST',
                        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
                        body: JSON.stringify({ model, max_tokens:10, messages:[{role:'user',content:'Halo, balas satu kata saja.'}] }) });
                    const d = await r.json();
                    if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
                    ok = !!(d.content?.[0]?.text);
                }
                if (ok) resultEl.innerHTML = '<i class="fas fa-check-circle text-green-600 mr-1"></i><span class="text-green-700">Koneksi berhasil! API Key valid.</span>';
                else throw new Error('Respon tidak terduga dari server.');
            } catch(e) {
                resultEl.innerHTML = `<i class="fas fa-times-circle text-red-600 mr-1"></i><span class="text-red-700">${e.message}</span>`;
            }
        };
        
        window.simpanPengaturan = async function() {

            let fKiri = document.getElementById('fileLogoKiri').files[0]; let fKanan = document.getElementById('fileLogoKanan').files[0];
            
            let settingsDb = getDB('mc_settings');
            let s = settingsDb.find(set => set.username === currentUserUsername) || {};
            let finalKiri = s.logoKiri || ''; let finalKanan = s.logoKanan || '';
            
            document.getElementById('loadingText').innerText = "Menyimpan Pengaturan..."; document.getElementById('loadingOverlay').classList.remove('hidden');
            try {
                // FIX CORS PDF: Simpan sebagai murni teks Base64 tanpa upload ke Google Drive.

                if(fKiri) { finalKiri = await compressImageToBase64(fKiri, 150); }
                if(fKanan) { finalKanan = await compressImageToBase64(fKanan, 150); }
                
                let data = { id: Date.now(), username: currentUserUsername, schoolCode: currentSchoolCode, skpd, sekolah, alamat, email, npsn, logoKiri: finalKiri, logoKanan: finalKanan, namaKepsek, nipKepsek, namaGuru, nipGuru };

        window.saveKurikulum = function() {
            // OPSI A: Simpan ke mc_masterkurikulumbaru
            let fase   = (document.getElementById('kFase').value || '').trim().toUpperCase();
            let mapel  = (document.getElementById('kMapel').value || '').trim();
            let elemen = (document.getElementById('kElemen').value || '').trim();
            let materi = (document.getElementById('kMateri').value || '').trim();
            let tp     = (document.getElementById('kTP').value || '').trim();
            let atp    = (document.getElementById('kATP').value || '').trim();
            let cp     = (document.getElementById('kCP').value || '').trim();
            let sem    = (document.getElementById('kSemester').value || '').trim();
            let kelas  = (document.getElementById('kKelas').value || '').trim();
            let ket    = (document.getElementById('kKeterangan').value || '').trim();

            if(!fase || !mapel || !tp) { customAlert("Fase, Mata Pelajaran, dan Tujuan Pembelajaran wajib diisi!", "warning"); return; }
            document.getElementById('loadingText').innerText = "Menyimpan Data Master...";
            document.getElementById('loadingOverlay').classList.remove('hidden');

            let master = getDB('mc_masterkurikulumbaru');
            if(editingKurikulumId) {
                // Update record yang ada
                let idx = master.findIndex(x => String(x.id) == String(editingKurikulumId));
                if(idx > -1) {
                    master[idx].Fase                    = fase;
                    master[idx].Matapelajaran           = mapel;
                    master[idx].elemen                  = elemen;
                    master[idx].capaianpembelajaran     = cp;
                    master[idx].tujuanpembelajaran      = tp;
                    master[idx].alurtujuanpembelajaran  = atp;
                    master[idx].materi                  = materi;
                    master[idx].semester                = sem;
                    master[idx].Kelas                   = kelas;
                    master[idx].Keterangan              = ket;
                    saveDB('mc_masterkurikulumbaru', master);
                    syncToSheet('update_masterkurikulum', master[idx]);
                }
                editingKurikulumId = null;
            } else {
                // Tambah record baru
                let newItem = {
                    id: Date.now(),
                    Fase: fase,
                    Matapelajaran: mapel,
                    elemen: elemen,
                    capaianpembelajaran: cp,
                    tujuanpembelajaran: tp,
                    alurtujuanpembelajaran: atp,
                    materi: materi,
                    semester: sem,
                    Kelas: kelas,
                    Keterangan: ket
                };
                master.push(newItem);
                saveDB('mc_masterkurikulumbaru', master);
                syncToSheet('tambah_masterkurikulum', newItem);
            }
            // Rebuild mc_kurikulum dari master yang sudah diupdate
            window.autoGenerateKurikulumDariMaster();
            document.getElementById('loadingOverlay').classList.add('hidden');
            customAlert("Data berhasil disimpan & mc_kurikulum diperbarui!", "success");
            renderGuruDatabase();
        }

        window.toggleKelasAktif = function(id) {
            let master = getDB('mc_masterkurikulumbaru');
            const idx = master.findIndex(x => String(x.id) === String(id));
            if (idx === -1) return;
            // Toggle: jika belum ada field aktif anggap aktif=true, lalu balik
            const wasAktif = master[idx].aktif === undefined || master[idx].aktif === null || master[idx].aktif === ''
                ? true
                : (master[idx].aktif === true || master[idx].aktif === 1
                   || String(master[idx].aktif).toLowerCase() === 'true'
                   || master[idx].aktif === '1');
            master[idx].aktif = !wasAktif;
            saveDB('mc_masterkurikulumbaru', master);
            // Update baris tabel langsung tanpa full re-render
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (row) {
                const newAktif = master[idx].aktif;
                const btn = row.querySelector('button[onclick*="toggleKelasAktif"]');
                if (btn) {
                    const icon = btn.querySelector('i');
                    if (icon) {
                        icon.className = newAktif ? 'fas fa-toggle-on' : 'fas fa-toggle-off';
                    }
                    btn.className = btn.className.replace(/text-(green|gray)-\d+/, newAktif ? 'text-green-500' : 'text-gray-400');
                    btn.title     = newAktif ? 'Aktif – klik untuk nonaktifkan' : 'Nonaktif – klik untuk aktifkan';
                }
                if (newAktif) { row.classList.remove('bg-gray-50', 'opacity-60'); }
                else          { row.classList.add('bg-gray-50', 'opacity-60'); }
            }
        };

            document.getElementById('loadingOverlay').classList.remove('hidden');
            // OPSI A: Hapus dari mc_masterkurikulumbaru
            let master = getDB('mc_masterkurikulumbaru').filter(item => String(item.id) != String(id));
            saveDB('mc_masterkurikulumbaru', master);
            syncToSheet('hapus_masterkurikulum', { id: id });
            if(String(editingKurikulumId) === String(id)) editingKurikulumId = null;
            // Rebuild mc_kurikulum setelah hapus
            window.autoGenerateKurikulumDariMaster();
            document.getElementById('loadingOverlay').classList.add('hidden');
            renderGuruDatabase();
        }

    if(mapels.length === 0) { container.innerHTML = '<span class="text-gray-400 text-xs italic">Tidak ada data untuk fase ini.</span>'; return; }

    // Setelah mapel diupdate, update juga opsi kelas jika mode kelas aktif
    window.updateTPATPKelasOptions();

// Filter daftar checkbox Mapel berdasarkan Kelas yang dipilih (mode Kelas)
// Hanya menampilkan mapel yang benar-benar punya TP di kelas tersebut
window.updateTPATPMapelByKelas = function() {
    let fase  = (document.getElementById('tpFase')  || {}).value;
    let kelas = (document.getElementById('tpKelas') || {}).value;
    let container = document.getElementById('tpMapelContainer');
    if(!container) return;
    if(!fase) {
        container.innerHTML = '<span class="text-gray-400 text-xs italic">Pilih Fase terlebih dahulu...</span>';
        return;
    }
    if(!kelas) {
        // Kelas belum dipilih → tampilkan semua mapel fase seperti biasa
        window.updateTPATPMapelByFase();
        return;
    }

    // Cari mapel yang punya TP di kelas ini dari mc_kurikulum (andal) atau carry-forward ATP
    let mcKur = getDB('mc_kurikulum');
    let mapelDariKurikulum = new Set(
        mcKur.filter(k => String(k.Kelas || '').trim() === kelas)
             .map(k => String(k.MataPelajaran || '').trim()).filter(Boolean)
    );

    // Fallback: jika mc_kurikulum kosong, deteksi via item.Kelas atau carry-forward ATP
    if(mapelDariKurikulum.size === 0) {
        let db = getDB('mc_masterkurikulumbaru').filter(item => item.Fase === fase);
        let lastKelas = '';
        db.forEach(function(item) {
            // Prioritas: field item.Kelas (GAS baru) → ATP regex carry-forward (GAS lama)
            let kl = String(item.Kelas || '').trim();
            if(kl) {
                lastKelas = kl;
            } else {
                let atpRaw = String(item.alurtujuanpembelajaran || '');
                let km = atpRaw.match(/Kelas\s+(\d+)/i);
                if(km) lastKelas = 'Kelas ' + km[1];
            }
            if(lastKelas === kelas && String(item.tujuanpembelajaran || '').trim()) {
                mapelDariKurikulum.add(String(item.Matapelajaran || '').trim());
            }
        });
    }

    // Filter: hanya mapel fase yang juga ada di kelas ini
    let db = getDB('mc_masterkurikulumbaru');
    let semuaMapelFase = [...new Set(
        db.filter(item => item.Fase === fase)
          .map(item => String(item.Matapelajaran || '').trim()).filter(Boolean)
    )].sort();

    let mapelFiltered = semuaMapelFase.filter(m => mapelDariKurikulum.has(m));

    if(mapelFiltered.length === 0) {
        container.innerHTML = '<span class="text-red-400 text-xs italic">Tidak ada mapel dengan TP untuk kelas ini.</span>';
        return;
    }
    container.innerHTML = mapelFiltered.map(m =>
        `<label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer py-1 hover:bg-gray-50 px-1 rounded">
            <input type="checkbox" class="cb-mapel-tpatp form-checkbox h-4 w-4 text-pink-600 rounded" value="${m}">
            <span>${m}</span>
        </label>`
    ).join('');
};

// Isi dropdown Kelas berdasarkan Fase yang dipilih (deteksi dari data ATP)
window.updateTPATPKelasOptions = function() {
    let kelasWrap = document.getElementById('tpKelasWrap');
    if(!kelasWrap || kelasWrap.classList.contains('hidden')) return;
    let fase = (document.getElementById('tpFase') || {}).value;
    let sel  = document.getElementById('tpKelas');
    if(!sel) return;
    if(!fase) { sel.innerHTML = '<option value="">-- Pilih Fase dulu --</option>'; return; }
    // Prioritas: ambil kelas unik dari mc_kurikulum (field Kelas eksplisit, lebih andal)
    // Fallback: carry-forward dari ATP field di masterkurikulumbaru (jika mc_kurikulum kosong)
    let mcKur = getDB('mc_kurikulum');
    let kelasSet = [];
    // Tentukan mapel-mapel yang termasuk fase ini untuk menyaring mc_kurikulum
    let faseMapels = new Set(
        getDB('mc_masterkurikulumbaru').filter(item => item.Fase === fase)
            .map(item => String(item.Matapelajaran || '').trim()).filter(Boolean)
    );
    mcKur.forEach(function(k) {
        let kl = String(k.Kelas || '').trim();
        if(kl && faseMapels.has(String(k.MataPelajaran || '').trim()) && !kelasSet.includes(kl)) kelasSet.push(kl);
    });
    if(kelasSet.length === 0) {
        // Fallback carry-forward jika mc_kurikulum belum ter-generate.
        // Prioritas: field item.Kelas (GAS baru) → ATP regex carry-forward (GAS lama)
        let db = getDB('mc_masterkurikulumbaru').filter(item => item.Fase === fase);
        let _lastKelasOpt = '';
        db.forEach(function(item) {
            let kl = String(item.Kelas || '').trim();
            if(kl) {
                _lastKelasOpt = kl;
            } else {
                let atpRaw = String(item.alurtujuanpembelajaran || '');
                let m = atpRaw.match(/Kelas\s+(\d+)/i);
                if(m) _lastKelasOpt = 'Kelas ' + m[1];
            }
            if(_lastKelasOpt && !kelasSet.includes(_lastKelasOpt)) kelasSet.push(_lastKelasOpt);
        });
    }
    kelasSet.sort(function(a,b){ return parseInt(a.match(/\d+/)||0) - parseInt(b.match(/\d+/)||0); });
    let prev = sel.value;
    sel.innerHTML = '<option value="">-- Pilih Kelas --</option>' +
        kelasSet.map(k => `<option value="${k}"${k===prev?' selected':''}>${k}</option>`).join('');
};

// AUTO-GENERATE (dipanggil saat sync selesai, tanpa UI)

window.autoGenerateKurikulumDariMaster = function() {
    let master = getDB('mc_masterkurikulumbaru');
    if(!master || master.length === 0) return;

    let newRows = [];
    let idCounter = Date.now();
    // Fix: carry-forward — "Kelas X" sebagai baris header (tanpa TP) tetap
    // mengupdate lastKelas1 sebelum baris TP berikutnya diproses.
    let lastKelas1 = '';
    // Carry-forward ATP (kolom G): sel merged di spreadsheet membuat baris lanjutan
    // ber-ATP kosong → baris tsb mewarisi ATP baris sebelumnya dalam mapel yang sama.
    let lastAtp1 = '';
    let lastMapel1 = '';

    master.forEach(function(item) {
        let mapel  = String(item.Matapelajaran || '').trim();
        let elemen = String(item.elemen || '').trim();
        let tp     = String(item.tujuanpembelajaran || '').trim();
        let materi = String(item.materi || elemen).trim();
        let atpRaw = String(item.alurtujuanpembelajaran || '');
        // Bersihkan label "Kelas X" di awal teks ATP (label kelas sudah jadi field tersendiri)
        let atpClean1 = atpRaw.replace(/^\s*Kelas\s+\d+[A-Za-z]?\s*[:.\-]?\s*/i, '').trim();
        // Ganti mapel → reset ATP agar tidak mewarisi ATP mapel sebelumnya
        if(mapel && mapel !== lastMapel1) { lastMapel1 = mapel; lastAtp1 = ''; }
        if(atpClean1) { lastAtp1 = atpClean1; }
        else if(/Kelas\s+\d+/i.test(atpRaw)) { lastAtp1 = ''; } // baris header "Kelas X" baru → reset
        // Prioritas: kolom J (Keterangan) → kolom I (semester) → fallback "Semester I"
        let semDflt = String(item.Keterangan || item.semester || 'Semester I').trim();

        // Ekstraksi kelas HARUS dilakukan sebelum return agar baris header
        // "Kelas X" (yang tidak punya TP) tetap mengupdate carry-forward.
        // Prioritas: field item.Kelas (dikirim langsung oleh GAS baru) → ATP regex carry-forward
        var _itemKelas1 = String(item.Kelas || '').trim();
        if(_itemKelas1) {
            lastKelas1 = _itemKelas1;
        } else {
            var _firstKelasMatch1 = atpRaw.match(/Kelas\s+(\d+)/i);
            if(_firstKelasMatch1) lastKelas1 = 'Kelas ' + _firstKelasMatch1[1];
        }

        if(!mapel || !tp) return;

        // Gunakan kelas dari ATP (carry-forward), bukan fallback seluruh Fase.
        // Ini mencegah TP Kelas 2 ikut masuk ke Kelas 1 karena fallback Fase A.
        let kelasList = lastKelas1 ? [lastKelas1] : [];
        if(kelasList.length === 0) {
            // Fallback hanya jika belum ada kelas carry-forward sama sekali
            var _faseMap = {'A':['Kelas 1','Kelas 2'],'B':['Kelas 3','Kelas 4'],'C':['Kelas 5','Kelas 6'],'D':['Kelas 7','Kelas 8','Kelas 9'],'E':['Kelas 10'],'F':['Kelas 11','Kelas 12']};
            var _faseChar = String(item.Fase || '').trim().toUpperCase().match(/([A-F])/);
            kelasList = _faseChar ? (_faseMap[_faseChar[1]] || []) : [];
            if(kelasList.length === 0) return;
        }

        kelasList.forEach(function(kelas) {
            newRows.push({
                id: idCounter++,
                Kelas: kelas,
                MataPelajaran: mapel,
                Semester: semDflt,
                Bab: elemen,
                MateriPokok: materi,
                Materi: materi,
                TujuanPembelajaran: tp,
                ATP: lastAtp1
            });
        });
    });

    if(newRows.length === 0) return;
    saveDB('mc_kurikulum', newRows);
    console.log('[MyClassroom] Auto-generate mc_kurikulum: ' + newRows.length + ' baris dari masterkurikulumbaru.');
};
