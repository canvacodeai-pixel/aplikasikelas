// Menyalin teks prompt LKPD ke clipboard
window.salinPromptLKPD = function() {
    const textarea = document.getElementById('hasilPromptLKPD');
    if (!textarea || !textarea.value) return;
    const btn = document.getElementById('btnSalinPrompt');
    const originalHTML = btn.innerHTML;

    const doSalin = () => {
        btn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
        btn.classList.remove('bg-purple-600', 'hover:bg-purple-700');
        btn.classList.add('bg-green-500');
        setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.classList.remove('bg-green-500');
            btn.classList.add('bg-purple-600', 'hover:bg-purple-700');
        }, 2000);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).then(doSalin).catch(() => {
            textarea.select();
            document.execCommand('copy');
            doSalin();
        });
    } else {
        textarea.select();
        document.execCommand('copy');
        doSalin();
    }
};

// Menampilkan SEMUA Bab/Materi untuk Kelas+Mapel terpilih sebagai checkbox (tanpa batas jumlah)
window.updateLkBabOptions = function() {
    const box = document.getElementById('lkBabOptions');
    if (!box) return;
    const k = document.getElementById('lkKelas') ? document.getElementById('lkKelas').value : '';
    const m = document.getElementById('lkMapel') ? document.getElementById('lkMapel').value : '';
    if (!k || !m) {
        box.innerHTML = '<p class="text-xs text-gray-400 italic">Pilih Kelas & Mapel terlebih dahulu untuk menampilkan daftar Bab/Materi.</p>';
        return;
    }
    const filteredDB = _getNormalizedKurikulumRows(k, m);
    const uniqueMateriSet = new Set();
    filteredDB.forEach(it => {
        // Tampilkan hanya materi (tanpa elemen) di tab Prompt LKPD
        const materi = (getMateriEsensial(it) || it.TujuanPembelajaran || '').trim();
        if (materi) uniqueMateriSet.add(materi);
    });
    const sortedBabs = Array.from(uniqueMateriSet).sort();
    if (sortedBabs.length === 0) {
        box.innerHTML = '<p class="text-xs text-gray-400 italic">Tidak ada data Bab/Materi untuk Kelas & Mapel ini.</p>';
        return;
    }
    box.innerHTML = sortedBabs.map(b => `
        <label class="flex items-start gap-2 text-xs font-semibold text-gray-700 cursor-pointer">
            <input type="checkbox" class="lkBabCheck mt-0.5 w-4 h-4 accent-purple-500" value="${b.replace(/"/g,'&quot;')}">
            <span>${b}</span>

};

function lkpdEmojiFor(nama) {
    if (!nama) return LKPD_EMOJI_BANK.default;
    const key = Object.keys(LKPD_EMOJI_BANK).find(k => nama.toLowerCase().includes(k));
    return key ? LKPD_EMOJI_BANK[key] : LKPD_EMOJI_BANK.default;
}
// Render n kali emoji benda (Fase 4: Layout Engine - "Render gambar = loop n kali")
function lkpdRenderGambarBerulang(nama, jumlah, maxTampil = 20) {
    const emoji = lkpdEmojiFor(nama);
    const n = Math.max(0, Math.min(parseInt(jumlah) || 0, maxTampil));
    let html = '';
    for (let i = 0; i < n; i++) html += `<span style="font-size:26px; margin:2px; display:inline-block;">${emoji}</span>`;
    return html;
}

window.aiRowKelasChange = function() {
    const k = document.getElementById('aiKelas1').value;
    const selMapel = document.getElementById('aiMapel1');
    selMapel.innerHTML = '<option value="">- Pilih -</option>';
    if (k) {
        let _aiMapels = [];
        const _mb = getDB('mc_masterkurikulumbaru') || [];
        if (_mb.length > 0) {
            const _rowsK = window._getKKTPRowsForKelas(_mb, k);
            _aiMapels = [...new Set(_rowsK.map(r => (r.Matapelajaran||r.matapelajaran||r.MataPelajaran||'').trim()).filter(Boolean))].sort();
        }
        // Fallback mc_kurikulum hanya jika masterBaru benar-benar kosong
        if (_aiMapels.length === 0 && _mb.length === 0) {
            const _dbK = getDB('mc_kurikulum') || [];
            _aiMapels = [...new Set(_dbK.filter(it => String(it.Kelas) === String(k)).map(it => it.MataPelajaran).filter(Boolean))].sort();
        }
        selMapel.innerHTML = '<option value="">- Pilih -</option>' + _aiMapels.map(m => `<option value="${m}">${m}</option>`).join('');
    }
    window.updateAiSemesterOptions();
};

window.aiRowMapelChange = function() {
    window.updateAiSemesterOptions();
};

// Helper: pilih/batal semua checkbox dalam container dengan class tertentu
window.aiCheckAll = function(cls) {
    document.querySelectorAll('.' + cls).forEach(cb => cb.checked = true);
    if (cls === 'aiATPCheck')   window._syncAiATPEditable();

window.aiUncheckAll = function(cls) {

    if (cls === 'aiMateriCheck') window._syncAiMateriEditable();
};

// Auto-resize textarea agar tingginya selalu pas dengan isi teks (tidak terpotong, tidak scroll)
window._autoResizeTextarea = function(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
};

// Sync isian textarea dari checkbox yang dicentang user, lalu resize otomatis
window._syncAiATPEditable = function() {
    const el = document.getElementById('aiATPEditable');
    if (!el) return;
    const vals = Array.from(document.querySelectorAll('.aiATPCheck:checked')).map(c => c.value);
    el.value = vals.join('\n');
    window._autoResizeTextarea(el);
};
window._syncAiMateriEditable = function() {
    const el = document.getElementById('aiMateriEditable');
    if (!el) return;
    const vals = Array.from(document.querySelectorAll('.aiMateriCheck:checked')).map(c => c.value);
    el.value = vals.join('\n');
    window._autoResizeTextarea(el);

// Helper: ambil nilai semester dari satu item kurikulum (support semua format field)
function _getItemSemester(item) {
    return String(item.Semester || item.semester || item.Keterangan || '').trim();
}

// Menampilkan pilihan Semester sebagai radio buttons setelah Kelas+Mapel dipilih
window.updateAiSemesterOptions = function() {
    const section = document.getElementById('aiSemesterSection');
    const box     = document.getElementById('aiSemesterOptions');
    if (!section || !box) return;
    const k = (document.getElementById('aiKelas1') || {}).value || '';
    const m = (document.getElementById('aiMapel1') || {}).value || '';
    if (!k || !m) {
        section.classList.add('hidden');
        window.updateAiTPOptions();
        return;
    }
    const filtered = _getNormalizedKurikulumRows(k, m);
    const semSet = new Set();
    filtered.forEach(it => { const s = _getItemSemester(it); if (s) semSet.add(s); });
    const semesters = Array.from(semSet).sort();
    section.classList.remove('hidden');
    if (semesters.length === 0) {
        box.innerHTML = '<p class="text-xs text-gray-400 italic">Tidak ada info semester — semua materi ditampilkan.</p>';
    } else {
        const opts = [''].concat(semesters); // '' = Semua Semester
        box.innerHTML = opts.map((s, i) => `
            <label class="flex items-center gap-2 cursor-pointer px-3 py-1.5 rounded-lg border-2 text-xs font-bold transition
                ${i === 0 ? 'border-orange-400 bg-orange-50 text-orange-700' : 'border-gray-200 bg-white text-gray-600'}"
                id="aiSemLbl_${i}">
                <input type="radio" name="aiSemFilter" class="aiSemCheck w-3.5 h-3.5 accent-orange-500"
                    value="${s}" ${i === 0 ? 'checked' : ''}
                    onchange="window._aiSemStyleUpdate(); window.updateAiTPOptions();">
                <i class="fas fa-calendar-alt text-[10px]"></i>
                ${s === '' ? 'Semua Semester' : s}
            </label>`).join('');
    }
    window.updateAiTPOptions();
};

// Update style label semester aktif
window._aiSemStyleUpdate = function() {
    document.querySelectorAll('[id^="aiSemLbl_"]').forEach(lbl => {
        const radio = lbl.querySelector('input[type=radio]');
        if (radio && radio.checked) {
            lbl.className = lbl.className.replace('border-gray-200 bg-white text-gray-600', 'border-orange-400 bg-orange-50 text-orange-700');
        } else {
            lbl.className = lbl.className.replace('border-orange-400 bg-orange-50 text-orange-700', 'border-gray-200 bg-white text-gray-600');
        }
    });
};

// Menampilkan SEMUA Bab/Materi untuk Kelas+Mapel+Semester terpilih sebagai checkbox
window.updateAiBabOptions = function() {
    const box = document.getElementById('aiBabOptions');
    if (!box) return;
    const k = (document.getElementById('aiKelas1') || {}).value || '';
    const m = (document.getElementById('aiMapel1') || {}).value || '';
    if (!k || !m) {
        box.innerHTML = '<p class="text-xs text-gray-400 italic">Pilih Kelas & Mapel terlebih dahulu untuk menampilkan daftar Bab/ATP.</p>';
        return;
    }
    const semTerpilih = (document.querySelector('.aiSemCheck:checked') || {}).value || '';
    const filteredDB = _getNormalizedKurikulumRows(k, m, semTerpilih);
    // Map: babVal → { display, semester }
    const uniqueBabsMap = new Map();
    filteredDB.forEach(it => {
        const babVal = (getBabField(it) || it.TujuanPembelajaran || '').trim();
        if (babVal && !uniqueBabsMap.has(babVal)) {
            const hasBabField = !!(it.Bab || it.bab || it['Bab/Materi'] || it.BAB);
            const materi = getMateriEsensial(it);
            const display = (hasBabField && materi && materi !== babVal) ? babVal + ' — ' + materi : babVal;
            const sem = _getItemSemester(it);
            uniqueBabsMap.set(babVal, { display, sem });
        }
    });
    const sortedBabs = Array.from(uniqueBabsMap.keys()).sort();
    if (sortedBabs.length === 0) {
        const msg = semTerpilih
            ? `Tidak ada Bab/ATP untuk <b>${semTerpilih}</b> pada Kelas & Mapel ini.`
            : 'Tidak ada data Bab/ATP untuk Kelas & Mapel ini.';
        box.innerHTML = `<p class="text-xs text-gray-400 italic">${msg}</p>`;
        return;
    }
    box.innerHTML = sortedBabs.map(b => {
        const { display, sem } = uniqueBabsMap.get(b);
        const semBadge = (!semTerpilih && sem) ? `<span class="ml-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-orange-100 text-orange-600">${sem}</span>` : '';
        return `
        <label class="flex items-start gap-2 text-xs font-semibold text-gray-700 cursor-pointer hover:bg-orange-50 rounded px-1 py-0.5">
            <input type="checkbox" class="aiBabCheck mt-0.5 w-4 h-4 accent-orange-500" value="${b.replace(/"/g,'&quot;')}">
            <span>${display}${semBadge}</span>
        </label>`;
    }).join('');
};

// Helper: ambil data kurikulum yang sudah difilter Kelas+Mapel+Semester
// Helper: ambil baris kurikulum (kelas+mapel) dari mc_masterkurikulumbaru (primary, via carry-forward)
// atau mc_kurikulum (fallback). Field dinormalisasi ke format mc_kurikulum agar getBabField,
// getMateriEsensial, dan field ATP/TujuanPembelajaran bekerja pada kedua sumber data.
function _getNormalizedKurikulumRows(kelas, mapel, semTerpilih) {
    if (!kelas || !mapel) return [];
    const masterBaru = getDB('mc_masterkurikulumbaru') || [];
    let rows = [];
    if (masterBaru.length > 0) {
        const rowsKelas = window._getKKTPRowsForKelas(masterBaru, kelas);
        const mapelLower = mapel.toLowerCase().trim();
        const rowsMapel = rowsKelas.filter(r => {
            const mp = (r.Matapelajaran||r.matapelajaran||r.MataPelajaran||'').trim();
            return mp.toLowerCase() === mapelLower;
        });
        // Normalisasi field ke format mc_kurikulum agar helper getBabField/getMateriEsensial bisa dipakai
        rows = rowsMapel.map(r => {
            const sem = String(r.Keterangan||r.semester||r.Semester||'').trim();
            const atpRaw = String(r.alurtujuanpembelajaran||'').trim();
            const atp = atpRaw.replace(/^\s*Kelas\s+\d+[A-Za-z]?\s*[:.\\-]?\s*/i, '').trim();
            const materi = String(r.materi||r.elemen||'').trim();
            return {
                Kelas: kelas,
                MataPelajaran: (r.Matapelajaran||r.matapelajaran||r.MataPelajaran||'').trim(),
                Semester: sem, Keterangan: sem,
                Bab: String(r.elemen||'').trim(),
                MateriPokok: materi, Materi: materi,
                TujuanPembelajaran: String(r.tujuanpembelajaran||'').trim(),
                ATP: atp, AlurTujuanPembelajaran: atp
            };
        });
    }
    // Fallback ke mc_kurikulum HANYA jika mc_masterkurikulumbaru benar-benar kosong.
    // Jika masterBaru ada tapi kelas/mapel tidak ditemukan di sana, kembalikan []
    // agar tidak terjadi false match dari mc_kurikulum yang mungkin punya field Kelas
    // rusak (semua baris ter-tag kelas yang sama → semua ATP/Materi muncul tanpa filter).
    if (rows.length === 0 && masterBaru.length === 0) {
        const mcKur = getDB('mc_kurikulum') || [];
        rows = mcKur.filter(it => String(it.Kelas) === String(kelas) && it.MataPelajaran === mapel);
    }
    // Filter semester jika ada pilihan semester
    if (semTerpilih && rows.length > 0) {
        rows = rows.filter(it => _getItemSemester(it) === semTerpilih);
    }
    return rows;
}

function _getAiFilteredKurikulum() {
    const k = (document.getElementById('aiKelas1') || {}).value || '';
    const m = (document.getElementById('aiMapel1') || {}).value || '';
    const semTerpilih = (document.querySelector('.aiSemCheck:checked') || {}).value || '';
    return { k, m, semTerpilih, filtered: _getNormalizedKurikulumRows(k, m, semTerpilih) };
}

// Menampilkan daftar ATP unik untuk Kelas+Mapel+Semester terpilih sebagai checkbox.
window.updateAiATPOptions = function() {
    const box = document.getElementById('aiATPOptions');
    if (!box) return;
    const { k, m, semTerpilih, filtered } = _getAiFilteredKurikulum();
    if (!k || !m) {
        box.innerHTML = '<p class="text-xs text-gray-400 italic">Pilih Kelas &amp; Mapel terlebih dahulu untuk menampilkan daftar ATP.</p>';
        return;
    }
    // Kumpulkan ATP unik
    const atpMap = new Map();
    filtered.forEach(it => {
        const atp = String(it.ATP || it.AlurTujuanPembelajaran || '').trim();
        if (!atp) return;

// Memanggil AI provider yang sudah dikonfigurasi (sama seperti fitur AI lain di aplikasi) untuk generate soal JSON.
async function _callAIProviderSoal(promptFinal, aiCfg) {
    const aiProvider = aiCfg.provider || 'gemini';
    const apiKey = aiCfg.apiKey || '';
    const modelName = aiCfg.model || 'gemini-2.5-flash';
    if (!apiKey) throw new Error('API Key AI belum diatur. Silakan atur di menu Pengaturan AI.');

    if (aiProvider === 'gemini') {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ contents:[{ parts:[{ text: promptFinal }] }], generationConfig: { maxOutputTokens: 8192 } })
        });
        const d = await r.json();
        if (d.error) throw new Error(d.error.message);
        // FIX: Gemini 2.5 menyertakan "thought" parts sebelum jawaban final.
        // Filter bagian thought, ambil teks dari part non-thought saja.
        const allParts = d.candidates?.[0]?.content?.parts || [];
        const answerText = allParts.filter(p => !p.thought).map(p => p.text || '').join('').trim();
        return answerText || '{}';
    } else if (aiProvider === 'groq' || aiProvider === 'openai') {
        const url = aiProvider === 'groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
        const r = await fetch(url, {
            method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({ model: modelName, messages:[{role:'user',content:promptFinal}], max_tokens:8192 })
        });
        const d = await r.json();
        if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
        return d.choices?.[0]?.message?.content || '{}';
    } else if (aiProvider === 'openrouter') {
        const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey,'HTTP-Referer':window.location.origin,'X-Title':'MyClassroom EPajar'},
            body: JSON.stringify({ model: modelName, messages:[{role:'user',content:promptFinal}], max_tokens:8192 })
        });
        const d = await r.json();
        if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
        return d.choices?.[0]?.message?.content || '{}';
    } else if (aiProvider === 'claude') {
        const r = await fetch('https://api.anthropic.com/v1/messages', {
            method:'POST',
            headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
            body: JSON.stringify({ model: modelName, max_tokens: 8192, messages:[{role:'user',content:promptFinal}] })
        });
        const d = await r.json();
        if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
        return d.content?.[0]?.text || '{}';
    }
    throw new Error('Provider AI tidak dikenali.');
}

// Coba generate gambar AI sesuai provider gambar yang dipilih user (Gemini / OpenAI / OpenRouter).
// gayaGambar: 'kartun' untuk karakter manusia, 'realistis' untuk objek/benda/hewan/tempat asli.
window._lastGambarAIError = '';
// Fallback paling akhir yang TIDAK PERNAH butuh API Key: Pollinations.ai.
// Dipakai otomatis kalau provider utama gagal/kosong, supaya soal bergambar tetap dapat gambar.
// Perkuat/perjelas deskripsi gambar sebelum dikirim ke image generator: kalau menyangkut
// bendera/simbol negara, pastikan nama negaranya eksplisit di prompt supaya AI gambar tidak
// asal memilih bendera negara lain hanya karena kata "flag" terlalu umum.
function _perjelasPromptGambar(promptGambar) {
    let p = (promptGambar || '').trim();
    const adaKataBendera = /\bflag\b/i.test(p) || /bendera/i.test(p);
    const adaIndonesia = /indonesia/i.test(p);
    if (adaKataBendera && adaIndonesia) {
        // Ganti frasa umum supaya deskripsi visual selalu eksplisit, tidak bergantung pada
        // AI image generator "menebak" bendera negara mana yang dimaksud.
        p += ', the official national flag of Indonesia only, exactly two horizontal stripes, solid red on top half and solid white on bottom half, no emblem, no stars, no crescent, no other symbols, not any other country flag';
    }
    return p;
}

function _urlGambarPollinations(promptGambar, gayaGambar) {
    const promptJelas = _perjelasPromptGambar(promptGambar);
    const gayaPrompt = gayaGambar === 'kartun'
        ? `cartoon illustration for elementary school children, bright colors, no text, accurately depicting exactly this description: ${promptJelas}`
        : `realistic educational photo illustration, natural lighting, no text, accurately depicting exactly this description: ${promptJelas}`;
    const safePrompt = encodeURIComponent(gayaPrompt);
    const randSeed = Math.floor(Math.random() * 1000000);
    return `https://image.pollinations.ai/prompt/${safePrompt}?width=512&height=512&nologo=true&model=flux&seed=${randSeed}`;
}

// Cari 1 foto asli dari Pixabay (butuh free API key). Cocok untuk hewan/tumbuhan/benda/tempat nyata.
async function _cariGambarPixabay(promptGambar, apiKey) {
    const keyword = encodeURIComponent(promptGambar.split(' ').slice(0, 4).join(' '));
    const r = await fetch(`https://pixabay.com/api/?key=${apiKey}&q=${keyword}&image_type=photo&safesearch=true&per_page=3`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const hit = d.hits && d.hits[0];
    if (hit && hit.webformatURL) return hit.webformatURL;
    return null;
}

async function _generateGambarAI(promptGambar, gayaGambar) {
    const imgCfg = window.getAiImgConfig();
    if (!imgCfg) {
        window._lastGambarAIError = 'Konfigurasi Provider Gambar AI tidak ditemukan.';
        return _urlGambarPollinations(promptGambar, gayaGambar);
    }

    // Provider Pollinations.ai: tidak perlu API Key, langsung bentuk URL gambar.
    if (imgCfg.provider === 'pollinations') {
        return _urlGambarPollinations(promptGambar, gayaGambar);
    }

    // Provider Pixabay: cari foto asli. Kalau tidak ketemu/gagal/key kosong, otomatis fallback ke Pollinations.
    if (imgCfg.provider === 'pixabay') {
        if (!imgCfg.apiKey) {
            window._lastGambarAIError = 'API Key Pixabay belum diisi, otomatis memakai Pollinations.ai sebagai gantinya.';
            return _urlGambarPollinations(promptGambar, gayaGambar);
        }
        try {
            const urlFoto = await _cariGambarPixabay(promptGambar, imgCfg.apiKey);
            if (urlFoto) return urlFoto;
            window._lastGambarAIError = 'Pixabay tidak menemukan foto yang cocok, otomatis memakai Pollinations.ai sebagai gantinya.';
        } catch (e) {
            window._lastGambarAIError = `Pixabay gagal (${e.message}), otomatis memakai Pollinations.ai sebagai gantinya.`;
        }
        return _urlGambarPollinations(promptGambar, gayaGambar);
    }

    if (!imgCfg.apiKey) {
        window._lastGambarAIError = 'API Key Provider Gambar AI belum diisi. Isi pada bagian "Provider & Model Gambar AI" di atas, atau pilih Pollinations.ai (gratis, tanpa API Key).';
        return _urlGambarPollinations(promptGambar, gayaGambar);
    }
    const hasil = await _generateGambarAIProviderLanjutan(imgCfg, promptGambar, gayaGambar);
    if (hasil) return hasil;
    // Provider lanjutan (Gemini/OpenAI/OpenRouter) gagal -> otomatis fallback ke Pollinations.ai
    // supaya soal bergambar tetap dapat gambar, bukan gagal diam-diam.
    const errorSebelumnya = window._lastGambarAIError;
    window._lastGambarAIError = `${errorSebelumnya || 'Provider gambar utama gagal'}. Otomatis memakai Pollinations.ai sebagai gantinya.`;
    return _urlGambarPollinations(promptGambar, gayaGambar);
}

async function _generateGambarAIProviderLanjutan(imgCfg, promptGambar, gayaGambar) {
    const promptGambarJelas = _perjelasPromptGambar(promptGambar);
    const gayaPrompt = gayaGambar === 'kartun'
        ? `Ilustrasi kartun/animasi anak-anak yang menarik dan ceria, gaya buku pelajaran sekolah dasar, warna cerah, tanpa teks, gambarkan PERSIS sesuai deskripsi berikut tanpa mengganti elemen apapun: ${promptGambarJelas}`
        : `Foto/ilustrasi realistis objek asli (bukan kartun), pencahayaan natural, gaya foto edukasi buku pelajaran, tanpa teks, gambarkan PERSIS sesuai deskripsi berikut tanpa mengganti elemen apapun: ${promptGambarJelas}`;

    try {
        if (imgCfg.provider === 'gemini') {
            // Endpoint yang benar untuk image generation Gemini (termasuk Nano Banana series):
            //   POST /v1beta/models/{model}:generateContent
            //   Body WAJIB snake_case: generation_config.response_modalities (bukan responseModalities)
            //   Endpoint /v1beta/interactions TIDAK dipakai — format body-nya berbeda & belum terdokumentasi publik.
            const kandidatModel = [imgCfg.model, ...AI_IMG_PROVIDERS.gemini.models.filter(m => m !== imgCfg.model)];
            for (const modelImg of kandidatModel) {
                try {
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelImg}:generateContent?key=${imgCfg.apiKey}`, {
                        method: 'POST', headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({
                            contents: [{ role: 'user', parts: [{ text: gayaPrompt }] }],
                            generation_config: { response_modalities: ['TEXT', 'IMAGE'] }
                        })
                    });
                    const d = await r.json();
                    if (d.error) {
                        // Deteksi quota habis: langsung hentikan loop (tidak ada gunanya coba model lain dengan key yang sama)
                        const isQuota = d.error.status === 'RESOURCE_EXHAUSTED' || (d.error.message || '').toLowerCase().includes('quota');
                        if (isQuota) {
                            window._lastGambarAIError = `[${modelImg}] ⚠️ Kuota API Key habis (free tier limit tercapai). Silakan tunggu beberapa menit, ganti API Key, atau upgrade ke paket berbayar di Google AI Studio (ai.google.dev).
Detail: ${d.error.message}`;
                            return null;
                        }
                        window._lastGambarAIError = `[${modelImg}] ${d.error.message || JSON.stringify(d.error)}`;
                        continue;
                    }
                    const parts = d.candidates?.[0]?.content?.parts || [];
                    const imgPart = parts.find(p => p.inlineData || p.inline_data);
                    const inline = imgPart ? (imgPart.inlineData || imgPart.inline_data) : null;
                    if (inline && inline.data) {
                        return `data:${inline.mimeType || inline.mime_type || 'image/png'};base64,${inline.data}`;
                    }
                    const textPart = parts.map(p => p.text).filter(Boolean).join(' ');
                    window._lastGambarAIError = `[${modelImg}] Model tidak mengembalikan data gambar.${textPart ? ` Respons teks: "${textPart.slice(0,300)}"` : ' (Kemungkinan model/API key belum punya akses image-generation.)'}`;
                } catch(eModel) {
                    window._lastGambarAIError = `[${modelImg}] ${eModel.message}`;
                }
            }
            return null;
        } else if (imgCfg.provider === 'openai') {
            const r = await fetch('https://api.openai.com/v1/images/generations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + imgCfg.apiKey },
                body: JSON.stringify({ model: imgCfg.model || 'gpt-image-1', prompt: gayaPrompt, n: 1, size: '1024x1024' })
            });
            const d = await r.json();
            if (d.error) { window._lastGambarAIError = d.error.message || JSON.stringify(d.error); return null; }
            const item = d.data?.[0];
            if (item?.b64_json) return `data:image/png;base64,${item.b64_json}`;
            if (item?.url) return item.url;
            window._lastGambarAIError = 'OpenAI tidak mengembalikan data gambar.';
            return null;
        } else if (imgCfg.provider === 'openrouter') {
            const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + imgCfg.apiKey, 'HTTP-Referer': window.location.origin, 'X-Title': 'MyClassroom EPajar' },
                body: JSON.stringify({ model: imgCfg.model || 'google/gemini-2.5-flash-image-preview', messages: [{ role: 'user', content: gayaPrompt }], modalities: ['image', 'text'] })
            });
            const d = await r.json();
            if (d.error) { window._lastGambarAIError = d.error.message || JSON.stringify(d.error); return null; }
            const msg = d.choices?.[0]?.message;
            const imgUrl = msg?.images?.[0]?.image_url?.url || msg?.images?.[0]?.url;
            if (imgUrl) return imgUrl;
            window._lastGambarAIError = 'OpenRouter tidak mengembalikan data gambar untuk model ini.';
            return null;
        }
        window._lastGambarAIError = 'Provider gambar AI tidak dikenali.';
        return null;
    } catch (e) {
        window._lastGambarAIError = e.message;
        return null;
    }
}

window.generateSoalAI = async function() {
    // Kumpulkan cakupan: 1 Kelas + 1 Mapel + ATP & Materi yang dicentang user
    const k = document.getElementById('aiKelas1') ? document.getElementById('aiKelas1').value : '';
    const m = document.getElementById('aiMapel1') ? document.getElementById('aiMapel1').value : '';
    if (!k || !m) { customAlert('Pilih Kelas & Mapel terlebih dahulu!', 'warning'); return; }

    // Ambil isian dari textarea editable (sudah otomatis terisi dari checkbox, bisa diedit user)
    const atpEditableEl    = document.getElementById('aiATPEditable');
    const materiEditableEl = document.getElementById('aiMateriEditable');
    const atpEditableText    = atpEditableEl    ? atpEditableEl.value.trim()    : '';
    const materiEditableText = materiEditableEl ? materiEditableEl.value.trim() : '';
    if (!atpEditableText && !materiEditableText) {
        customAlert('Pilih minimal 1 ATP atau Materi, atau isi kolom Materi/ATP secara manual sebelum generate!', 'warning');
        return;
    }

    // Bangun cakupan dari isian editable (sudah termasuk edit manual user)
    let cakupan = [{ kelas: k, mapel: m, bab: [atpEditableText, materiEditableText].filter(Boolean).join(' | ') }];

    const jmlPG = document.getElementById('aiJenisPG').checked ? (parseInt(document.getElementById('aiJmlPG').value) || 0) : 0;
    const jmlIsian = document.getElementById('aiJenisIsian').checked ? (parseInt(document.getElementById('aiJmlIsian').value) || 0) : 0;
    const jmlUraian = document.getElementById('aiJenisUraian').checked ? (parseInt(document.getElementById('aiJmlUraian').value) || 0) : 0;
    const totalSoal = jmlPG + jmlIsian + jmlUraian;
    if (totalSoal <= 0) { customAlert('Tentukan jumlah minimal 1 soal (PG/Isian/Uraian)!', 'warning'); return; }

    const nomorGambarRaw = (document.getElementById('aiNomorGambar').value || '').trim();
    const nomorGambar = nomorGambarRaw ? nomorGambarRaw.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n)) : [];

    const areaHasil = document.getElementById('areaHasilSoalAI');
    document.getElementById('loadingText').innerText = 'Sedang Menyusun Soal dengan AI...';
    document.getElementById('loadingOverlay').classList.remove('hidden');

    try {
        const aiCfg = window.getAIConfig();
        const cakupanText = `Kelas ${k}, Mata Pelajaran ${m}`;
        // Susun teks ATP dan Materi dari isian editable (bisa hasil edit manual user)
        const atpText    = atpEditableText    ? `ATP (Alur Tujuan Pembelajaran):\n${atpEditableText}`    : '';
        const materiText = materiEditableText ? `Materi:\n${materiEditableText}` : '';
        const tpText     = [atpText, materiText].filter(Boolean).join('\n\n');
        const gambarInstruksi = nomorGambar.length > 0
            ? `Soal nomor ${nomorGambar.join(', ')} WAJIB bergambar. Untuk setiap soal bergambar, isi field "promptGambar" (deskripsi objek gambar dalam Bahasa Inggris untuk AI image generator, HARUS detail dan spesifik, mencakup semua ciri penting yang disebut di soal — warna, jumlah, bentuk, jenis benda/hewan/tempat — supaya gambar yang dihasilkan benar-benar sesuai isi soal, bukan gambar generik). KHUSUS jika gambar terkait simbol negara/bendera: SELALU sebutkan nama negaranya secara eksplisit dan detail visualnya di promptGambar (contoh: untuk bendera Indonesia tulis "the national flag of Indonesia, two horizontal stripes, red on top and white on bottom, no emblem, no stars, no other country's flag"). Jangan gunakan kata "flag" atau "bendera" secara generik tanpa nama negara dan detail warnanya. Field "gayaGambar" diisi "kartun" jika gambar menampilkan karakter manusia, atau "realistis" jika objek di luar manusia (hewan, benda, tempat, alam, simbol negara, dsb). Soal nomor lain isi promptGambar dan gayaGambar dengan string kosong.`
            : 'Tidak ada soal yang bergambar pada permintaan ini. Isi promptGambar dan gayaGambar dengan string kosong untuk semua soal.';

        const prompt = `Anda adalah asisten guru yang membuat soal evaluasi untuk siswa Sekolah Dasar di Indonesia.
Cakupan Materi:
${cakupanText}

ATP & Materi yang harus dicakup:
${tpText}

Buatkan soal evaluasi dengan komposisi PERSIS seperti berikut, JANGAN diubah jenisnya:
${jmlPG > 0 ? `- Nomor 1 sampai ${jmlPG}: WAJIB tipe "PG" (Pilihan Ganda, opsi A, B, C saja, cukup 3 opsi untuk siswa SD)\n` : ''}${jmlIsian > 0 ? `- Nomor ${jmlPG + 1} sampai ${jmlPG + jmlIsian}: WAJIB tipe "Isian" (Isian singkat)\n` : ''}${jmlUraian > 0 ? `- Nomor ${jmlPG + jmlIsian + 1} sampai ${totalSoal}: WAJIB tipe "Uraian"\n` : ''}
Total harus tepat ${totalSoal} soal, tidak boleh kurang atau lebih, dan tipe tiap nomor harus sesuai rentang di atas — jangan mengubah soal Pilihan Ganda menjadi Isian/Uraian atau sebaliknya.
${gambarInstruksi}

PENTING: Jawab HANYA dengan JSON valid (tanpa markdown/backtick) berupa array objek, urut sesuai penomoran, dengan format persis:
[
  { "nomor": 1, "tipe": "PG", "soal": "...", "a": "...", "b": "...", "c": "...", "kunci": "A", "promptGambar": "", "gayaGambar": "" },
  { "nomor": 2, "tipe": "Isian", "soal": "...", "kunci": "...", "promptGambar": "", "gayaGambar": "" },
  { "nomor": 3, "tipe": "Uraian", "soal": "...", "kunci": "...", "promptGambar": "", "gayaGambar": "" }
]
Field "a","b","c" hanya diisi untuk tipe PG (kosongkan/hapus untuk tipe lain). Bahasa yang digunakan harus sesuai dengan tingkat pemahaman siswa SD, jelas dan tidak ambigu.`;

        const rawText = await _callAIProviderSoal(prompt, aiCfg);
        // Bersihkan markdown fence (case-insensitive untuk handle ```JSON uppercase)
        let cleanText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
        // Ekstrak blok array JSON dari dalam teks (handle preamble/postamble dari AI)
        const arrMatch = cleanText.match(/\[[\s\S]*\]/);
        if (arrMatch) cleanText = arrMatch[0];
        // Bersihkan trailing koma sebelum ] atau } (sering muncul dari output AI)
        cleanText = cleanText.replace(/,\s*([\]\}])/g, '$1');
        let soalArr;
        try {
            soalArr = JSON.parse(cleanText);
        } catch (e) {
            console.error('[BankSoalAI] Gagal parse JSON. Raw response:', rawText);
            throw new Error('Gagal membaca hasil AI (format tidak sesuai). Coba generate ulang.');
        }
        if (!Array.isArray(soalArr) || soalArr.length === 0) throw new Error('AI tidak menghasilkan soal. Coba generate ulang.');

        // PENTING: AI kadang salah menandai field "tipe" (mis. diminta 5 PG, tapi sebagian
        // dikembalikan tipe "Isian"/"Uraian"). Supaya komposisi hasil akhir SELALU sesuai
        // permintaan user, paksa tipe tiap soal berdasarkan urutan/posisi sesuai komposisi
        // yang diminta (jmlPG di awal, lalu jmlIsian, lalu jmlUraian) — bukan sekadar percaya
        // label "tipe" yang dikembalikan AI.
        const tipeUrutan = [];
        for (let i = 0; i < jmlPG; i++) tipeUrutan.push('PG');
        for (let i = 0; i < jmlIsian; i++) tipeUrutan.push('Isian');
        for (let i = 0; i < jmlUraian; i++) tipeUrutan.push('Uraian');
        if (soalArr.length !== tipeUrutan.length) {
            console.warn(`[BankSoalAI] Jumlah soal dari AI (${soalArr.length}) tidak sama dengan yang diminta (${tipeUrutan.length}). Tipe akan dipaksa semaksimal mungkin sesuai urutan.`);
        }
        soalArr.forEach((s, idx) => {
            const tipeSeharusnya = tipeUrutan[idx];
            if (!tipeSeharusnya) return; // soal lebih banyak dari yang diminta, biarkan tipe aslinya
            if (s.tipe !== tipeSeharusnya) {
                console.warn(`[BankSoalAI] Soal no.${s.nomor || idx + 1} dikoreksi dari tipe "${s.tipe}" menjadi "${tipeSeharusnya}" agar sesuai komposisi yang diminta.`);
            }
            s.tipe = tipeSeharusnya;
            // Kalau seharusnya PG tapi field opsi a/b/c tidak lengkap (AI salah format),
            // jangan dipaksakan tampil sebagai PG kosong — tandai agar mudah dikenali & diperbaiki manual.
            if (s.tipe === 'PG' && (!s.a || !s.b || !s.c)) {
                s.a = s.a || '(opsi tidak terisi, mohon lengkapi manual)';
                s.b = s.b || '(opsi tidak terisi, mohon lengkapi manual)';
                s.c = s.c || '(opsi tidak terisi, mohon lengkapi manual)';
            }
        });
        // Urutkan ulang berdasarkan nomor supaya rapi walau AI kadang tidak konsisten urutannya
        soalArr.sort((a, b) => (parseInt(a.nomor) || 0) - (parseInt(b.nomor) || 0));

        // Generate gambar untuk soal yang membutuhkan (jika ada), satu per satu agar tidak membebani API.
        let gambarGagal = 0, gambarDiminta = 0;
        for (const s of soalArr) {
            s.gambarUrl = '';
            if (s.promptGambar && s.promptGambar.trim() !== '') {
                gambarDiminta++;
                document.getElementById('loadingText').innerText = `Membuat Gambar Soal No. ${s.nomor}...`;
                const imgData = await _generateGambarAI(s.promptGambar, s.gayaGambar);
                if (imgData) { s.gambarUrl = imgData; } else { gambarGagal++; }
            }
        }

        aiSoalHasil = soalArr;
        window.renderHasilSoalAI();
        document.getElementById('loadingOverlay').classList.add('hidden');

        // Jika ada gambar yang diminta tapi gagal dibuat, beri tahu user alasannya (bukan gagal diam-diam)
        if (gambarDiminta > 0 && gambarGagal > 0) {
            customAlert(`Soal berhasil dibuat, tetapi ${gambarGagal} dari ${gambarDiminta} gambar gagal digenerate. Penyebab terakhir: ${window._lastGambarAIError || 'tidak diketahui'}`, 'warning');
        }
    } catch (err) {
        document.getElementById('loadingOverlay').classList.add('hidden');
        customAlert('Gagal generate soal: ' + err.message, 'error');
    }
};

// Render hasil soal AI ke area preview, mendukung layout 1 kolom / 2 kolom
// Dipanggil otomatis lewat onerror <img> kalau gambar soal gagal dimuat di browser
// (link Pixabay/Gemini/dsb kadaluarsa, diblokir hotlink, atau rusak). Gantikan dengan
// gambar dari Pollinations.ai (tidak pernah butuh API Key, jadi jaring pengaman paling akhir).
window._fixGambarSoalAI = function(imgEl, idx) {
    if (imgEl.dataset.fixed === '1') return; // Cegah loop tak berhenti kalau Pollinations pun gagal dimuat
    imgEl.dataset.fixed = '1';
    const s = aiSoalHasil && aiSoalHasil[idx];
    const promptGambar = (s && s.promptGambar) ? s.promptGambar : 'ilustrasi soal sekolah';
    const gayaGambar = (s && s.gayaGambar) ? s.gayaGambar : 'kartun';
    const urlBaru = _urlGambarPollinations(promptGambar, gayaGambar);
    imgEl.src = urlBaru;
    if (s) s.gambarUrl = urlBaru; // supaya kalau disimpan ke Bank Soal, yang tersimpan adalah gambar yang benar-benar berhasil
};

// Generate ulang gambar untuk 1 nomor soal tertentu di hasil Soal AI (tombol "Refresh Gambar").
// Hanya mengubah aiSoalHasil[idx].gambarUrl lalu render ulang preview — TIDAK menyentuh
// window._buildPrintHTMLSoalAI, jadi tombol ini murni fitur di layar dan otomatis tidak
// pernah ikut terdownload ke PDF/Word (kedua fungsi export itu membangun HTML sendiri dari
// aiSoalHasil tanpa elemen tombol apapun).
window.refreshGambarSoalAI = async function(idx) {
    const s = aiSoalHasil && aiSoalHasil[idx];
    if (!s) return;
    const promptGambar = s.promptGambar && s.promptGambar.trim() !== '' ? s.promptGambar : 'ilustrasi soal sekolah';
    const gayaGambar = s.gayaGambar || 'kartun';

    const btn = document.getElementById(`btnRefreshGambarSoalAI-${idx}`);
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Membuat ulang...'; }

    try {
        const imgData = await _generateGambarAI(promptGambar, gayaGambar);
        if (imgData) {
            s.gambarUrl = imgData;
            window.renderHasilSoalAI();
        } else {
            customAlert('Gagal membuat ulang gambar: ' + (window._lastGambarAIError || 'tidak diketahui'), 'error');
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh Gambar'; }
        }
    } catch (e) {
        customAlert('Gagal membuat ulang gambar: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh Gambar'; }
    }
};

window.renderHasilSoalAI = function() {
    const area = document.getElementById('areaHasilSoalAI');
    if (!area) return;
    if (!aiSoalHasil || aiSoalHasil.length === 0) { area.classList.add('hidden'); return; }

    const renderSatuSoal = (s, idx) => {
        let imgHtml = s.gambarUrl
            ? `<div class="my-2 relative inline-block no-print">
                <img src="${s.gambarUrl}" alt="Gambar Soal" onerror="window._fixGambarSoalAI(this, ${idx})" class="rounded-lg border border-blue-100 shadow-sm block" style="max-height:180px; max-width:100%; object-fit:contain;">
                <button type="button" onclick="window.refreshGambarSoalAI(${idx})" id="btnRefreshGambarSoalAI-${idx}" title="Buat ulang gambar ini" class="mt-1 flex items-center gap-1 text-[11px] font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-md border border-blue-200 transition">
                    <i class="fas fa-sync-alt"></i> Refresh Gambar
                </button>
              </div>`
            : '';
        let opsiHtml = '';
        if (s.tipe === 'PG') {
            const opsi = [['A', s.a], ['B', s.b], ['C', s.c]];
            opsiHtml = `<div class="mt-2 space-y-1">${opsi.filter(o => o[1]).map(o => `
                <div class="flex items-center gap-2 px-2 py-1 rounded-md text-sm bg-gray-50 border border-gray-100">
                    <span class="font-bold w-5 h-5 flex items-center justify-center rounded-full text-xs bg-gray-200 text-gray-600 flex-shrink-0">${o[0]}</span>
                    <span class="flex-1 text-gray-700">${o[1]}</span>
                </div>`).join('')}</div>`;
        }
        return `<div class="p-3 bg-white border border-orange-100 rounded-xl shadow-sm mb-3 break-inside-avoid">
            <div class="flex items-start gap-2">
                <span class="font-bold text-orange-500 text-base mt-0.5 min-w-[20px] flex-shrink-0">${s.nomor || idx + 1}.</span>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-800 leading-snug">${s.soal || ''}</p>
                    ${imgHtml}${opsiHtml}
                    <span class="inline-block mt-2 bg-orange-50 text-orange-500 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase">${s.tipe}</span>
                </div>
            </div>
        </div>`;
    };

    const kolomClass = aiSoalLayout === '2' ? 'columns-1 md:columns-2 gap-6' : 'columns-1';
    const bodyHtml = `<div class="${kolomClass}">${aiSoalHasil.map((s, idx) => renderSatuSoal(s, idx)).join('')}</div>`;

    area.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h3 class="font-bold text-gray-800 text-sm flex items-center gap-2"><i class="fas fa-check-circle text-green-500"></i> Hasil Generate Soal (${aiSoalHasil.length} Soal)</h3>
            <div class="flex gap-2 flex-wrap">
                ${btnPengaturanCetak('soalai', 'Naskah Soal AI')}
                <button onclick="window.downloadPDFSoalAI()" class="bg-red-600 text-white font-bold px-4 py-2 rounded-lg text-xs shadow hover:bg-red-700 transition">
                    <i class="fas fa-file-pdf mr-1"></i> Download PDF
                </button>
                <button onclick="window.downloadWordSoalAI()" class="bg-blue-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow hover:bg-blue-800 transition">
                    <i class="fas fa-file-word mr-1"></i> Download Word
                </button>
                <button onclick="window.simpanSemuaSoalAIKeBank()" class="bg-green-600 text-white font-bold px-4 py-2 rounded-lg text-xs shadow hover:bg-green-700 transition">
                    <i class="fas fa-save mr-1"></i> Simpan Semua ke Bank Soal
                </button>
            </div>
        </div>
        ${bodyHtml}`;
    area.classList.remove('hidden');
};

// Susun HTML naskah soal AI yang rapi: Kop Surat + Judul + Identitas, sama seperti tab Pakai Soal,
// dipakai bersama oleh Download PDF dan Download Word supaya hasilnya konsisten.
window._buildPrintHTMLSoalAI = function() {
    if (!aiSoalHasil || aiSoalHasil.length === 0) return '';
    const g = (id) => document.getElementById(id);
    const ident = {
        judul: (g('aigJudul') && g('aigJudul').value) || 'LATIHAN SOAL',
        tahun: (g('aigTahun') && g('aigTahun').value) || '',
        waktu: (g('aigWaktu') && g('aigWaktu').value) || '',
        tanggal: (g('aigTanggal') && g('aigTanggal').value) || '',
        mapel: (g('aigMapelText') && g('aigMapelText').value) || (g('aiMapel1') && g('aiMapel1').value) || '',
        kelas: (g('aigKelasText') && g('aigKelasText').value) || (g('aiKelas1') && g('aiKelas1').value) || '',
    };
    const tampilIdentitas = g('aigTampilIdentitas') ? g('aigTampilIdentitas').checked : true;
    const tampilKunci = g('aigTampilKunci') ? g('aigTampilKunci').checked : false;

    const htmlKop = window.getKopSurat();

    const htmlJudul = `
        <div style="text-align:center;margin:10px 0 12px;font-family:'Arial', sans-serif;">
            <div style="font-size:12pt;font-weight:bold;text-transform:uppercase;">${ident.judul}</div>
            ${ident.tahun ? `<div style="font-size:11pt;font-weight:bold;text-transform:uppercase;">TAHUN PELAJARAN ${ident.tahun}</div>` : ''}
        </div>`;

    const htmlIdentitasPeserta = tampilIdentitas ? `
        <table style="width:100%;font-family:'Arial', sans-serif;font-size:10pt;margin-bottom:10px;border-collapse:collapse;">
            <tr>
                <td style="width:25%;padding:3px 0;">Nama</td>
                <td style="width:2%;">:</td>
                <td style="width:45%;border-bottom:1px solid #000;padding:3px 0;">&nbsp;</td>
                <td style="width:13%;padding:3px 0;">Kelas</td>
                <td style="width:2%;">:</td>
                <td style="border-bottom:1px solid #000;padding:3px 0;">&nbsp;</td>
            </tr>
            <tr>
                <td style="padding:3px 0;">Mata Pelajaran</td>
                <td>:</td>
                <td style="border-bottom:1px solid #000;padding:3px 0;">&nbsp;</td>
                <td style="padding:3px 0;">No. Urut</td>
                <td>:</td>
                <td style="border-bottom:1px solid #000;padding:3px 0;">&nbsp;</td>
            </tr>
        </table>` : '';

    const htmlInfoSoal = `
        <table style="width:100%;font-family:'Arial', sans-serif;font-size:9pt;margin-bottom:8px;border-collapse:collapse;">
            <tr>
                <td style="width:30%;">Mata Pelajaran</td><td style="width:2%;">:</td><td style="font-weight:bold;">${ident.mapel}</td>
                <td style="width:20%;text-align:right;">Hari/Tanggal</td><td style="width:2%;">:</td><td>${ident.tanggal}</td>
            </tr>
            <tr>
                <td>Kelas</td><td>:</td><td style="font-weight:bold;">${ident.kelas}</td>
                <td style="text-align:right;">Waktu</td><td>:</td><td>${ident.waktu ? ident.waktu + ' menit' : ''}</td>
            </tr>
        </table>
        <div style="border:1px solid #ccc;background:#fffbf0;padding:6px 10px;font-size:8.5pt;font-family:'Arial', sans-serif;margin-bottom:10px;">
            <strong>Petunjuk Umum:</strong> Jawablah pertanyaan berikut dengan teliti dan jujur!
        </div>`;

    let htmlSoal = '';
    aiSoalHasil.forEach((s, i) => {
        const imgTag = (s.gambarUrl && s.gambarUrl.trim())
            ? `<div style="margin:4px 0;"><img src="${s.gambarUrl}" style="max-height:100px;max-width:220px;object-fit:contain;border:1px solid #ddd;border-radius:4px;display:block;"></div>`
            : '';
        if (s.tipe === 'PG') {
            const kunciOpt = String(s.kunci || '').toUpperCase();
            const opsiMap = { a: s.a, b: s.b, c: s.c };
            const mkCell = (l) => {
                if (!opsiMap[l] || !opsiMap[l].trim()) return '<td style="width:48%;padding:1px 4px;"></td>';
                const isBold = tampilKunci && l.toUpperCase() === kunciOpt;
                return `<td style="width:48%;padding:1px 4px;vertical-align:top;">${isBold ? '<strong>' : ''}${l.toUpperCase()}. ${opsiMap[l]}${isBold ? '</strong>' : ''}</td>`;
            };
            const gap = '<td style="width:4%;"></td>';
            const tableRows = `<tr>${mkCell('a')}${gap}${mkCell('c')}</tr><tr>${mkCell('b')}${gap}<td style="width:48%;"></td></tr>`;
            htmlSoal += `<div style="margin-bottom:10px;page-break-inside:avoid;">
                <div style="font-family:'Arial', sans-serif;"><strong>${s.nomor || i + 1}.</strong> ${s.soal || ''}</div>
                ${imgTag}
                <table style="width:100%;border-collapse:collapse;font-family:'Arial', sans-serif;margin-top:3px;">${tableRows}</table>
            </div>`;
        } else {
            const garisJawab = ('<div style="border-bottom:1px solid #aaa;height:18px;margin:4px 0;"></div>').repeat(s.tipe === 'Uraian' ? 3 : 1);
            const kunciHtml = tampilKunci ? `<span style="color:#16a34a;font-weight:bold;">[Kunci: ${s.kunci || ''}]</span>` : '';
            htmlSoal += `<div style="margin-bottom:12px;font-family:'Arial', sans-serif;page-break-inside:avoid;">
                <div><strong>${s.nomor || i + 1}.</strong> ${s.soal || ''} ${kunciHtml}</div>
                ${imgTag}${garisJawab}
            </div>`;
        }
    });

    return htmlKop + htmlJudul + htmlInfoSoal + htmlIdentitasPeserta + htmlSoal;
};

window.downloadPDFSoalAI = function() {
    const html = window._buildPrintHTMLSoalAI();
    if (!html) { customAlert('Generate soal terlebih dahulu!', 'warning'); return; }
    window._printHTMLSoalAI = html;

    document.getElementById('loadingText').innerText = 'Menyiapkan Dokumen...';
    document.getElementById('loadingOverlay').classList.remove('hidden');

    let iframe = document.getElementById('printFrameSoalAI');
    if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'printFrameSoalAI';
        iframe.style.cssText = 'position:fixed; right:0; bottom:0; width:0; height:0; border:0; z-index:-1;';
        document.body.appendChild(iframe);
    }

    let doc = iframe.contentWindow.document;
    doc.open();
    const _psSoalAI = getPrintSettings('soalai');
    const _fsSoalAI = _psSoalAI.fontSize || PRINT_SETTINGS_DEFAULT.fontSize;
    const _lsSoalAI = _psSoalAI.lineSpacing || PRINT_SETTINGS_DEFAULT.lineSpacing;
    doc.write(`
        <html>
        <head>
            <title>Naskah_Soal_AI</title>
            <style>
                ${buildPageCSS(_psSoalAI)}
                body { font-family: Arial, sans-serif; font-size: ${_fsSoalAI}pt; line-height: ${_lsSoalAI}; color: black; background: white; }
                table { border-collapse: collapse; width: 100%; font-size: ${_fsSoalAI}pt; line-height: ${_lsSoalAI}; }
                td { vertical-align: top; }
                img { max-width: 100%; height: auto; }
                tr { page-break-inside: avoid; }
                thead { display: table-header-group; }
                table, table td, table th, td, th { font-size: ${_fsSoalAI}pt !important; line-height: ${_lsSoalAI} !important; }
            </style>
        </head>
        <body>
            ${window._printHTMLSoalAI}
        </body>
        </html>
    `);
    doc.close();

    // Beri waktu agar gambar dari internet (Pollinations/Pixabay/dsb) termuat sempurna sebelum dicetak
    setTimeout(() => {
        document.getElementById('loadingOverlay').classList.add('hidden');
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
    }, 1500);
};

window.downloadWordSoalAI = function() {
    const html = window._buildPrintHTMLSoalAI();
    if (!html) { customAlert('Generate soal terlebih dahulu!', 'warning'); return; }
    window._printHTMLSoalAI = html;

    const tmpDiv = document.createElement('div');
    tmpDiv.innerHTML = window._printHTMLSoalAI;

    // Atur ukuran gambar ILUSTRASI SOAL (link http/https dari Pollinations/Pixabay/dsb) agar
    // proporsional & rapi di Word. Logo kop surat (src="data:...") TIDAK disentuh di sini —
    // ukurannya sudah diatur sendiri oleh getKopSurat() (width/height 90px) dan kalau dipaksa
    // 80x80 di sini akan gepeng karena rasio logo kiri/kanan biasanya berbeda.
    tmpDiv.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || '';
        if (src.startsWith('data:')) return;
        img.style.cssText = 'width:80px; height:80px; object-fit:contain; display:inline-block;';
        img.setAttribute('width', '80');
        img.setAttribute('height', '80');
    });

    // PENTING: Microsoft Word GAGAL menampilkan gambar base64 yang ditulis langsung di
    // src="data:..." (dianggap gambar tertaut yang "hilang", muncul ikon silang merah) —
    // ini sebab logo sekolah/dinas di kop surat tidak muncul. Sama seperti window.exportToWord()
    // (dipakai fitur Struktur Kurikulum dkk), setiap gambar base64 di sini diubah jadi lampiran
    // MIME terpisah yang dirujuk lewat "cid:" (format MHTML/multipart-related), yang benar-benar
    // didukung Word untuk gambar ter-embed.
    const mimeParts = [];
    let _cidCounterSoalAI = 0;
    tmpDiv.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || '';
        const m = src.match(/^data:([^;,]+)(?:;charset=[^;,]+)?;base64,([\s\S]*)$/);
        if (m) {
            _cidCounterSoalAI++;
            const cid = 'mcsoalai' + _cidCounterSoalAI + '_' + Date.now();
            mimeParts.push({ cid: cid, mimeType: m[1], base64Data: m[2].replace(/\s+/g, '') });
            img.setAttribute('src', 'cid:' + cid);
        }
    });

    const cleanHtml = tmpDiv.innerHTML;

    const _psWordSoalAI = getPrintSettings('soalai');
    const _fsWordSoalAI = _psWordSoalAI.fontSize || PRINT_SETTINGS_DEFAULT.fontSize;
    const _lsWordSoalAI = _psWordSoalAI.lineSpacing || PRINT_SETTINGS_DEFAULT.lineSpacing;
    const wordHtml = `
        <html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns:m="http://schemas-microsoft.com/office/2004/12/omml" xmlns="http://www.w3.org/TR/REC-html40">
        <head>
            <meta charset="utf-8">
            <title>Naskah Soal AI</title>
            <style>
                ${buildPageCSS(_psWordSoalAI)}
                body { font-family: 'Times New Roman', serif; font-size: ${_fsWordSoalAI}pt; line-height: ${_lsWordSoalAI}; color: #000; }
                table { border-collapse: collapse; width: 100%; font-size: ${_fsWordSoalAI}pt; line-height: ${_lsWordSoalAI}; }
                td { vertical-align: top; }
                tr { page-break-inside: avoid; mso-row-break-inside: avoid; }
                thead { display: table-header-group; }
                table, table td, table th, td, th { font-size: ${_fsWordSoalAI}pt !important; line-height: ${_lsWordSoalAI} !important; }
            </style>
        </head>
        <body>${cleanHtml}</body>
        </html>
    `;

    // Kalau ada logo (gambar base64) yang perlu di-embed, bungkus jadi MHTML (multipart/related)
    // seperti window.exportToWord(). Kalau tidak ada logo sama sekali, format lama tetap dipakai.
    let finalBlobPartsSoalAI;
    if (mimeParts.length > 0) {
        const boundarySoalAI = '----=MyClassroomBoundarySoalAI' + Date.now();
        let mhtmlSoalAI = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${boundarySoalAI}"\r\n\r\n`;
        mhtmlSoalAI += `--${boundarySoalAI}\r\n`;
        mhtmlSoalAI += `Content-Type: text/html; charset="utf-8"\r\n`;
        mhtmlSoalAI += `Content-Transfer-Encoding: 8bit\r\n\r\n`;
        mhtmlSoalAI += wordHtml + '\r\n\r\n';
        mimeParts.forEach(p => {
            mhtmlSoalAI += `--${boundarySoalAI}\r\n`;
            mhtmlSoalAI += `Content-Type: ${p.mimeType}\r\n`;
            mhtmlSoalAI += `Content-Transfer-Encoding: base64\r\n`;
            mhtmlSoalAI += `Content-ID: <${p.cid}>\r\n\r\n`;
            mhtmlSoalAI += p.base64Data + '\r\n\r\n';
        });
        mhtmlSoalAI += `--${boundarySoalAI}--`;
        finalBlobPartsSoalAI = [mhtmlSoalAI];
    } else {
        finalBlobPartsSoalAI = ['\ufeff' + wordHtml];
    }

    const wordBlob = new Blob(finalBlobPartsSoalAI, { type: 'application/msword' });
    const url = URL.createObjectURL(wordBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Naskah_Soal_AI.doc';
    a.click();

    URL.revokeObjectURL(url);
};

// Fungsi pembantu untuk mengubah file gambar menjadi teks Base64
const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
});
